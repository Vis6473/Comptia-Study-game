 [1,"An isolated area inside a processor protects sensitive code and keys, even from the operating system. What is it called?","A secure enclave",["A TPM","An HSM","Key escrow"],"A secure enclave runs code in protected memory the rest of the system can't read. A TPM is a separate chip for keys and measurements, and an HSM is a dedicated key management appliance.","1.4"],
 [1,"A web server sends its public key and identity details to a certificate authority to get a certificate. What does it send?","A CSR",["A CRL","An OCSP response","A root certificate"],"A certificate signing request carries the public key and the subject's details. The CA verifies them and returns a signed certificate.","1.4"],
 [1,"Why is a longer encryption key generally stronger?","It greatly increases the number of possible keys an attacker must try",["It makes encryption faster","It removes the need for key management","It hides the fact that encryption is used"],"Each extra bit doubles the key space, so brute-forcing a long key becomes impractical.","1.4"],
 [2,"What most separates a nation-state attacker from an unskilled attacker?","Resources and level of sophistication",["Whether they work inside the company","Which operating system they use","Whether they ever use email"],"Threat actors differ in resources and funding, sophistication and capability, and whether they're internal or external.","2.1"],
 [2,"A rival government's hackers quietly copy defense plans over several months. What is their main motivation?","Espionage",["Revenge","Ethical hacking","Service disruption"],"Espionage is about stealing secrets quietly and for a long time, which is typical of nation-state actors.","2.1"],
 [2,"A researcher finds a flaw and reports it privately to the vendor so it can be fixed. What motivation is this?","Ethical",["Blackmail","Revenge","War"],"Ethical hackers aim to improve security, often through responsible disclosure or bug bounty programs.","2.1"],
 [2,"Attackers threaten to publish a company's stolen emails unless it pays them. What motivation is this?","Blackmail",["Espionage","Philosophical beliefs","Ethical"],"Blackmail and extortion use stolen or sensitive data as leverage for payment.","2.1"],
 [2,"An attack aims to knock a country's power grid offline during an armed conflict. What motivation is this?","War",["Financial gain","Blackmail","Ethical"],"Cyber attacks can be part of warfare, targeting critical infrastructure to weaken an opponent.","2.1"],
 [2,"An attacker sends a text message with a link to a fake bank login page. What is this?","Smishing",["Vishing","Pretexting","Typosquatting"],"Smishing is phishing by SMS text message. Vishing uses voice calls, and pretexting is an invented story used to get information.","2.2"],
 [2,"A caller pretends to be from IT and makes up a story about a mailbox migration to get a user's password. What technique is this?","Pretexting",["A watering hole attack","Typosquatting","Brand impersonation"],"Pretexting builds a believable scenario so the victim feels they have a reason to help.","2.2"],
 [2,"A fake website copies a well-known company's logo and design to fool its customers. What is this?","Brand impersonation",["Shadow IT","A watering hole attack","Pretexting"],"Brand impersonation borrows a trusted brand's look to win trust, in websites, emails, ads or apps.","2.2"],
 [2,"Which attack surface do unused network services left running on a server create?","Open service ports",["Default credentials","Removable devices","An image-based vector"],"Every listening service is a potential way in. Close the ports and disable the services that aren't needed.","2.2"],
 [2,"Malicious code is hidden inside a picture attached to an email. Which threat vector is this?","Image-based",["Voice call","Removable device","Unsecure network"],"Images can carry exploits that target image-handling flaws, or hide data and code inside them.","2.2"],
 [2,"Malware is injected straight into a running process's memory so no file is ever written to disk. Which vulnerability type is this?","Memory injection",["SQL injection","Directory traversal","Side loading"],"Memory injection is often fileless, which helps it slip past file-based antivirus. Behavior-based tools such as EDR are better at catching it.","2.3"],
 [2,"A cloud provider doesn't clear memory between customers, so one tenant can read another's leftover data. What is this?","Resource reuse",["VM escape","Jailbreaking","A race condition"],"Resource reuse is a virtualization vulnerability. Providers must wipe memory and storage before giving them to another tenant.","2.3"],
 [2,"A router's firmware has a known flaw, but the model is end-of-life and will never get another update. Which vulnerability type is this?","End-of-life hardware",["A zero-day","A misconfiguration","A cryptographic flaw"],"End-of-life and legacy hardware stops getting fixes, so known flaws stay open for good. Replace it or isolate it.","2.3"],
 [2,"Attackers break into a software vendor's update server and push a poisoned update to every customer. What is this vulnerability?","A malicious update",["Side loading","Resource reuse","A race condition"],"Malicious updates abuse the trust customers place in automatic updates. Code signing and supply chain checks help detect them.","2.3"],
 [2,"A website still signs data with an outdated hash algorithm that has known collisions. What type of vulnerability is this?","A cryptographic vulnerability",["An open service port","A supply chain vulnerability","A mobile device vulnerability"],"Weak or outdated algorithms, short keys and poor key handling are cryptographic vulnerabilities. Move to current algorithms.","2.3"],
 [2,"A user's account shows active sessions from two different places at the same time. What indicator is this?","Concurrent session usage",["Account lockout","Blocked content","Resource inaccessibility"],"Simultaneous sessions from different places suggest that someone else is using the credentials or a stolen session token.","2.4"],
 [2,"Many users are suddenly locked out after repeated failed logins they didn't make. What does this most likely indicate?","An attempted password attack",["A routine patch","A stronger password policy","Normal network traffic"],"Lockouts across many accounts point to brute-force or spraying attempts against those accounts.","2.4"],
 [2,"A server's CPU and network use jump to maximum with no business reason. Which indicator is this?","Resource consumption",["Impossible travel","Out-of-cycle logging","Concurrent session usage"],"Unexplained resource use can mean cryptomining malware, data exfiltration or a denial-of-service attack.","2.4"],
 [2,"An attacker reuses a captured session token to act as a user without ever knowing their password. What attack is this?","Credential replay",["Password spraying","A birthday attack","A downgrade attack"],"Replayed credentials or tokens are accepted as genuine. Short token lifetimes and binding tokens to the device reduce the risk.","2.4"],
 [2,"An attacker uses probability math to find two different inputs that produce the same hash. What attack is this?","A birthday attack",["A replay attack","A downgrade attack","Password spraying"],"The birthday paradox makes collisions far easier to find than you'd expect, which is why longer hashes are used.","2.4"],
 [2,"A company puts its point-of-sale systems on a separate network from employee laptops. Which mitigation is this?","Segmentation",["Patching","Decommissioning","Monitoring"],"Segmentation limits how far an attacker can move from one compromised system and shrinks the scope of compliance audits.","2.5"],
 [2,"Which mitigation cuts a compromised system off from everything else while it's investigated?","Isolation",["Patching","Encryption","Least privilege"],"Isolation contains the threat. Patching fixes known flaws, and least privilege limits what accounts can do.","2.5"],
 [2,"Which mitigation fixes known vulnerabilities in operating systems and applications?","Patching",["Segmentation","Monitoring","Decommissioning"],"Regular patching closes known holes. Test patches first, and use compensating controls when a patch isn't available yet.","2.5"],
 [2,"An access control list on a file share gives the Finance group read-only access. Which mitigation is this?","Permissions",["Encryption","Isolation","Decommissioning"],"Access control lists and permissions limit who can do what with a resource, which is least privilege in practice.","2.5"],
 [2,"Changing default passwords on new devices is part of which practice?","Hardening",["Decommissioning","Monitoring","Isolation"],"Hardening also includes removing unneeded software, disabling unused ports and protocols, and enabling host firewalls and endpoint protection.","2.5"]
];

 ["A hidden reader copies access badges as people walk past","RFID cloning"],["An email from the CEO's real account asks finance to wire money","Business email compromise"],
 ["A text message with a fake package delivery link","Smishing"],["A phone call from fake IT support asking for a password","Vishing"],

/* ---------------- Control Sort ---------------- */
function viewControl(){
  const items=shuffle(CONTROLS).slice(0,10),haul={scrap:0,xp:0};let i=0,score=0,cat=null,typ=null,checked=false,loot="";
  function render(){
    if(i>=items.length)return done();
    const it=items[i];
    const grp=(list,cur,k,ans)=>list.map(v=>{let cls="chip";if(checked){if(v===ans)cls+=" right";else if(v===cur)cls+=" wrong";}
      return `<button class="${cls}" data-${k}="${v}" aria-pressed="${v===cur}"${checked?" disabled":""}>${v}</button>`;}).join("");
    $app.innerHTML=`<div class="panel">
      <div class="qhead"><span class="label">Control Sort · scavenging mission · ${i+1} of ${items.length}</span><span class="mono">${score} / ${(i+(checked?1:0))*2} points · ${haul.scrap} scrap</span></div>
      <div class="progress"><i style="width:${100*i/items.length}%"></i></div>
      <div class="item-card" style="min-height:0"><span class="label">Classify this control</span><div class="it">${esc(expand(it[0]))}</div></div>
      <div class="cs-groups">
        <div><span class="label">Category</span><div class="cs-g">${grp(CTRL_CATS,cat,"c",it[1])}</div></div>
        <div><span class="label">Type</span><div class="cs-g">${grp(CTRL_TYPES,typ,"t",it[2])}</div></div>
      </div>
      ${checked?`<div class="explain ${cat===it[1]&&typ===it[2]?"verdict-ok":"verdict-bad"}"><b>${esc(it[1])} · ${esc(it[2])}</b>${esc(expand(it[3]))}${loot?`<div style="margin-top:6px">${loot}</div>`:""}</div>`:""}
      <div class="row" style="justify-content:flex-end;margin-top:16px">${checked?`<button class="btn primary" id="next">${i+1<items.length?"Next control":"See results"}</button>`:`<button class="btn primary" id="check"${cat&&typ?"":" disabled"}>Check</button>`}</div>
      <p class="muted small" style="margin:14px 0 0">Pick one category and one type. Each correct pick is a point and scavenges ${SCAV.control.scrap} scrap and ${SCAV.control.xp} XP.</p>
    </div>`;
    $app.querySelectorAll("[data-c]").forEach(b=>b.onclick=()=>{cat=b.dataset.c;render();});
    $app.querySelectorAll("[data-t]").forEach(b=>b.onclick=()=>{typ=b.dataset.t;render();});
    const c=document.getElementById("check");if(c)c.onclick=()=>{checked=true;const pts=(cat===it[1])+(typ===it[2]);score+=pts;loot=scavenge("control",pts,haul);render();document.getElementById("next").focus({preventScroll:true});};
    const n=document.getElementById("next");if(n)n.onclick=()=>{i++;cat=null;typ=null;checked=false;loot="";render();};
  }
  function done(){
    const max=items.length*2,best=score>(P.best.control||0);if(best)P.best.control=score;save();
    $app.innerHTML=`<div class="panel result stack"><span class="label">Control Sort complete</span><div class="big">${score}<span class="muted" style="font-size:32px"> / ${max}</span></div>
      <p class="muted" style="margin:0">${best?"New personal best.":"Best: "+P.best.control+"/"+max}</p>
      ${haulLine(haul)}
      <div class="row" style="justify-content:center"><button class="btn primary" id="again">New controls</button><a class="btn" href="#home">Home</a></div></div>`;
    document.getElementById("again").onclick=viewControl;
  }
  const onKey=e=>{if(e.key==="Enter"){const b=document.getElementById("next")||document.getElementById("check");if(b&&!b.disabled){e.preventDefault();b.click();}}};
  document.addEventListener("keydown",onKey);
  cleanup=()=>document.removeEventListener("keydown",onKey);
  render();
}

/* ---------------- Attack Match ---------------- */
function viewAttack(){
  $app.innerHTML=`<div class="panel stack">
    <div><span class="label">Attack Match</span><h2 style="font-size:28px;margin-top:4px">Name the attack. 60 seconds.</h2></div>
    <p class="muted" style="margin:0">Each prompt describes an indicator or scenario. Pick the attack behind it. A wrong answer costs 3 seconds. Keys 1–4 work too.</p>
    <div class="row"><button class="btn primary" id="start">Start</button><span class="muted small mono">Best: ${P.best.attack||0}</span></div>
  </div>`;
  document.getElementById("start").onclick=runAttack;
}
function runAttack(){
  const DUR=60000;let end=Date.now()+DUR,score=0,cur=null,locked=false;const misses=[];
  $app.innerHTML=`<div class="panel" id="bz">
    <div class="qhead"><span class="label">Attack Match</span><span class="mono" id="sc" style="font-size:18px;font-weight:600">0</span></div>
    <div class="timer" id="tm"><i style="width:100%"></i></div>
    <div class="blitz-q" id="bq" style="font-size:clamp(20px,3vw,26px)"></div>
    <div class="grid2" id="bo"></div>
  </div>`;
  const tm=document.getElementById("tm"),bz=document.getElementById("bz");
  function next(){
    locked=false;const a=pick(ATTACKS);
    const others=shuffle([...new Set(ATTACKS.map(x=>x[1]).filter(n=>n!==a[1]))]).slice(0,3);
    cur={a,opts:shuffle([a[1],...others])};
    document.getElementById("bq").textContent=expand(a[0]);
    document.getElementById("bo").innerHTML=cur.opts.map(o=>`<button class="opt" data-v="${esc(o)}" style="font-family:var(--f-body);font-size:16px">${esc(o)}</button>`).join("");
    document.querySelectorAll("#bo .opt").forEach(b=>b.onclick=()=>answer(b));
  }
  function answer(b){
    if(locked)return;locked=true;const ok=b.dataset.v===cur.a[1];
    bz.classList.remove("flash-ok","flash-bad");void bz.offsetWidth;bz.classList.add(ok?"flash-ok":"flash-bad");
    if(ok){score++;S.base.scrap+=2;document.getElementById("sc").textContent=score;setTimeout(next,120);}
    else{end-=3000;misses.push(cur.a);
      document.querySelectorAll("#bo .opt").forEach(x=>{if(x.dataset.v===cur.a[1])x.classList.add("right");else if(x===b)x.classList.add("wrong");});
      setTimeout(next,900);}
  }
  const onKey=e=>{if(/^[1-4]$/.test(e.key)){const b=document.querySelectorAll("#bo .opt")[+e.key-1];if(b)b.click();}};
  document.addEventListener("keydown",onKey);
  const iv=setInterval(()=>{const left=end-Date.now();tm.firstElementChild.style.width=Math.max(0,100*left/DUR)+"%";tm.classList.toggle("low",left<10000);if(left<=0)finish();},100);
  cleanup=()=>{clearInterval(iv);document.removeEventListener("keydown",onKey);};
  function finish(){
    cleanup();cleanup=null;
    const best=score>(P.best.attack||0);if(best)P.best.attack=score;award(score*3);
    const uniq=[...new Map(misses.map(m=>[m[0],m])).values()];
    $app.innerHTML=`<div class="panel result stack">
      <span class="label">Time</span><div class="big">${score}</div>
      <p class="muted" style="margin:0">${best?"New personal best.":"Best: "+P.best.attack}</p>
      ${uniq.length?`<div class="tbl-wrap" style="max-width:620px;margin:0 auto;text-align:left"><table><thead><tr><th>Indicator you missed</th><th>Attack</th></tr></thead><tbody>${uniq.map(m=>`<tr><td>${esc(expand(m[0]))}</td><td><b>${esc(m[1])}</b></td></tr>`).join("")}</tbody></table></div>`:"<p>No misses.</p>"}
      <div class="row" style="justify-content:center"><button class="btn primary" id="again">Run it again</button><a class="btn" href="#home">Home</a></div>
    </div>`;
    document.getElementById("again").onclick=runAttack;
  }
  next();
}
