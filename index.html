 [3,"A country's law requires its citizens' data to be stored and processed inside the country. What concept is this?","Data sovereignty",["Data classification","Data masking","Data in transit"],"Data sovereignty means data is subject to the laws of the country where it is stored. It limits where cloud data can live.","3.3"],
 [3,"A help desk screen shows only the last four digits of a customer's card number. What technique is this?","Data masking",["Tokenization","Encryption","Hashing"],"Masking hides part of the data from people who don't need all of it. Tokenization replaces the whole value with a token.","3.3"],
 [3,"A company's secret manufacturing process, which gives it an edge over competitors, is which data type?","A trade secret",["Regulated data","Public information","Legal information"],"Trade secrets get their value from staying secret, so protection relies on access control and NDAs. Regulated data, such as health or payment data, is governed by laws and standards.","3.3"],
 [3,"Which method lets a company block access to its cloud data from countries where it doesn't operate?","Geographic restrictions",["Data masking","Hashing","Tokenization"],"Geographic restrictions, such as geofencing and geo-IP blocking, limit access based on location.","3.3"],
 [3,"Which technique lets you verify that stored data hasn't changed, without being able to recover the original from the stored value?","Hashing",["Encryption","Tokenization","Masking"],"A hash is a one-way fingerprint. Comparing hashes proves integrity, and the original can't be recovered from the hash. Encryption is reversible with the key.","3.3"],
 [3,"Which disaster recovery site costs the least to keep but takes the longest to bring online?","A cold site",["A hot site","A warm site","A mirrored site"],"A cold site has space and power but little equipment, so recovery takes days or weeks. A hot site is ready almost at once but costs the most.","3.4"],
 [3,"Two servers share storage and take over each other's work if one fails, appearing to users as one system. What is this?","Clustering",["Load balancing","Journaling","Snapshots"],"Clustering joins servers so they act as one and fail over between members. Load balancing spreads requests across independent servers.","3.4"],
 [3,"Running workloads on two different cloud providers so one provider's outage doesn't stop the business is called what?","Multi-cloud",["Hybrid cloud","Single-tenant cloud","Serverless"],"Multi-cloud adds platform diversity, so one provider's failure or compromise doesn't take everything down. Hybrid cloud combines on-premises and cloud resources.","3.4"],
 [3,"What does a backup kept at another location protect against that an on-site backup doesn't?","A disaster that destroys the primary site",["A user deleting one file","A failed disk in a RAID array","A slow network"],"Off-site backups survive fires, floods and site-wide ransomware, while on-site backups restore faster for everyday losses. A common approach is 3-2-1: three copies, on two types of media, with one off-site.","3.4"],
 [3,"Which feature logs every change so a database can be replayed to a point just before a failure?","Journaling",["Snapshots","Replication","Load balancing"],"Journaling records transactions so they can be replayed. Snapshots capture state at one moment, and replication copies data to another location continuously or on a schedule.","3.4"],
 [3,"During a test, production traffic really moves to the secondary data center to prove it works. What type of test is this?","A failover test",["A tabletop exercise","A simulation","A parallel processing test"],"A failover test actually switches to the backup systems. A tabletop exercise is discussion only, and a simulation acts out a scenario without touching production.","3.4"],
 [4,"Which deployment model lets employees use their own phones for work, with company data managed separately?","BYOD",["COPE","CYOD","Corporate-owned, business only"],"Bring your own device uses personal phones, usually with MDM or containerization to separate work data. COPE devices are company-owned but allow personal use, and CYOD lets employees choose from approved company devices.","4.1"],
 [4,"Which tool lets a company enforce passcodes, push apps and remotely wipe lost phones?","MDM",["SIEM","EDR","DLP"],"Mobile device management enforces policy on phones and tablets. A SIEM correlates logs, EDR protects endpoints, and DLP stops sensitive data from leaving.","4.1"],
 [4,"Before release, a tool scans an application's source code for vulnerabilities without running it. What is this?","Static code analysis",["Dynamic analysis","Fuzzing","Sandboxing"],"Static analysis reads the code. Dynamic analysis tests the running application, and fuzzing feeds it random input to find crashes.","4.1"],
 [4,"A web application sets the Secure and HttpOnly flags on its session cookies. What does this protect against?","Cookies being sent over plain HTTP or read by scripts",["SQL injection","Buffer overflows","Denial of service"],"Secure keeps cookies off unencrypted connections, and HttpOnly stops JavaScript from reading them, which blunts most cookie theft through cross-site scripting.","4.1"],
 [4,"A vendor signs its software updates so customers can confirm they came from the vendor and weren't changed. What is this?","Code signing",["Sandboxing","Input validation","Static analysis"],"Code signing uses the vendor's private key, and systems check the signature with the vendor's certificate before installing.","4.1"],
 [4,"Before disposing of old drives, a company needs proof that the data was destroyed. What should the disposal vendor provide?","A certificate of destruction",["A purchase order","A service-level agreement","An acceptable use policy"],"A certificate of destruction records what was destroyed, when and how, which supports compliance and audits.","4.2"],
 [4,"Which sanitization method makes data on a self-encrypting drive unrecoverable almost instantly?","Cryptographic erase",["Deleting the files","Quick formatting","Removing the partition table"],"Cryptographic erase destroys the encryption key, so the remaining data is unreadable. Deleting and formatting leave data recoverable.","4.2"],
 [4,"Why should every asset have an assigned owner?","So someone is accountable for its classification, protection and lifecycle",["So it can be left out of the inventory","So it never needs patching","So it doesn't need monitoring"],"Owners decide classification and access, and make sure the asset is maintained and eventually retired properly.","4.2"],
 [4,"A company uses software to find every device on its network, including ones nobody recorded. What is this activity?","Enumeration for the asset inventory",["Data retention","Sanitization","Penetration testing"],"Enumeration discovers assets so the inventory is complete. You can't protect devices you don't know about.","4.2"],
 [4,"Regulations require keeping financial records for seven years and then deleting them. Which policy covers this?","Data retention",["Acceptable use","Change management","Incident response"],"Retention policies set how long data is kept and when it is destroyed, balancing legal requirements against the risk of keeping data too long.","4.2"],
 [4,"A vulnerability scanner reports a flaw that, on inspection, isn't actually present. What is this?","A false positive",["A false negative","A true positive","A zero-day"],"False positives waste effort, while false negatives, real flaws that go unreported, are more dangerous. Confirm findings before acting on them.","4.3"],
 [4,"Which system gives a vulnerability a severity score from 0 to 10?","CVSS",["CVE","SCAP","OSINT"],"The Common Vulnerability Scoring System rates severity. CVE gives each publicly known vulnerability an ID, SCAP standardizes how tools describe and check security settings, and OSINT is public information gathering.","4.3"],
 [4,"A company pays outside researchers who find and report vulnerabilities in its products. What is this?","A bug bounty program",["A penetration test","A vulnerability scan","Threat hunting"],"Bug bounties reward responsible disclosure from anyone who finds a flaw. A penetration test is a contracted engagement with a set scope.","4.3"],
 [4,"A critical vulnerability can't be patched for a month because the vendor has no fix yet. What should the team do meanwhile?","Apply compensating controls, such as segmentation or extra monitoring",["Ignore it until the patch arrives","Delete the vulnerability report","Turn off logging"],"When remediation isn't possible yet, compensating controls reduce the risk. Document the exception and review it until the patch is applied.","4.3"],
 [4,"After patching a vulnerability, how should the team confirm it's fixed?","Rescan the affected systems",["Close the ticket without checking","Ask the user whether it seems fixed","Wait for next year's audit"],"Validating with a rescan, audit or other verification proves remediation worked before the issue is closed.","4.3"],
 [4,"The SOC gets so many low-value alerts that analysts miss real ones. What should it do?","Tune the alert rules",["Turn off all alerts","Delete old logs","Add more alerts"],"Alert tuning cuts false positives and noise so real incidents stand out. Alert fatigue is a real risk.","4.4"],
 [4,"Which standard lets automated tools check systems against security configuration benchmarks in a common format?","SCAP",["CVSS","SNMP","NetFlow"],"The Security Content Automation Protocol defines common formats for checklists and benchmarks so tools can scan for compliance consistently.","4.4"],
 [4,"Which data shows who talked to whom, on which ports and how much data moved, without the full packet contents?","NetFlow",["Packet capture","Application logs","SNMP traps"],"Flow data is compact and good for spotting unusual connections or data exfiltration. Packet capture holds the contents but needs far more storage.","4.4"],
 [4,"A monitoring agent finds a suspicious file on a laptop and moves it to a protected folder where it can't run. What response is this?","Quarantine",["Archiving","Alert tuning","Log aggregation"],"Quarantine isolates a suspicious file or device so it can be investigated without spreading.","4.4"],
 [4,"Which agent-based or agentless tools compare systems with known vulnerabilities and missing patches?","Vulnerability scanners",["Load balancers","Password managers","Jump servers"],"Vulnerability scanners check systems for known flaws and misconfigurations. Agents run on the host for deeper checks, while agentless scans work over the network.","4.4"],
 [4,"Which email authentication record lists the servers allowed to send mail for a domain?","SPF",["DKIM","DMARC","MX"],"SPF lists authorized senders. DKIM signs messages so changes can be detected, and DMARC tells receivers what to do when SPF or DKIM checks fail and sends reports back.","4.5"],
 [4,"Which tool records activity on endpoints and can automatically isolate a compromised laptop?","EDR",["DLP","NAC","A WAF"],"Endpoint detection and response watches process and file behavior and can act, for example by isolating the host. XDR extends this across endpoints, network, cloud and email.","4.5"],
 [4,"A company stops its users from resolving known malicious domain names. What control is this?","DNS filtering",["DNSSEC","Port security","Group Policy"],"DNS filtering refuses to resolve domains on block lists or in risky categories. DNSSEC proves DNS answers are authentic but doesn't block anything.","4.5"],
 [4,"Which tool alerts when critical system files change unexpectedly?","File integrity monitoring",["A web filter","Data loss prevention","A load balancer"],"FIM hashes important files and alerts on changes, which can reveal malware or unauthorized changes.","4.5"],
 [4,"Which Windows feature lets administrators push security settings, such as password rules, to every domain computer?","Group Policy",["SELinux","DNS filtering","A web proxy"],"Group Policy enforces settings across Active Directory. SELinux provides mandatory access control on Linux.","4.5"],
 [4,"Users sign in with their company account to a partner's application, and the partner trusts the company's identity provider. What is this?","Federation",["Least privilege","Provisioning","Time-of-day restrictions"],"Federation links identity systems across organizations, often with SAML or OpenID Connect, so users don't need separate accounts.","4.6"],
 [4,"An app lets users give it access to their calendar on another service without sharing their password. Which protocol is usually behind this?","OAuth",["LDAP","RADIUS","Kerberos"],"OAuth handles delegated authorization through access tokens. OpenID Connect adds authentication on top of it.","4.6"],
 [4,"Access is granted based on attributes such as the user's department, the device's health and the time of day. What model is this?","Attribute-based access control",["Discretionary access control","Mandatory access control","Role-based access control"],"ABAC evaluates many attributes in a policy. RBAC uses job roles, discretionary access control lets owners decide, and mandatory access control uses labels and clearances set by the system.","4.6"],
 [4,"Files are labeled Secret or Top Secret, and users can only read data at or below their clearance. What model is this?","Mandatory access control",["Discretionary access control","Rule-based access control","Attribute-based access control"],"Mandatory access control is enforced by the system using labels and clearances, and users can't change it.","4.6"],
 [4,"An admin gets elevated rights only for the hour needed to finish a task, and they expire automatically. What is this?","Just-in-time permissions",["Password vaulting","Permanent admin rights","Single sign-on"],"Just-in-time access is part of privileged access management. It shrinks the window in which a stolen admin account is useful.","4.6"],
 [4,"Which password practice does current guidance favor most for strength?","Long passphrases",["Forced changes every 30 days","Short passwords with special characters","Reusing one strong password across sites"],"Length adds the most strength, and frequent forced changes lead to predictable patterns. Password managers make long, unique passwords practical.","4.6"],
 [4,"Which platform automates responses to alerts with playbooks, such as disabling an account and opening a ticket?","SOAR",["A SIEM on its own","DLP","NAC"],"Security orchestration, automation and response runs playbooks across tools. A SIEM collects and correlates events, and SOAR acts on them.","4.7"],
 [4,"What is a benefit of scripting new user account creation?","Accounts are created consistently with the right baseline permissions",["Approvals are no longer needed","Accounts never expire","Logging is turned off"],"Automation enforces baselines, saves time and cuts the errors that come with manual setup.","4.7"],
 [4,"What is a risk of relying heavily on security automation?","A broken script or integration can become a single point of failure",["It always brings costs to zero","It removes the need for monitoring","It can never be maintained"],"Automation adds complexity, cost, technical debt and support needs. If a critical automation fails, many processes can fail with it.","4.7"],
 [4,"Automation that stops developers from deploying cloud resources that break security rules is called what?","Guard rails",["Technical debt","Escalation","Ticket creation"],"Guard rails let teams move fast while automatically blocking unsafe configurations.","4.7"],
 [4,"How does automation act as a workforce multiplier for a small security team?","It handles repetitive tasks so analysts can focus on complex work",["It replaces the need for any staff","It removes all false positives","It makes incidents impossible"],"Automation speeds up reaction time and lets a few people do more.","4.7"],
 [4,"What is the correct order of the incident response phases?","Preparation, detection, analysis, containment, eradication, recovery, lessons learned",["Detection, preparation, recovery, analysis, containment, eradication, lessons learned","Containment, preparation, detection, eradication, analysis, recovery, lessons learned","Preparation, containment, detection, analysis, recovery, eradication, lessons learned"],"Preparation comes first. Then you detect and analyze, contain the damage, eradicate the cause, recover, and capture lessons learned.","4.8"],
 [4,"An infected server is disconnected from the network but left running for investigation. Which phase is this?","Containment",["Eradication","Recovery","Preparation"],"Containment limits the spread. Eradication removes the threat, such as deleting malware and closing the hole, and recovery returns systems to normal.","4.8"],
 [4,"What records everyone who handled a piece of evidence, when they had it and why?","Chain of custody",["Legal hold","E-discovery","Root cause analysis"],"Chain of custody shows the evidence wasn't tampered with, so it can be used in court.","4.8"],
 [4,"A lawsuit is expected, so the company is told to preserve all related email and documents. What is this?","A legal hold",["A data retention expiry","Chain of custody","Threat hunting"],"A legal hold overrides normal deletion schedules for the relevant data until the matter is resolved.","4.8"],
 [4,"Analysts search logs proactively for signs of an attacker that no alert has flagged. What is this?","Threat hunting",["Alert tuning","Incident recovery","Vulnerability scanning"],"Threat hunting assumes attackers may already be inside and looks for them using hypotheses and threat intelligence.","4.8"],
 [4,"Which data source best shows whether an internal host connected to a known malicious IP address?","Firewall logs",["Application logs from an unrelated server","A vulnerability scan","An asset inventory"],"Firewall logs record allowed and blocked connections with source and destination addresses and ports.","4.9"],
 [4,"An investigator needs the exact contents of network traffic during an attack. What should they review?","A packet capture",["NetFlow records","A dashboard","Metadata only"],"Packet captures contain whole packets, including payloads. Flow data and metadata summarize traffic without the contents.","4.9"],
 [4,"Email headers showing the sending server, route and timestamps are an example of which data source?","Metadata",["Packet capture","Vulnerability scan output","Firewall logs"],"Metadata is data about data, such as headers, file properties and timestamps, and it often reveals origins and timelines.","4.9"],
 [4,"Which logs would show which user started a suspicious process on a workstation?","Endpoint and OS security logs",["Firewall logs","NetFlow","DNS filtering reports"],"Endpoint and OS security logs record logons, process creation and privilege use on the host.","4.9"],
 [4,"Which source gives a manager a quick visual summary of security events and trends?","A dashboard",["A raw packet capture","A hex dump","A chain of custody form"],"Dashboards and automated reports summarize data for decisions. Investigators drill into logs and captures for the details.","4.9"],
 [5,"Which document states what employees may and may not do with company IT resources?","An acceptable use policy",["A business continuity plan","A standard","A playbook"],"An AUP sets rules for using company systems, and users usually acknowledge it. Policies set direction, standards set specific requirements, and playbooks give step-by-step responses.","5.1"],
 [5,"A requirement that all laptops use AES-256 full-disk encryption is best described as what?","A standard",["A guideline","A policy","A procedure"],"Standards are specific, mandatory requirements that support a policy. Guidelines are recommendations, and procedures are step-by-step instructions.","5.1"],
 [5,"Under privacy law, which role decides why and how personal data is processed?","The data controller",["The data processor","The data custodian","The data subject"],"The controller sets the purposes and means of processing. A processor handles data for the controller, a custodian looks after it day to day, and the data subject is the person the data is about.","5.1"],
 [5,"Who handles the day-to-day storage, backup and protection of data according to the owner's rules?","The data custodian",["The data owner","The data subject","The auditor"],"Custodians, also called stewards, put in place the controls that data owners decide on.","5.1"],
 [5,"Step-by-step instructions for handling a reported phishing email are an example of what?","A playbook",["A policy","A standard","A guideline"],"Playbooks give repeatable steps for specific situations and are often automated with SOAR.","5.1"],
 [5,"A server is worth $40,000, and a fire would destroy 50% of its value. What is the single loss expectancy?","$20,000",["$40,000","$80,000","$2,000"],"SLE = asset value × exposure factor, so $40,000 × 0.5 = $20,000.","5.2"],
 [5,"An event has a single loss expectancy of $20,000 and is expected once every 4 years. What is the annualized loss expectancy?","$5,000",["$80,000","$20,000","$4,000"],"ALE = SLE × ARO. The annualized rate of occurrence is 1 in 4 years, or 0.25, so $20,000 × 0.25 = $5,000.","5.2"],
 [5,"A company buys cyber insurance to cover the cost of a breach. Which risk strategy is this?","Transfer",["Accept","Avoid","Mitigate"],"Transferring shifts the financial impact to another party. Avoiding stops the risky activity, mitigating reduces likelihood or impact, and accepting knowingly takes the risk.","5.2"],
 [5,"Which document tracks identified risks with their owners, ratings and treatment?","A risk register",["A business impact analysis","A playbook","A service-level agreement"],"The risk register is the central list of risks and how each one is being handled.","5.2"],
 [5,"How much risk an organization is willing to take on to reach its goals is called its what?","Risk appetite",["Risk register","Risk transfer","Exposure factor"],"Risk appetite is the overall willingness to take risk, described as expansionary, neutral or conservative. Risk tolerance is the acceptable variation for specific risks.","5.2"],
 [5,"Which contract clause lets a company inspect a vendor's security controls?","A right-to-audit clause",["A non-disclosure agreement","A memorandum of understanding","A work order"],"A right-to-audit clause gives contractual permission to review the vendor's controls or the evidence for them.","5.3"],
 [5,"Which agreement sets the overall terms for an ongoing vendor relationship, with each project defined in later documents?","An MSA",["An SOW","An NDA","An SLA"],"A master service agreement sets the general terms, and each statement of work or work order defines a specific job. An SLA sets measurable service levels.","5.3"],
 [5,"Which agreement defines measurable service commitments, such as 99.9% uptime and set response times?","An SLA",["An MOU","An NDA","A BPA"],"A service-level agreement sets measurable targets and what happens when they're missed. An MOU states shared intent, and an NDA protects confidential information.","5.3"],
 [5,"Before signing with a new cloud vendor, a company reviews its security certifications, financial health and past breaches. What is this?","Due diligence",["A conflict of interest","A legal hold","Risk acceptance"],"Due diligence is the research done before choosing a vendor, and vendor monitoring continues it afterward.","5.3"],
 [5,"Which document is a less formal statement of shared intent between two parties and often isn't legally binding?","An MOU",["An MSA","An SLA","A work order"],"A memorandum of understanding records shared goals. A memorandum of agreement is more specific about each party's responsibilities.","5.3"],
 [5,"Under privacy laws such as GDPR, what lets a person ask an organization to delete their personal data?","The right to be forgotten",["Data sovereignty","A legal hold","Attestation"],"The right to erasure, or right to be forgotten, lets data subjects ask for deletion when there's no legal reason to keep the data.","5.4"],
 [5,"Which is a possible consequence of failing a regulatory compliance requirement?","Fines and sanctions",["Automatic certification","Lower insurance premiums","A guaranteed contract renewal"],"Non-compliance can bring fines, sanctions, reputational damage, lost licenses and contract problems.","5.4"],
 [5,"A company's leaders formally confirm in writing that required controls are in place. What is this?","Attestation",["Due diligence","A data inventory","A penetration test"],"Attestation is a formal statement that something is true, often required for compliance reporting.","5.4"],
 [5,"A report on the organization's compliance status is sent to a regulator. What type of reporting is this?","External compliance reporting",["Internal compliance reporting","A risk register update","A playbook"],"External reporting goes to regulators, auditors or customers. Internal reporting goes to management and the board.","5.4"],
 [5,"Why do organizations keep a data inventory for privacy compliance?","To know what personal data they hold, where it is and why",["To avoid retention rules","To share data freely","To skip encryption"],"You can't protect, retain or delete data you can't find. An inventory supports privacy requests and audits.","5.4"],
 [5,"Testers get full network diagrams and source code before the test begins. What type of test environment is this?","A known environment",["An unknown environment","A partially known environment","Passive reconnaissance"],"A known environment test gives full information. An unknown environment test gives none, and a partially known one gives some.","5.5"],
 [5,"A tester gathers information from public websites and DNS records without touching the target's systems. What is this?","Passive reconnaissance",["Active reconnaissance","Exploitation","Pivoting"],"Passive reconnaissance avoids direct contact, so it's hard to detect. Active reconnaissance, such as port scanning, touches the target.","5.5"],
 [5,"An independent firm reviews a company's controls and issues a report for its customers. What type of audit is this?","An independent third-party audit",["A self-assessment","An internal audit","A tabletop exercise"],"Third-party audits give customers and regulators independent assurance. Internal audits are run by the organization's own audit function.","5.5"],
 [5,"Attackers and defenders work together, sharing findings in real time to improve detection. What type of penetration test is this?","Integrated",["Offensive","Defensive","Physical"],"Integrated testing, often called purple teaming, combines offensive and defensive teams. Offensive testing simulates attackers, and defensive testing focuses on detection and response.","5.5"],
 [5,"Which group usually oversees the internal audit function and reports to the board?","The audit committee",["The help desk","The data processors","The change advisory board"],"The audit committee gives independent oversight of audits and compliance.","5.5"],
 [5,"The security team sends simulated phishing emails to employees and tracks who clicks. What is this?","A phishing campaign",["A watering hole attack","A server penetration test","Threat hunting"],"Phishing campaigns measure and build awareness. Follow-up training for people who click works better than punishment.","5.6"],
 [5,"An employee receives a suspicious email asking for their password. What should training tell them to do?","Report it through the official reporting process",["Reply and ask for proof","Forward it to coworkers as a warning","Delete it and say nothing"],"Reporting lets the security team block the sender and warn others. Easy tools, such as a report button, increase reporting.","5.6"],
 [5,"A user suddenly starts downloading large amounts of data at 3 AM. Which awareness topic covers spotting this?","Anomalous behavior recognition",["Password management","Removable media handling","Policy acknowledgment"],"Training helps staff and analysts notice risky, unexpected or unintentional behavior that may signal a compromise or an insider threat.","5.6"],
 [5,"Why do remote and hybrid workers need specific security awareness training?","They work on home networks and in public places with different risks",["They never handle company data","They don't need passwords","Remote work has no security risk"],"Remote workers face shoulder surfing, insecure home Wi-Fi and shared family devices, so training covers those situations.","5.6"],
 [5,"When should security awareness training happen?","At onboarding and then on a recurring schedule",["Only once, at hiring","Only after a breach","Never, if a policy exists"],"Initial training at hiring plus recurring refreshers keeps awareness current as threats change.","5.6"],
 [1,"Alice encrypts a message with Bob's public key. Which key can decrypt it?","Bob's private key",["Alice's private key","Bob's public key","Alice's public key"],"In asymmetric encryption, data encrypted with a public key can only be decrypted with the matching private key, which only its owner holds.","1.4"],
 [1,"To create a digital signature, which key does the sender use?","The sender's private key",["The sender's public key","The recipient's public key","The recipient's private key"],"The sender signs a hash of the message with their private key, and anyone can verify it with the sender's public key. That provides integrity, authentication and non-repudiation.","1.4"],
 [1,"A trusted third party keeps copies of an organization's encryption keys so data can be recovered if the keys are lost. What is this?","Key escrow",["Key stretching","Key exchange","Certificate pinning"],"Key escrow protects against lost keys but must itself be tightly controlled, since anyone with the escrowed keys can decrypt the data.","1.4"],
 [1,"Which technique hides a message inside an ordinary-looking image file?","Steganography",["Tokenization","Data masking","Hashing"],"Steganography conceals that a message exists at all. Encryption hides the content but not the fact that a message was sent.","1.4"],
 [1,"Which system records transactions in a shared chain of blocks where changing an old record breaks every block after it?","A blockchain",["A certificate revocation list","A key management system","A secure enclave"],"Each block includes the hash of the one before, so tampering is evident. The ledger is distributed, so no single party controls it.","1.4"],
 [2,"Attackers exploit a software flaw that the vendor doesn't know about and has no patch for. What is this?","A zero-day",["A misconfiguration","A legacy system","A supply chain flaw"],"Zero-day vulnerabilities have no patch, so defense relies on layered controls, behavior-based detection and fast response.","2.3"],
 [2,"A cloud storage bucket holding customer data is readable by anyone on the internet. What type of vulnerability is this?","A misconfiguration",["A zero-day","A buffer overflow","A race condition"],"Misconfigurations, such as public storage, default settings and open ports, cause many cloud breaches. Configuration reviews and automated checks catch them.","2.3"],
 [2,"A reader hidden in a backpack copies employees' access badges as they walk past. What attack is this?","RFID cloning",["Tailgating","Shoulder surfing","Bluejacking"],"RFID cloning copies a badge's signal. Badges with encryption and mutual authentication, plus shielded sleeves, resist it.","2.4"],
 [2,"Attackers capture a user's authentication traffic and resend it later to log in as them. What attack is this?","Replay",["Downgrade","Collision","Spraying"],"Replay attacks reuse captured valid data. Timestamps, nonces and session tokens that expire defeat them.","2.4"],
 [2,"An attacker forces a connection to fall back to an older, weaker encryption protocol. What attack is this?","A downgrade attack",["A birthday attack","A replay attack","A collision attack"],"Downgrade attacks abuse backward compatibility. Disabling old protocols such as SSL and early TLS versions removes the weaker option.","2.4"],
 [2,"Logs are missing for an hour on a server that was running normally the whole time. What could this indicate?","An attacker covering their tracks",["Routine log rotation","Better system performance","A successful patch"],"Missing or out-of-cycle logs are indicators of compromise. Sending logs to a central collector in real time makes them much harder to erase.","2.4"],
 [3,"Which data classification fits a product brochure that's handed out at trade shows?","Public",["Confidential","Restricted","Sensitive"],"Public data can be shared freely without harm. Higher classifications, such as confidential and restricted, need increasing protection.","3.3"],
 [3,"An attacker gets into the internal network through a misconfigured remote access server. Which design choice most limits what they can reach next?","Segmenting the network into security zones",["Using one flat network","Turning off logging","Removing internal firewalls"],"Segmentation limits lateral movement, so a foothold in one zone doesn't give access to everything.","3.2"],
 [3,"Which device belongs in the screened subnet, in front of internal web servers, to shield them from direct internet access?","A reverse proxy",["A domain controller","An internal file server","The customer database server"],"Internet-facing intermediaries such as reverse proxies and load balancers sit in the screened subnet. Domain controllers, file servers and databases stay on internal networks.","3.2"],
 [4,"Which Wi-Fi setting uses SAE so that a shared passphrase can't be cracked offline from a captured handshake?","WPA3-Personal",["WPA2-Personal","WEP","An open network with a captive portal"],"WPA3-Personal uses SAE, which resists offline dictionary attacks and gives forward secrecy. WEP is broken, and a captured WPA2-Personal handshake can be cracked offline.","4.1"],
 [4,"A company wants Wi-Fi users to authenticate one by one with their directory accounts. What should the access points use?","WPA3-Enterprise with RADIUS",["WPA3-Personal","WEP with a long key","MAC filtering on its own"],"Enterprise mode authenticates each user through 802.1X and RADIUS, so access can be revoked per person.","4.1"],
 [4,"Analysts open a suspicious file in an isolated environment where it can't affect any real systems. What is this?","Sandboxing",["Code signing","Static analysis","Input validation"],"A sandbox limits what code can reach, which makes it useful for testing and for safely detonating suspicious files.","4.1"],
 [4,"When collecting evidence from a running computer, what should an investigator capture first?","The contents of memory",["Archived backup tapes","Files on the hard drive","Printed reports"],"The order of volatility says to collect the most short-lived data first. Memory is lost when power goes, while disks and backups last much longer.","4.8"],
 [4,"After an incident, the team meets to discuss what went well and what should change. Which phase is this?","Lessons learned",["Preparation","Containment","Detection"],"Lessons learned feeds improvements back into preparation, such as updated playbooks, controls and training.","4.8"],
 [4,"Which authentication factor is a code from a phone app that changes every 30 seconds?","Something you have",["Something you know","Something you are","Somewhere you are"],"A time-based one-time password app proves you have the enrolled device. Pairing it with a password gives two different factors.","4.6"],
 [4,"An employee leaves the company. What should happen to their accounts right away?","Disable them as part of deprovisioning",["Leave them active for a year","Hand them to the replacement","Delete the audit logs"],"Prompt deprovisioning keeps former employees, or attackers using their accounts, out. Disabling before deleting keeps the audit trail.","4.6"],
 [5,"Which analysis identifies the most critical business processes and how long each can be down?","A business impact analysis",["A risk register","A vulnerability scan","A penetration test"],"A business impact analysis sets recovery priorities and recovery time objectives based on how much each outage would hurt.","5.2"],
 [5,"A company decides a risk is too great and stops offering the service that creates it. Which risk strategy is this?","Avoid",["Transfer","Accept","Mitigate"],"Avoidance removes the risk by stopping the activity. It's the right choice when the risk outweighs the benefit.","5.2"],
 [5,"A risk is low, and fixing it would cost more than the possible loss, so management formally signs off on it. Which strategy is this?","Accept",["Avoid","Transfer","Mitigate"],"Acceptance is a deliberate, documented decision, sometimes recorded as a formal exception, and it should be reviewed over time.","5.2"],
 [3,"A company defines its cloud servers, networks and firewall rules in version-controlled templates and deploys them automatically. What is this?","Infrastructure as code",["Serverless computing","Software-defined networking","Microservices"],"IaC makes environments repeatable and reviewable. A flaw in a template is copied into every deployment, though, so templates need security review and scanning.","3.1"],
 [3,"Which design separates the network's control plane from its data plane so a central controller can program traffic flows in software?","Software-defined networking",["Air gapping","Physical isolation","Containerization"],"SDN centralizes control, which makes changes fast and consistent. It also makes the controller a high-value target that needs strong protection.","3.1"],
 [3,"A factory's SCADA system can't be patched because the vendor no longer supports it. What is the best way to reduce its risk?","Isolate it on a segmented network with strict access controls and monitoring",["Connect it to the internet for remote updates","Install a consumer antivirus app on it","Leave it alone, since industrial systems aren't targeted"],"ICS and SCADA systems often can't be patched, so segmentation, limited access and monitoring compensate. Several well-known attacks have targeted industrial systems.","3.1"],
 [3,"Smart thermostats and cameras on a corporate network are a security concern mainly because of what?","Weak default security and infrequent updates",["Their high processing power","Their enterprise-grade encryption","Their strict access controls"],"IoT devices often ship with default credentials, limited update support and weak security, so they belong on their own network segment.","3.1"],
 [3,"Moving a workload to a cloud provider makes the provider responsible for some risks under the contract. Which architecture consideration is this?","Risk transference",["Ease of recovery","Patch availability","Compute"],"Using a provider transfers some risks to it, but the organization stays accountable for its data and for how it configures the service.","3.1"],
 [3,"An IPS is placed inline so it can block attacks. What is the trade-off compared with a passive sensor?","It becomes a point of failure in the traffic path",["It can only alert and never block","It can't see any traffic","It removes the need for a firewall"],"Inline devices can stop attacks but can also drop legitimate traffic or fail outright. That's why their failure mode, fail-open or fail-closed, matters.","3.2"],
 [3,"Which firewall adds application awareness, user identity and built-in intrusion prevention to traditional port and address filtering?","A next-generation firewall",["A stateless Layer 4 filter","A load balancer","A network tap"],"A next-generation firewall inspects traffic up to Layer 7 and can make decisions by application and user, not just by port and address.","3.2"],
 [3,"Remote employees need encrypted access to the whole internal network from their laptops. Which technology fits best?","A remote access VPN",["A screened subnet","A web application firewall","Port mirroring"],"A remote access VPN builds an encrypted tunnel, using IPsec or TLS, from each device into the network.","3.2"],
 [3,"Why should security teams shrink the attack surface when designing infrastructure?","Fewer exposed services and entry points leave attackers fewer ways in",["It makes monitoring unnecessary","It removes the need for patching","It lets every port stay open safely"],"The attack surface is everything exposed: services, interfaces, accounts and devices. Removing what isn't needed is one of the most effective controls.","3.2"],
 [3,"During a firewall failure, the business decides traffic should keep flowing uninspected rather than stop. Which failure mode is this?","Fail-open",["Fail-closed","Active-active","Load shedding"],"Fail-open favors availability over security. Choose it only when an outage would cost more than the risk of uninspected traffic.","3.2"],
 [3,"Patient health records that laws require to be protected are an example of which data type?","Regulated data",["A trade secret","Public information","Intellectual property"],"Regulated data, such as health, payment or personal data, is governed by laws and standards that set how it must be protected.","3.3"],
 [3,"Which control best protects data moving between a browser and a web server?","TLS encryption",["Full-disk encryption","Data masking","Tokenization"],"TLS encrypts the connection. Full-disk encryption protects data at rest, and masking and tokenization protect data in storage or on screen.","3.3"],
 [3,"A company lets only the payroll team open payroll files. Which data protection method is this?","Permission restrictions",["Geographic restrictions","Obfuscation","Hashing"],"Permissions enforce least privilege on data. Combined with classification labels, they keep sensitive data away from people who don't need it.","3.3"],
 [3,"Which classification usually covers information that would seriously harm the company if disclosed early, such as unreleased financial results?","Confidential",["Public","General","Internal newsletter"],"Higher classifications, such as confidential and restricted, get stronger controls: encryption, tight access and careful handling.","3.3"],
 [3,"Data such as a barcode or encoded string that people can't read directly but systems can process is called what?","Non-human-readable data",["Human-readable data","Public data","Regulated data"],"Non-human-readable data still needs protection, since tools can decode it. Encoding is not encryption.","3.3"],
 [3,"A company places its backup data center in a different region from its main one. Which resilience practice is this?","Geographic dispersion",["Platform diversity","Journaling","Capacity planning"],"Distance protects against regional disasters, such as hurricanes, floods or wide power outages, hitting both sites at once.","3.4"],
 [3,"Which planning activity makes sure there will be enough people, technology and infrastructure to keep operating during a disaster?","Capacity planning",["Load balancing","Snapshots","A tabletop exercise"],"Capacity planning covers people, technology and infrastructure, so recovery doesn't fail for lack of staff or resources.","3.4"],
 [3,"A backup system runs alongside the primary on the same real workload so results can be compared without switching over. What type of test is this?","Parallel processing",["A tabletop exercise","A simulation","A failover"],"Parallel processing proves the backup system produces correct results without risking production.","3.4"],
 [3,"Which power device gives servers a few minutes of battery so they can ride through short outages or shut down cleanly?","A UPS",["A generator","A power distribution unit","A surge protector"],"An uninterruptible power supply bridges short outages and the gap until a generator starts. Generators run for long outages, and a surge protector only clips spikes.","3.4"],
 [3,"Why should backups themselves be encrypted?","So lost or stolen backup media doesn't expose the data",["So backups restore faster","So backups take less space","So backups never need testing"],"Backups hold the same sensitive data as production, often for years. Encrypt them and keep the keys protected separately.","3.4"],
 [5,"Which document gives recommendations that employees should consider but aren't required to follow?","A guideline",["A standard","A policy","A procedure"],"Guidelines are advisory. Policies and standards are mandatory, and procedures give required steps.","5.1"],
 [5,"Which process makes sure a departing employee's accounts are disabled and company equipment is returned?","Offboarding",["Onboarding","Change management","Data retention"],"Offboarding removes access promptly and recovers assets. Onboarding grants the access a new hire needs.","5.1"],
 [5,"A payroll company processes employee data on behalf of its client, following the client's instructions. Under privacy law, what is the payroll company?","A data processor",["A data controller","A data owner","A data subject"],"Processors act on the controller's instructions. The controller stays responsible for deciding why and how the data is used.","5.1"],
 [5,"A company puts all security decisions with one central team instead of each business unit. What governance structure is this?","Centralized",["Decentralized","Federated by department","Outsourced to processors"],"Centralized governance gives consistency and control. Decentralized governance lets business units move faster but can lead to uneven security.","5.1"],
 [5,"A team rates risks as high, medium or low using expert judgment instead of dollar values. What type of risk analysis is this?","Qualitative",["Quantitative","Annualized","Actuarial"],"Qualitative analysis uses ratings and judgment. Quantitative analysis puts numbers on risk, such as single loss expectancy and annualized loss expectancy.","5.2"],
 [5,"A flood is expected once every 50 years. What is its annualized rate of occurrence?","0.02",["50","0.5","2"],"The annualized rate of occurrence is how many times a year an event is expected: 1 ÷ 50 = 0.02.","5.2"],
 [5,"A company adds extra firewalls to lower the chance of a breach. Which risk strategy is this?","Mitigate",["Transfer","Avoid","Accept"],"Mitigation reduces a risk's likelihood or impact with controls.","5.2"],
 [5,"Which measure gives early warning that a risk is growing, such as a rising count of unpatched servers?","A key risk indicator",["A risk register","Risk appetite","An exposure factor"],"Key risk indicators are tracked over time and trigger action when they cross a set threshold.","5.2"],
 [5,"A vendor agrees in writing to keep a company's confidential information private. Which agreement is this?","An NDA",["An MSA","An SLA","A BPA"],"A non-disclosure agreement protects confidential information shared between the parties.","5.3"],
 [5,"Which document spells out the specific tasks, deliverables and timeline for one project under a larger vendor contract?","A statement of work",["A memorandum of understanding","A non-disclosure agreement","A business partners agreement"],"A statement of work, or work order, defines one engagement. The master service agreement covers the overall relationship.","5.3"],
 [5,"Before picking a vendor, a company checks whether the manager approving the deal owns shares in that vendor. What is it checking for?","A conflict of interest",["Due care","A right-to-audit clause","Supply chain analysis"],"Conflicts of interest can bias vendor selection, so due diligence looks for them.","5.3"],
 [5,"After signing a contract, a company sends its vendor a yearly security questionnaire and reviews the answers. What activity is this?","Vendor monitoring",["Vendor selection","Penetration testing","Offboarding"],"Vendor risk changes over time, so monitoring continues through questionnaires, audits and reviews of any incidents.","5.3"],
 [5,"A company keeps its security controls maintained and working long after putting them in place. Which concept describes this ongoing effort?","Due care",["Due diligence","Attestation","Data sovereignty"],"Due diligence is researching and planning what's needed. Due care is acting on it and keeping the controls in place.","5.4"],
 [5,"Under GDPR, what is the person that personal data is about called?","The data subject",["The data controller","The data processor","The data custodian"],"Data subjects have rights over their data, such as access, correction and erasure.","5.4"],
 [5,"A financial firm repeatedly fails compliance audits, and its regulator revokes its permission to operate. Which consequence of non-compliance is this?","Loss of license",["Reputational damage","A contractual impact","A warning letter"],"Regulators can revoke licenses after serious or repeated failures, which can end the business.","5.4"],
 [5,"Which approach lets a company check its compliance continuously instead of only during yearly audits?","Automated compliance monitoring",["A yearly self-attestation","A spreadsheet reviewed once a year","Waiting for the regulator's next visit"],"Automation checks configurations and controls constantly and flags drift quickly.","5.4"],
 [5,"Testers get no information about the target except its name, like a real outside attacker. What type of test is this?","An unknown environment test",["A known environment test","A partially known environment test","A self-assessment"],"Unknown environment testing shows what an outsider can find. Known environment testing is faster and more thorough, and partially known sits in between.","5.5"],
 [5,"A tester runs port scans against a target's servers to see which services are listening. What is this?","Active reconnaissance",["Passive reconnaissance","Social engineering","A tabletop exercise"],"Active reconnaissance touches the target's systems, so it can be detected and logged.","5.5"],
 [5,"A tester talks their way past reception and plugs a device into a conference room network port. What type of test is this?","A physical penetration test",["A vulnerability scan","A code review","A self-assessment"],"Physical tests check locks, badges, guards and staff awareness, often combined with social engineering.","5.5"],
 [5,"A government regulator visits a bank to check that it meets banking security rules. What type of assessment is this?","A regulatory examination",["An internal audit","A self-assessment","A bug bounty"],"Regulators examine the organizations they regulate directly. Internal audits and self-assessments are done by the organization itself.","5.5"],
 [5,"Why does security awareness training warn employees about unfamiliar USB cables and chargers?","Malicious cables can hide hardware that attacks the device",["Unfamiliar cables always charge slowly","Cables can't carry data","Only USB drives can be malicious"],"Some cables hide chips that type keystrokes or open a remote connection, so only use trusted cables and media.","5.6"],
 [5,"An employee posts a photo of their desk online, and their badge and a sticky-note password are visible. Which training topic covers this?","Operational security",["Data retention","Change management","Risk transfer"],"Operational security training teaches people not to leak useful details through photos, social media or casual conversation.","5.6"],
 [5,"Which training topic helps employees recognize when a coworker is collecting unusual amounts of sensitive data?","Insider threat awareness",["Password management","Travel safety","A clean desk policy"],"Insider threat training teaches the warning signs and how to report concerns confidentially.","5.6"],
 [5,"What should come first when building a security awareness program?","Assess the audience and risks to decide what training is needed",["Buy the biggest training library available","Punish employees who click phishing tests","Send one email and skip planning"],"Developing a program starts with the audience and risks, then content and delivery, then measuring results to improve.","5.6"],
 [1,"Management runs a yearly risk assessment to decide where to invest in security. Which control category is this?","Managerial",["Operational","Technical","Physical"],"Managerial controls cover planning, risk assessment and oversight. Operational controls are the day-to-day activities people carry out, such as log reviews.","1.1"],
 [1,"Which control type is meant to stop an incident before it happens, such as a locked door?","Preventive",["Detective","Corrective","Deterrent"],"Preventive controls block an action outright. A deterrent only discourages it, a detective control spots it, and a corrective control limits the damage afterward.","1.1"],
 [1,"A tool alerts the security team whenever critical system files change. What control type is it?","Detective",["Preventive","Directive","Compensating"],"It doesn't stop the change. It notices it and reports it, which makes it detective.","1.1"],
 [1,"A network firewall belongs to which control category?","Technical",["Managerial","Operational","Physical"],"Technical controls are enforced by hardware or software. Physical controls protect places, and managerial and operational controls are carried out by people.","1.1"],
 [1,"Fences, locks and exterior lighting belong to which control category?","Physical",["Technical","Managerial","Operational"],"Physical controls protect buildings, rooms and equipment. They can be preventive, like locks, or deterrent, like lighting.","1.1"],
 [1,"Which part of AAA records what a user did, such as which files they opened and when?","Accounting",["Authentication","Authorization","Availability"],"Authentication proves who you are, authorization decides what you may do, and accounting logs what you actually did.","1.2"],
 [1,"In zero trust, which data plane component actually allows or blocks a user's connection?","The policy enforcement point",["The policy engine","The policy administrator","The implicit trust zone"],"The policy engine decides, the policy administrator passes the decision along, and the policy enforcement point applies it to the traffic.","1.2"],
 [1,"A small room with two doors, where the second won't open until the first has closed, controls entry to a data center. What is it?","An access control vestibule",["A set of bollards","A honeynet","A perimeter fence"],"An access control vestibule, once called a mantrap, lets one person through at a time and stops tailgating.","1.2"],
 [1,"Fake credentials are planted in a database so that any attempt to use them sets off an alert. What are they called?","Honeytokens",["Honeyfiles","A honeynet","Salts"],"Honeytokens are decoy data, such as credentials, API keys or records, that no legitimate process uses. A honeyfile is a decoy file.","1.2"],
 [1,"Which part of the CIA triad does a denial-of-service attack mainly target?","Availability",["Confidentiality","Integrity","Non-repudiation"],"Denial of service keeps legitimate users from reaching a system. Confidentiality is about keeping data secret, and integrity is about keeping it unaltered.","1.2"],
 [1,"Who should approve a significant change to a production firewall before it's made?","The change advisory board or the designated approvers",["Any administrator, without review","The vendor's sales team","Nobody, as long as the change is urgent"],"Change management needs an approval process with owners and stakeholders. Emergency changes are still approved, sometimes after the fact, and documented.","1.3"],
 [1,"A change request names the person accountable for the system being changed. Which change management element is this?","Ownership",["An allow list","Version control","Downtime"],"The owner answers for the system and the change's outcome. Stakeholders are everyone the change affects.","1.3"],
 [1,"Before changing the authentication server, the team lists every application that relies on it and how each would be affected. What is this?","An impact analysis",["A backout plan","A maintenance window","A standard operating procedure"],"An impact analysis predicts what a change will affect, so problems can be planned for before they happen.","1.3"],
 [1,"Why are changes tested in a staging environment before they reach production?","To find problems before they affect users",["To skip the approval step","To avoid documenting the change","To shorten the maintenance window"],"Test results support the approval decision and lower the chance of an outage.","1.3"],
 [1,"Adding a new malicious IP range to a firewall's deny list should still go through which process?","Change management",["Incident eradication","Data retention","Vendor monitoring"],"Even small rule changes can break things, so they go through change management, often as a pre-approved standard change.","1.3"],
 [1,"Which algorithm is a fast symmetric cipher commonly used to encrypt data at rest?","AES",["RSA","ECC","Diffie-Hellman"],"AES is symmetric and fast for bulk data. RSA and ECC are asymmetric, and Diffie-Hellman is a key exchange method.","1.4"],
 [1,"Two parties agree on a shared secret key over an untrusted network without ever sending the key itself. Which method does this?","Diffie-Hellman key exchange",["AES encryption","SHA-256 hashing","Key stretching"],"Diffie-Hellman lets both sides compute the same secret from values exchanged in public. The secret then usually keys a fast symmetric cipher.","1.4"],
 [1,"Which technique slows down password cracking by running each password through a hash function thousands of times?","Key stretching",["Salting","Tokenization","Steganography"],"Key stretching, as in PBKDF2 or bcrypt, makes every guess slow. A salt defeats precomputed tables but doesn't slow down each guess.","1.4"],
 [1,"An isolated area inside a processor protects sensitive code and keys, even from the operating system. What is it called?","A secure enclave",["A TPM","An HSM","Key escrow"],"A secure enclave runs code in protected memory the rest of the system can't read. A TPM is a separate chip for keys and measurements, and an HSM is a dedicated key management appliance.","1.4"],
 [1,"A web server sends its public key and identity details to a certificate authority to get a certificate. What does it send?","A CSR",["A CRL","An OCSP response","A root certificate"],"A certificate signing request carries the public key and the subject's details. The CA verifies them and returns a signed certificate.","1.4"],
 [1,"Why is a longer encryption key generally stronger?","It greatly increases the number of possible keys an attacker must try",["It makes encryption faster","It removes the need for key management","It hides the fact that encryption is used"],"Each extra bit doubles the key space, so brute-forcing a long key becomes impractical.","1.4"],
 [2,"What most separates a nation-state attacker from an unskilled attacker?","Resources and level of sophistication",["Whether they work inside the company","Which operating system they use","Whether they ever use email"],"Threat actors differ in resources and funding, sophistication and capability, and whether they're internal or external.","2.1"],
 [2,"A rival government's hackers quietly copy defense plans over several months. What is their main motivation?","Espionage",["Revenge","Ethical hacking","Service disruption"],"Espionage is about stealing secrets quietly and for a long time, which is typical of nation-state actors.","2.1"],
 [2,"A researcher finds a flaw and reports it privately to the vendor so it can be fixed. What motivation is this?","Ethical",["Blackmail","Revenge","War"],"Ethical hackers aim to improve security, often through responsible disclosure or bug bounty programs.","2.1"],
 [2,"Attackers threaten to publish a company's stolen emails unless it pays them. What motivation is this?","Blackmail",["Espionage","Philosophical beliefs","Ethical"],"Blackmail and extortion use stolen or sensitive data as leverage for payment.","2.1"],
 [2,"An attack aims to knock a country's power grid offline during an armed conflict. What motivation is this?","War",["Financial gain","Blackmail","Ethical"],"Cyber attacks can be part of warfare, targeting critical infrastructure to weaken an opponent.","2.1"],
 [2,"An attacker sends a text message with a link to a fake bank login page. What is this?","Smishing",["Vishing","Pretexting","Typosquatting"],"Smishing is phishing by SMS text message. Vishing uses voice calls, and pretexting is an invented story used to get information.","2.2"],
 [2,"A caller pretends to be from IT and makes up a story about a mailbox migration to get a user's password. What technique is this?","Pretexting",["A watering hole attack","Typosquatting","Brand impersonation"],"Pretexting builds a believable scenario so the victim feels they have a reason to help.","2.2"],
 [2,"A fake website copies a well-known company's logo and design to fool its customers. What is this?","Brand impersonation",["Shadow IT","A watering hole attack","Pretexting"],"Brand impersonation borrows a trusted brand's look to win trust, in websites, emails, ads or apps.","2.2"],
 [2,"Which attack surface do unused network services left running on a server create?","Open service ports",["Default credentials","Removable devices","An image-based vector"],"Every listening service is a potential way in. Close the ports and disable the services that aren't needed.","2.2"],
 [2,"Malicious code is hidden inside a picture attached to an email. Which threat vector is this?","Image-based",["Voice call","Removable device","Unsecure network"],"Images can carry exploits that target image-handling flaws, or hide data and code inside them.","2.2"],
 [2,"Malware is injected straight into a running process's memory so no file is ever written to disk. Which vulnerability type is this?","Memory injection",["SQL injection","Directory traversal","Side loading"],"Memory injection is often fileless, which helps it slip past file-based antivirus. Behavior-based tools such as EDR are better at catching it.","2.3"],
 [2,"A cloud provider doesn't clear memory between customers, so one tenant can read another's leftover data. What is this?","Resource reuse",["VM escape","Jailbreaking","A race condition"],"Resource reuse is a virtualization vulnerability. Providers must wipe memory and storage before giving them to another tenant.","2.3"],
 [2,"A router's firmware has a known flaw, but the model is end-of-life and will never get another update. Which vulnerability type is this?","End-of-life hardware",["A zero-day","A misconfiguration","A cryptographic flaw"],"End-of-life and legacy hardware stops getting fixes, so known flaws stay open for good. Replace it or isolate it.","2.3"],
 [2,"Attackers break into a software vendor's update server and push a poisoned update to every customer. What is this vulnerability?","A malicious update",["Side loading","Resource reuse","A race condition"],"Malicious updates abuse the trust customers place in automatic updates. Code signing and supply chain checks help detect them.","2.3"],
 [2,"A website still signs data with an outdated hash algorithm that has known collisions. What type of vulnerability is this?","A cryptographic vulnerability",["An open service port","A supply chain vulnerability","A mobile device vulnerability"],"Weak or outdated algorithms, short keys and poor key handling are cryptographic vulnerabilities. Move to current algorithms.","2.3"],
 [2,"A user's account shows active sessions from two different places at the same time. What indicator is this?","Concurrent session usage",["Account lockout","Blocked content","Resource inaccessibility"],"Simultaneous sessions from different places suggest that someone else is using the credentials or a stolen session token.","2.4"],
 [2,"Many users are suddenly locked out after repeated failed logins they didn't make. What does this most likely indicate?","An attempted password attack",["A routine patch","A stronger password policy","Normal network traffic"],"Lockouts across many accounts point to brute-force or spraying attempts against those accounts.","2.4"],
 [2,"A server's CPU and network use jump to maximum with no business reason. Which indicator is this?","Resource consumption",["Impossible travel","Out-of-cycle logging","Concurrent session usage"],"Unexplained resource use can mean cryptomining malware, data exfiltration or a denial-of-service attack.","2.4"],
 [2,"An attacker reuses a captured session token to act as a user without ever knowing their password. What attack is this?","Credential replay",["Password spraying","A birthday attack","A downgrade attack"],"Replayed credentials or tokens are accepted as genuine. Short token lifetimes and binding tokens to the device reduce the risk.","2.4"],
 [2,"An attacker uses probability math to find two different inputs that produce the same hash. What attack is this?","A birthday attack",["A replay attack","A downgrade attack","Password spraying"],"The birthday paradox makes collisions far easier to find than you'd expect, which is why longer hashes are used.","2.4"],
 [2,"A company puts its point-of-sale systems on a separate network from employee laptops. Which mitigation is this?","Segmentation",["Patching","Decommissioning","Monitoring"],"Segmentation limits how far an attacker can move from one compromised system and shrinks the scope of compliance audits.","2.5"],
 [2,"Which mitigation cuts a compromised system off from everything else while it's investigated?","Isolation",["Patching","Encryption","Least privilege"],"Isolation contains the threat. Patching fixes known flaws, and least privilege limits what accounts can do.","2.5"],
 [2,"Which mitigation fixes known vulnerabilities in operating systems and applications?","Patching",["Segmentation","Monitoring","Decommissioning"],"Regular patching closes known holes. Test patches first, and use compensating controls when a patch isn't available yet.","2.5"],
 [2,"An access control list on a file share gives the Finance group read-only access. Which mitigation is this?","Permissions",["Encryption","Isolation","Decommissioning"],"Access control lists and permissions limit who can do what with a resource, which is least privilege in practice.","2.5"],
 [2,"Changing default passwords on new devices is part of which practice?","Hardening",["Decommissioning","Monitoring","Isolation"],"Hardening also includes removing unneeded software, disabling unused ports and protocols, and enabling host firewalls and endpoint protection.","2.5"],
 [4,"A company defines approved security settings for new laptops, pushes them out with management tools, and checks them regularly. What is this?","A secure baseline",["A heat map","A site survey","A bug bounty"],"A secure baseline is established, deployed and then maintained. Regular checks catch systems that drift from it.","4.1"],
 [4,"Which deployment model gives employees company-owned phones that they're also allowed to use personally?","COPE",["BYOD","CYOD","Kiosk mode"],"Corporate-owned, personally enabled devices stay under company control, which makes management and wiping simpler than with personal devices.","4.1"],
 [4,"A web form rejects anything that isn't a five-digit number in the ZIP code field. What practice is this?","Input validation",["Code signing","Sandboxing","Secure cookies"],"Input validation checks data against what's expected before using it, which blocks many injection attacks. Validate on the server, not only in the browser.","4.1"],
 [4,"Before installing access points, a team walks the building measuring signal strength and plots it on a floor plan. What do they produce?","A heat map",["A risk register","A secure baseline","A packet capture"],"A site survey produces a heat map that shows coverage gaps, overlap and interference, so access points can be placed well.","4.1"],
 [4,"Which hardening step applies to network switches and routers?","Disable unused ports and manage them with SSH instead of Telnet",["Turn on every service for flexibility","Keep the factory admin password","Allow management from any network"],"Network devices need the same hardening as servers: remove what's unused, change defaults, encrypt management traffic and limit where management is allowed from.","4.1"],
 [4,"Before buying new software, the security team reviews the vendor and the product. Which asset management stage is this?","Acquisition and procurement",["Disposal","Data retention","Enumeration"],"Building security into procurement catches risky products and vendors before they're inside the network.","4.2"],
 [4,"Each laptop is recorded against the employee it's issued to. Which asset management activity is this?","Assignment and accounting",["Sanitization","Destruction","Classification"],"Assignment ties each asset to a person or team, so lost or stolen devices can be traced and recovered.","4.2"],
 [4,"Why do organizations tag and track assets throughout their life?","So they know what they own, where it is and who's responsible for it",["So they can skip patching","So assets never need replacing","So they don't need an inventory"],"Asset tracking and inventory are the foundation for patching, monitoring and secure disposal.","4.2"],
 [4,"Drives that held highly sensitive data are shredded instead of wiped. Which disposal method is this?","Destruction",["Sanitization","Retention","Enumeration"],"Destruction physically ruins the media. Sanitization, such as overwriting or cryptographic erase, makes data unrecoverable but leaves the media reusable.","4.2"],
 [4,"Which asset management activity labels data and systems by sensitivity so the right controls are applied?","Classification",["Enumeration","Destruction","Procurement"],"Classification drives how an asset is handled, from encryption and access to how it's eventually disposed of.","4.2"],
 [4,"Which testing method runs an application and probes it while it's executing?","Dynamic analysis",["Static analysis","Package monitoring","Responsible disclosure"],"Dynamic analysis tests running code and finds runtime problems. Static analysis reviews code without running it.","4.3"],
 [4,"A team watches the open-source libraries its software depends on for newly announced vulnerabilities. What is this?","Package monitoring",["A bug bounty","A penetration test","Data retention"],"Most applications rely on third-party packages, so monitoring them and their dependencies is part of vulnerability management.","4.3"],
 [4,"Analysts search criminal marketplaces and forums for the company's leaked credentials. Which threat intelligence source is this?","The dark web",["A proprietary threat feed","An internal audit","Package monitoring"],"Dark web monitoring can give early warning of stolen data or planned attacks.","4.3"],
 [4,"A vulnerability scanner fails to report a real flaw that is present on the system. What is this?","A false negative",["A false positive","A true positive","An exception"],"False negatives are dangerous because they give false confidence. Using more than one scanner and doing manual testing reduce them.","4.3"],
 [4,"Leadership formally approves leaving a vulnerability unpatched for six months because a critical application depends on the old version. What is this?","An exception",["Insurance","Rescanning","A bug bounty"],"Exceptions are documented, approved and time-limited, and they usually come with compensating controls until the issue is fixed.","4.3"],
 [4,"Logs from servers, firewalls and applications are collected into one central system. What is this activity?","Log aggregation",["Archiving","Quarantine","Alert tuning"],"Aggregation puts logs in one place so they can be correlated and searched, which is usually done by a SIEM.","4.4"],
 [4,"Which monitoring approach installs software on each host to collect detailed data?","Agent-based",["Agentless","NetFlow","SNMP traps"],"Agents can see deep host detail, such as processes and files. Agentless monitoring is easier to deploy but sees less.","4.4"],
 [4,"Old logs are moved to cheaper long-term storage but kept for investigations and compliance. What is this?","Archiving",["Quarantine","Alert tuning","Aggregation"],"Archiving keeps logs for as long as policies and regulations require without filling up the live system.","4.4"],
 [4,"A network device sends an unsolicited alert to the monitoring server when an interface goes down. What is this?","An SNMP trap",["A NetFlow record","A SIEM correlation rule","A DLP alert"],"SNMP traps are pushed from the device when an event happens, instead of waiting to be polled.","4.4"],
 [4,"Which tool spots sensitive data, such as credit card numbers, leaving the organization and blocks it?","DLP",["SIEM","NetFlow","SCAP"],"Data loss prevention inspects email, uploads and endpoints for sensitive data and can block, encrypt or flag it.","4.4"],
 [4,"Which email standard adds a digital signature to outgoing messages so receivers can verify they weren't altered?","DKIM",["SPF","DMARC","MX"],"DKIM signs messages with the domain's private key, and receivers check it with the public key published in DNS.","4.5"],
 [4,"Which email record tells receiving servers what to do with messages that fail authentication checks, and asks them to send reports?","DMARC",["SPF","DKIM","PTR"],"DMARC builds on SPF and DKIM with a policy, such as none, quarantine or reject, plus reporting.","4.5"],
 [4,"A Linux server enforces mandatory access control policies on its processes. Which feature provides this?","SELinux",["Group Policy","DNS filtering","A web proxy"],"Security-Enhanced Linux confines processes to what their policy allows, even when they run as root.","4.5"],

/* ---------------- Control Sort ---------------- */
function viewControl(){
  const items=shuffle(CONTROLS).slice(0,10),haul={scrap:0,xp:0};let i=0,score=0,cat=null,typ=null,checked=false,loot="";
  function render(){
    if(i>=items.length)return done();
    const it=items[i];
    const grp=(list,cur,k,ans)=>list.map(v=>{let cls="chip";if(checked){if(v===ans)cls+=" right";else if(v===cur)cls+=" wrong";}
      return `<button class="${cls}" data-${k}="${v}" aria-pressed="${v===cur}"${checked?" disabled":""}>${v}</button>`;}).join("");
    $app.innerHTML=`<div class="panel">
      <div class="qhead"><span class="label">Control Sort · scavenging mission · ${i+1} of ${items.length}</span><span class="mono">${score} / ${(i+(checked?1:0))*2} points · ${haul.scrap} scrap</span></div>
      <div class="progress"><i style="width:${100*i/items.length}%"></i></div>
      <div class="item-card" style="min-height:0"><span class="label">Classify this control</span><div class="it">${esc(expand(it[0]))}</div></div>
      <div class="cs-groups">
        <div><span class="label">Category</span><div class="cs-g">${grp(CTRL_CATS,cat,"c",it[1])}</div></div>
        <div><span class="label">Type</span><div class="cs-g">${grp(CTRL_TYPES,typ,"t",it[2])}</div></div>
      </div>
      ${checked?`<div class="explain ${cat===it[1]&&typ===it[2]?"verdict-ok":"verdict-bad"}"><b>${esc(it[1])} · ${esc(it[2])}</b>${esc(expand(it[3]))}${loot?`<div style="margin-top:6px">${loot}</div>`:""}</div>`:""}
      <div class="row" style="justify-content:flex-end;margin-top:16px">${checked?`<button class="btn primary" id="next">${i+1<items.length?"Next control":"See results"}</button>`:`<button class="btn primary" id="check"${cat&&typ?"":" disabled"}>Check</button>`}</div>
      <p class="muted small" style="margin:14px 0 0">Pick one category and one type. Each correct pick is a point and scavenges ${SCAV.control.scrap} scrap and ${SCAV.control.xp} XP.</p>
    </div>`;
    $app.querySelectorAll("[data-c]").forEach(b=>b.onclick=()=>{cat=b.dataset.c;render();});
    $app.querySelectorAll("[data-t]").forEach(b=>b.onclick=()=>{typ=b.dataset.t;render();});
    const c=document.getElementById("check");if(c)c.onclick=()=>{checked=true;const pts=(cat===it[1])+(typ===it[2]);score+=pts;loot=scavenge("control",pts,haul);render();document.getElementById("next").focus({preventScroll:true});};
    const n=document.getElementById("next");if(n)n.onclick=()=>{i++;cat=null;typ=null;checked=false;loot="";render();};
  }
  function done(){
    const max=items.length*2,best=score>(P.best.control||0);if(best)P.best.control=score;save();
    $app.innerHTML=`<div class="panel result stack"><span class="label">Control Sort complete</span><div class="big">${score}<span class="muted" style="font-size:32px"> / ${max}</span></div>
      <p class="muted" style="margin:0">${best?"New personal best.":"Best: "+P.best.control+"/"+max}</p>
      ${haulLine(haul)}
      <div class="row" style="justify-content:center"><button class="btn primary" id="again">New controls</button><a class="btn" href="#home">Home</a></div></div>`;
    document.getElementById("again").onclick=viewControl;
  }
  const onKey=e=>{if(e.key==="Enter"){const b=document.getElementById("next")||document.getElementById("check");if(b&&!b.disabled){e.preventDefault();b.click();}}};
  document.addEventListener("keydown",onKey);
  cleanup=()=>document.removeEventListener("keydown",onKey);
  render();
}
