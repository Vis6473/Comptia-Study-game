 [1,"Which practice best reduces supply chain risk when buying hardware?","Vetting suppliers and setting minimum security requirements in contracts",["Always choosing the cheapest vendor","Skipping inspection to save time","Buying from unknown resellers"],"Supplier assessments, provenance checks and contract requirements such as audit rights reduce supply chain risk.","1.11"],

 [1,"How should a security awareness program stay effective over time?","Review and update its content regularly to match current threats",["Run the same course unchanged for years","Train people only when they're hired","Make it optional"],"Threats change, so content must change too. Regular reviews and metrics keep the program relevant.","1.12"],

 [2,"Which is the highest of these US government classification levels?","Top Secret",["Secret","Confidential","Unclassified"],"The order from highest is Top Secret, Secret, Confidential and Unclassified. The higher the level, the greater the harm if the data is disclosed.","2.1"],

 [2,"Why are classified documents and media labeled?","So people and systems handle them according to their classification",["To make them easier to throw away","To speed up printing","To meet font standards"],"Marking and labeling tell everyone how to store, send and destroy each item.","2.2"],

 [2,"Why does secure asset management start with an accurate inventory?","You can't protect assets you don't know you have",["Inventories replace firewalls","Auditors require colorful reports","It makes assets run faster"],"Unknown assets go unpatched and unmonitored, which makes them easy targets.","2.3"],
 [2,"Under GDPR, what is a data processor?","An organization that processes personal data on behalf of a controller",["The person the data is about","The regulator that enforces GDPR","Software that encrypts data"],"The controller decides why and how data is processed. The processor acts on the controller's instructions.","2.3"],
 [2,"What is data remanence?","Data that remains on media after it was deleted or formatted",["Data stored in RAM only","Data waiting to be backed up","Data held by a third party"],"Deleting files usually removes only references to them. Proper sanitization deals with remanence.","2.4"],
 [2,"Which sanitization level makes data unrecoverable even with lab techniques, while leaving the media reusable?","Purging",["Clearing","Destruction","Deleting"],"Clearing protects against simple recovery tools. Purging protects against lab-level recovery, and destruction physically ruins the media.","2.4"],

 [2,"What's the risk of keeping data longer than the retention schedule requires?","More legal exposure and a bigger impact if it's breached",["Faster searches","Lower storage costs","Better encryption"],"Data that should have been destroyed can still be demanded in court and stolen in a breach.","2.5"],
 [2,"What does end of support mean for a product?","The vendor no longer provides patches or help",["The product is brand new","The product can't be sold anymore, but patches continue","The warranty has just started"],"End-of-support products stop getting security fixes, so plan to replace them or add compensating controls.","2.5"],

 [2,"What is tailoring when selecting security controls?","Adjusting a baseline's controls to fit the organization's mission and environment",["Removing all controls","Buying custom hardware","Encrypting all data at rest"],"Scoping picks which baseline controls apply. Tailoring changes parameters and adds compensating controls to fit.","2.6"],

 [3,"A firewall's management service crashes. Which secure design principle says it should block traffic rather than allow it?","Fail securely",["Open design","Economy of mechanism","Least common mechanism"],"A secure failure defaults to denying access, so a crash doesn't open a gap.","3.1"],

 [3,"What does a birthday attack try to find?","Two inputs that produce the same hash",["The key from one ciphertext","A user's birthday","A weak random number generator seed"],"The birthday paradox makes hash collisions far easier to find than you'd expect, which is why longer hashes are used.","3.7"],
 [3,"An attacker gets the target system to decrypt ciphertexts of the attacker's choosing. What is this?","A chosen-ciphertext attack",["A known-plaintext attack","A ciphertext-only attack","A meet-in-the-middle attack"],"Studying the decryptions of chosen ciphertexts can reveal the key or plaintext.","3.7"],
 [3,"Placing windows and lighting so people can easily see who's near the entrances is which CPTED strategy?","Natural surveillance",["Natural access control","Territorial reinforcement","Target hardening"],"Crime Prevention Through Environmental Design uses natural surveillance, natural access control and territorial reinforcement to discourage crime.","3.8"],
 [3,"Which is the best location for a new data center?","Away from flood plains, with access to redundant utilities",["Next to a chemical plant","In a basement below the water table","Under an airport flight path"],"Site selection should reduce natural and man-made hazards and give reliable power and connectivity.","3.8"],
 [3,"Why place a server room in the middle of a building rather than against an outside wall?","It's better protected from weather, vehicles and intruders",["It's cheaper to cool","It needs no fire suppression","It improves Wi-Fi coverage"],"Interior rooms add layers of physical protection. Avoid basements, which flood, and top floors, which leak.","3.8"],
 [3,"Which sprinkler type fills its pipes only when a detector triggers, then needs heat to open each head?","Pre-action",["Wet pipe","Deluge","Dry pipe only"],"Pre-action systems need two triggers before water flows, which reduces accidental discharges in data centers.","3.9"],
 [3,"What relative humidity is generally recommended for a data center?","About 40–60%",["Below 10%","Above 90%","Exactly 0%"],"Too dry increases static discharge, and too humid causes condensation and corrosion.","3.9"],
 [3,"Which suppression method is safe for people and equipment and replaced Halon in many data centers?","A clean agent gas such as FM-200",["Water sprinklers only","Dry chemical powder","Carbon dioxide in occupied rooms"],"Clean agents put out fires without residue. Halon was phased out because it damages the ozone layer, and CO2 is dangerous where people work.","3.9"],
 [3,"In which phase of the system lifecycle should security requirements first be defined?","Initiation and requirements",["Operations and maintenance","Disposal","After deployment"],"Defining security early is far cheaper than adding it later.","3.10"],
 [3,"What should happen when a system is retired?","Sanitize or destroy its media and update the inventory",["Leave it powered on in storage","Sell it as is","Delete only the user accounts"],"Disposal includes sanitizing data, removing access and updating records.","3.10"],
 [3,"During operations and maintenance, how does security stay effective?","Through monitoring, patching and regular reassessment",["By freezing the configuration forever","By removing all logging","By skipping change management"],"Threats and systems change, so controls need ongoing care for the whole life of the system.","3.10"],
 [4,"Which OSI layer handles logical addressing and routing?","Layer 3, Network",["Layer 2, Data Link","Layer 4, Transport","Layer 7, Application"],"Routers and IP work at the Network layer. Switches work at Layer 2, and TCP and UDP at Layer 4.","4.1"],
 [4,"What does micro-segmentation do?","Isolates individual workloads with fine-grained security policies",["Combines every VLAN into one","Speeds up Wi-Fi","Replaces encryption"],"Micro-segmentation limits lateral movement, so a single breach can't spread easily through the data center.","4.1"],
 [4,"Which protocol finds the MAC address that matches an IPv4 address on a LAN?","ARP",["DNS","DHCP","ICMP"],"ARP maps IP addresses to MAC addresses. Its lack of authentication makes ARP poisoning possible.","4.1"],
 [4,"Which IPsec mode encrypts the entire original packet, which suits gateway-to-gateway VPNs?","Tunnel mode",["Transport mode","Aggressive mode","Main mode"],"Tunnel mode wraps the whole packet in a new IP header. Transport mode protects only the payload and is used host to host.","4.1"],
 [4,"What does software-defined networking separate?","The control plane from the data plane",["Copper from fiber","IPv4 from IPv6","Users from administrators"],"A central controller makes forwarding decisions, while switches just forward traffic, which allows programmable, centralized control.","4.1"],
 [4,"What does iSCSI do?","Carries storage commands over IP networks",["Encrypts email","Assigns IP addresses","Translates domain names"],"iSCSI is a converged protocol that lets servers use remote block storage over ordinary networks. Isolate and secure that traffic.","4.1"],
 [4,"Which firewall tracks the state of connections, allowing return traffic only for sessions started inside?","A stateful firewall",["A static packet filter","A hub","A repeater"],"Stateful firewalls keep a state table. Static packet filters judge each packet alone.","4.2"],
 [4,"Which control checks a device's health and identity before letting it join the network?","NAC",["DLP","SIEM","WAF"],"Network access control can check patches and antivirus before granting access, and quarantines devices that don't comply.","4.2"],
 [4,"Which transmission medium is hardest to tap without being noticed?","Fiber optic cable",["Unshielded twisted pair","Coaxial cable","Wi-Fi"],"Fiber gives off no electromagnetic signal, and tapping it usually causes a measurable loss of light.","4.2"],
 [4,"Which firewall can inspect application content, such as HTTP requests?","An application-level or next-generation firewall",["A static packet filter","A circuit-level gateway only","An unmanaged switch"],"Application-layer inspection understands protocols and can block attacks hidden inside allowed ports.","4.2"],
 [4,"Which tool detects and responds to threats on laptops and servers?","EDR",["NAT","DHCP","VLAN"],"Endpoint detection and response records endpoint activity, detects suspicious behavior, and can isolate the host.","4.2"],
 [4,"How should unused switch ports be handled?","Disable them or put them in an unused VLAN",["Leave them active for convenience","Connect them to the internet","Turn on PoE on all of them"],"Disabled ports stop anyone plugging in a rogue device inside the building.","4.2"],
 [4,"Which standard provides end-to-end encryption and signing for email?","S/MIME",["SMTP","POP3","IMAP"],"S/MIME uses certificates to encrypt and sign messages. Plain SMTP, POP3 and IMAP don't protect message content.","4.3"],
 [4,"Which protocol protects the audio of VoIP calls?","SRTP",["SIP","RTP","H.323"],"Secure RTP encrypts and authenticates the media. SIP sets up the call, and plain RTP carries media unprotected.","4.3"],
 [4,"Which protocol should replace Telnet for remote administration of network devices?","SSH",["FTP","HTTP","TFTP"],"SSH encrypts the session, including the credentials. Telnet sends everything in plain text.","4.3"],
 [4,"In 802.1X, which device plays the authenticator role?","The switch or wireless access point",["The RADIUS server","The user's laptop","The DNS server"],"The supplicant is the client, the authenticator is the switch or AP, and the authentication server is usually RADIUS.","4.3"],
 [4,"Two organizations connect their networks with a VPN. Which document sets the technical security requirements for the link?","An ISA",["An NDA","An SLA","An AUP"],"An interconnection security agreement documents the connection's technical security requirements, often alongside an MOU.","4.3"],
 [4,"Which TLS version should new systems prefer?","TLS 1.3",["SSL 3.0","TLS 1.0","TLS 1.1"],"TLS 1.3 removes weak ciphers and speeds up the handshake. SSL and early TLS versions are deprecated.","4.3"],
 [5,"Which access control model uses security labels and clearances that the system enforces and users can't change?","MAC",["DAC","RBAC","Rule-based access control"],"Mandatory access control is common in government systems. In discretionary access control, data owners set permissions themselves.","5.1"],
 [5,"In which access control model does the data owner decide who gets access?","DAC",["MAC","ABAC","Lattice-based access control"],"Discretionary access control, like NTFS permissions set by file owners, is flexible but relies on owners making good choices.","5.1"],
 [5,"Employees use the same card to open doors and to sign in to their workstations. What is this?","A smart card that combines physical and logical access",["A password manager","A mantrap","A cable lock"],"Bringing physical and logical access together on one credential simplifies management and gives a fuller audit trail.","5.1"],
 [5,"Which authentication factor type is a fingerprint?","Something you are",["Something you know","Something you have","Somewhere you are"],"Biometrics are something you are, a PIN is something you know, and a token is something you have.","5.2"],
 [5,"What does a biometric system's crossover error rate tell you?","Where false acceptances equal false rejections. Lower is more accurate",["Its maximum number of users","How fast it scans","How much it costs"],"The CER, also called the EER, is used to compare biometric systems. A lower CER means a more accurate system.","5.2"],
 [5,"A biometric reader lets an unauthorized person in. What type of error is this?","Type 2, a false acceptance",["Type 1, a false rejection","A crossover error","A false negative alarm"],"Type 1 errors reject valid users and frustrate them. Type 2 errors accept impostors, which is the more dangerous failure.","5.2"],
 [5,"Which XML-based standard passes authentication assertions from an identity provider to a service provider?","SAML",["OAuth 2.0","LDAP","RADIUS"],"SAML is widely used for web single sign-on between organizations and cloud apps.","5.3"],
 [5,"Which framework is for delegating authorization, such as letting an app read your calendar, and isn't an authentication protocol by itself?","OAuth 2.0",["SAML","Kerberos","OpenID Connect"],"OAuth 2.0 issues access tokens. OpenID Connect adds an identity layer on top of it for authentication.","5.3"],
 [5,"Which protocol adds user authentication on top of OAuth 2.0 with an ID token?","OpenID Connect",["SAML 1.1","TACACS+","Diameter"],"OpenID Connect is common for sign-in with providers such as Microsoft or Google in modern web and mobile apps.","5.3"],
 [5,"Access to the payroll system is granted to everyone in the HR specialist position. Which model is this?","Role-based access control",["Discretionary access control","Mandatory access control","Rule-based access control"],"RBAC assigns permissions to roles, and users get them by holding the role, which makes job changes simpler.","5.4"],
 [5,"A policy allows access only to managers in the finance department, during business hours, from company devices. Which model fits best?","Attribute-based access control",["Role-based access control only","Discretionary access control","Mandatory access control"],"ABAC evaluates attributes of the user, the resource and the environment, which allows very fine-grained policies.","5.4"],
 [5,"A firewall's rules apply the same way to everyone who sends traffic through it. Which model is this?","Rule-based access control",["Role-based access control","Discretionary access control","Attribute-based access control"],"Rule-based access control applies global rules to every subject, unlike role-based control, which depends on who the user is.","5.4"],
 [5,"Employees keep old permissions every time they change jobs. What is this, and what fixes it?","Privilege creep, fixed by regular access reviews",["Least privilege, fixed by more admin rights","Separation of duties, fixed by shared accounts","Federation, fixed by turning off SSO"],"Periodic access reviews remove permissions people no longer need.","5.5"],
 [5,"Which process has managers regularly confirm that their staff's access is still needed?","Access recertification",["Account provisioning","Password rotation","Federation"],"Recertification catches excessive access that provisioning alone misses.","5.5"],
 [5,"What is just-in-time privileged access?","Granting elevated rights only when they're needed, for a limited time",["Giving all admins permanent rights","Removing all admin accounts","Sharing one admin password"],"Just-in-time access shrinks the window in which a privileged account can be abused.","5.5"],
 [5,"In Kerberos, what does a client get first from the KDC?","A ticket-granting ticket",["A service ticket","A SAML assertion","An access token"],"The client uses the TGT to request service tickets for each resource, so it doesn't send its password again.","5.6"],
 [5,"What's a well-known weakness of Kerberos?","The KDC is a single point of failure, and clocks must be in sync",["It sends passwords in clear text","It can't work in a domain","It only supports biometrics"],"If the KDC goes down, nobody can get tickets. Time skew also breaks authentication, so redundancy and time sync are essential.","5.6"],
 [5,"Which AAA protocol uses UDP and encrypts only the password?","RADIUS",["TACACS+","Kerberos","LDAPS"],"RADIUS combines authentication and authorization. TACACS+ uses TCP, separates the AAA functions, and encrypts the whole payload.","5.6"],
 [6,"Which type of audit offers the most independence?","A third-party audit",["A self-assessment","An internal audit","A peer review within the team"],"Third-party auditors have no stake in the outcome, so customers and regulators trust their results most.","6.1"],
 [6,"A customer wants to know how well a service provider's controls worked over the past year. Which report fits?","A System and Organization Controls 2 Type II report",["A System and Organization Controls 2 Type I report","A System and Organization Controls 1 Type I report","A press release"],"Type I looks at control design at a point in time. Type II tests how well the controls operated over a period. Report 1 covers financial reporting controls, and report 2 covers security and related trust criteria.","6.1"],
 [6,"Which System and Organization Controls report is meant for general public distribution?","Report 3",["Report 1","Report 2 Type II","Report 2 Type I"],"The System and Organization Controls 3 report is a summary that can be shared freely. Reports 1 and 2 are restricted to customers and their auditors.","6.1"],
 [6,"What should determine the scope of a security assessment?","The organization's business requirements and risks",["The assessor's favorite tools","Whatever is cheapest","Only the systems the assessor knows well"],"Assessments should focus on what matters to the business and its risk profile.","6.1"],
 [6,"Testers get the source code, network diagrams and credentials before the test. What kind of test is this?","A white box test",["A black box test","A blind test","A double-blind test"],"White box (full knowledge) testing is thorough and efficient. Black box testing simulates an outside attacker with no knowledge.","6.2"],
 [6,"Which testing technique feeds large amounts of random or malformed input into software to find crashes?","Fuzzing",["Static analysis","Code review","Regression testing"],"Fuzzing finds input-handling flaws such as buffer overflows that developers may not have expected.","6.2"],
 [6,"Which testing looks at how an attacker could abuse an application's features?","Misuse case testing",["Use case testing only","Load testing","Unit testing"],"Misuse cases describe what attackers might try. Tests then confirm the system resists those actions.","6.2"],
 [6,"What is a Fagan inspection?","A formal, structured code review process",["A type of firewall","A vulnerability scanner","A disaster recovery test"],"Fagan inspections move through set stages: planning, overview, preparation, inspection, rework and follow-up.","6.2"],
 [6,"Which metric warns that the likelihood or impact of a risk is rising?","A key risk indicator",["A key performance indicator","A service level agreement","A mean time to repair figure only"],"KRIs track exposure to risk, such as a growing number of unpatched critical systems. KPIs measure performance.","6.3"],
 [6,"How can you check that account management is working?","Compare active accounts against HR records to find orphaned accounts",["Count the total number of passwords","Ask users if they like their accounts","Check the screen saver settings"],"Accounts belonging to people who left are a common finding and a real risk.","6.3"],
 [6,"Which process data proves that backups can actually be used?","Records of successful test restores",["The number of backup jobs scheduled","The backup software's version","The size of the backup drive"],"Only a test restore proves recovery works. Successful job logs aren't enough.","6.3"],
 [6,"How do security awareness records support management reporting?","They show training completion rates and results such as phishing simulation outcomes",["They replace incident reports","They list employees' passwords","They show network bandwidth"],"Awareness data shows whether the program reaches people and changes their behavior.","6.3"],
 [6,"A vulnerability scan reports a flaw that isn't actually present. What is this?","A false positive",["A false negative","A true positive","A zero-day"],"False positives waste time. False negatives are more dangerous, because real flaws go unreported.","6.4"],
 [6,"How should accepted risks from a test be recorded in the report?","As documented exceptions with an owner, a justification and a review date",["Removed from the report","Marked as fixed","Ignored if they're old"],"Documented exceptions keep accepted risks visible and accountable, so they're revisited.","6.4"],
 [6,"What's the purpose of a test report's executive summary?","To explain the business impact and key risks in plain terms",["To list every raw scanner finding","To show the testers' tools","To include exploit code"],"Leaders need to understand risk and priorities. Technical detail goes in later sections for the people fixing things.","6.4"],
 [6,"How should test findings be prioritized for remediation?","By risk, considering severity, exploitability and the asset's value",["Alphabetically","By the order the scanner found them","By the easiest fix first, always"],"Risk-based prioritization fixes the most dangerous issues on the most important assets first.","6.4"],
 [6,"What's the first step in planning a security audit?","Defining the scope and objectives",["Collecting evidence","Writing the final report","Interviewing every employee"],"A clear scope and objectives guide what evidence to gather and how to judge it.","6.5"],
 [6,"Which audit evidence is generally most reliable?","Evidence the auditor gathers and observes directly",["Verbal claims from the team being audited","Undated screenshots sent by email","Hearsay from former staff"],"Evidence the auditor gets independently and firsthand is more reliable than statements from the people being audited.","6.5"],
 [6,"Who should receive the results of an internal security audit?","Senior management and the audit committee or board",["Only the IT help desk","The public","Only the team that was audited"],"Audit results support governance. Leadership must see them to make risk decisions.","6.5"],
 [6,"What does a right-to-audit clause in a vendor contract allow?","The customer can audit the vendor's controls",["The vendor can audit the customer's finances","Either party can end the contract at once","The vendor can skip security reviews"],"Right-to-audit clauses give the customer a way to verify a vendor's security directly.","6.5"],
 [7,"Following the order of volatility, which evidence should be collected first?","CPU registers, cache and RAM",["Hard disk contents","Archived backups","Printed documents"],"Collect the most volatile data first, because it's lost when the system powers down. Disks and backups last longer.","7.1"],
 [7,"What does the best evidence rule say?","Courts prefer original documents over copies",["Evidence must be collected by police","Only digital evidence counts","Hearsay is always admissible"],"Where the original isn't available, a verified copy, such as a forensic image with matching hashes, may be accepted.","7.1"],
 [7,"Which system collects logs from many sources and correlates them to spot attacks?","A SIEM",["A DHCP server","A NAS","A proxy cache"],"Security information and event management centralizes logs, correlates events and raises alerts.","7.2"],
 [7,"How can logs be protected from attackers who want to cover their tracks?","Send them to a central, write-protected store with integrity checks",["Keep them only on each server","Let administrators edit them freely","Turn logging off at night"],"Centralized, tamper-evident logs keep the evidence even if a server is compromised.","7.2"],
 [7,"What is a configuration baseline?","A documented, approved configuration that systems are built and checked against",["The first ticket of the day","The cheapest hardware option","A list of user passwords"],"Baselines make systems consistent and make unauthorized changes easy to spot.","7.3"],
 [7,"What's a security benefit of infrastructure as code?","Consistent, repeatable, reviewable builds that drift less",["It removes the need for access control","It makes systems invisible to attackers","It replaces backups"],"Templates in version control can be reviewed and tested, which reduces manual mistakes.","7.3"],
 [7,"An analyst has clearance for Secret data but works only on one project. Which principle limits access to that project's data?","Need to know",["Clearance alone","Job rotation","Separation of duties"],"Clearance sets the maximum level of data a person may see. Need to know limits them to what their job actually requires.","7.4"],
 [7,"Opening a vault requires two people, each holding part of the combination. What is this called?","Dual control",["Job rotation","Mandatory vacation","Least privilege"],"Dual control means no one person can complete a critical action alone.","7.4"],
 [7,"How should backup media holding sensitive data be protected?","Encrypt it, label it, track it, and store it securely",["Leave it on a desk","Reuse it without sanitizing","Send it with no records"],"Media protection follows the data's classification through storage, transport and disposal.","7.5"],
 [7,"Why protect system images and master installation media?","Tampered images would spread compromise to every system built from them",["They're too large to store","They contain user passwords","They're only used once"],"Protecting the integrity of golden images and installers prevents compromises at scale.","7.5"],
 [7,"In ISC2's incident management steps, what comes right after detection?","Response",["Lessons learned","Recovery","Remediation"],"The steps are detection, response, mitigation, reporting, recovery, remediation and lessons learned.","7.6"],
 [7,"What's the main goal of the lessons learned step after an incident?","Improving defenses and processes to prevent a repeat",["Blaming the people involved","Deleting the evidence","Closing the ticket quickly"],"A no-blame review finds the root causes and leads to concrete improvements.","7.6"],
 [7,"Which system lures attackers away from real assets so their methods can be studied?","A honeypot",["A bastion host","A jump server","A proxy"],"Honeypots have no business purpose, so any activity on them is suspicious. Don't use them to entrap.","7.7"],
 [7,"Which detection method compares traffic with known attack patterns?","Signature-based detection",["Anomaly-based detection","Heuristic sandboxing only","Honeypot logging"],"Signature-based detection is accurate for known threats but misses new ones. Anomaly detection can catch unknown attacks but raises more false positives.","7.7"],
 [7,"Before deploying a critical patch to all servers, what should normally happen?","Test it in a non-production environment first",["Deploy it everywhere at once","Wait a year","Let each user decide"],"Testing catches compatibility problems. Emergency patches may move faster, but they still follow change control.","7.8"],
 [7,"Which system scores how severe a vulnerability is?","CVSS",["CVE","CWE","SCAP"],"CVSS gives a severity score from 0 to 10. CVE names individual vulnerabilities, and CWE categorizes weakness types.","7.8"],
 [7,"A critical fix must go in tonight to stop an active attack. How should change management handle it?","As an emergency change, approved quickly and fully documented and reviewed afterward",["Skip change management entirely","Wait for next month's board meeting","Let anyone make the change without records"],"Emergency changes keep oversight while allowing speed.","7.9"],
 [7,"Which control detects unauthorized changes to critical system files?","File integrity monitoring",["Load balancing","Disk defragmentation","Spam filtering"],"FIM compares file hashes with a baseline and alerts when something changes.","7.9"],
 [7,"Which recovery site has equipment and current data, ready to take over within hours?","A hot site",["A cold site","A warm site","A mobile office with no equipment"],"Hot sites recover fastest but cost the most. Cold sites provide only space and power.","7.10"],
 [7,"What does a cold site provide?","Space, power and environmental controls, but no equipment or data",["A full copy of production","Live replicated servers","A second active data center"],"Cold sites are cheap but take weeks to bring online, which suits only processes with a long MTD.","7.10"],
 [7,"During a disaster, what is always the first priority?","The safety of people",["Restoring email","Protecting the servers","Notifying customers"],"Life safety comes first, every time. Recovering systems comes after people are safe.","7.11"],
 [7,"Who declares a disaster and starts the recovery plan?","The person or role the DR plan authorizes",["Any employee who notices an outage","The newest IT technician","An outside vendor"],"Clear authority prevents confusion and wrong declarations.","7.11"],
 [7,"Which DR test brings up recovery systems alongside production, without disrupting production?","A parallel test",["A full interruption test","A checklist review","A structured walkthrough"],"Parallel tests prove recovery systems work. Full interruption tests shut down production and are the riskiest.","7.12"],
 [7,"Which DR test is the most disruptive and risky?","A full interruption test",["A read-through","A tabletop walkthrough","A simulation"],"A full interruption test shuts down the primary site to prove the recovery site works. It needs management approval and careful planning.","7.12"],
 [7,"How often should a business continuity plan be reviewed and updated?","At least annually, and after major business or technology changes",["Only when it's first written","Every ten years","Only after a disaster"],"Plans go stale quickly as people, systems and processes change.","7.13"],
 [7,"In a BC walkthrough exercise, what do team members do?","Step through the plan together to check that it's complete and that they know their roles",["Shut down the data center","Restore every system from tape","Run a live phishing campaign"],"Walkthroughs are low-risk discussions that find gaps before a real event.","7.13"],
 [7,"What do security guards offer that technical controls can't?","Human judgment to respond to unusual situations",["Lower cost than cameras","Perfect memory","Invisibility to intruders"],"Guards can assess context and act flexibly. They also deter, and can verify what cameras only record.","7.14"],
 [7,"Which control detects someone climbing a perimeter fence?","A perimeter intrusion detection sensor",["A deadbolt","A privacy screen","A login banner"],"Perimeter sensors and cameras detect intrusions so guards can respond.","7.14"],
 [7,"What's a duress code used for?","Silently signaling that someone is being forced to act",["Resetting a password","Opening a door faster","Disabling the fire alarm"],"A duress code, such as a special PIN, triggers a silent alert while appearing to comply with the attacker.","7.15"],
 [7,"Staff are traveling to a high-risk country. What's a good practice?","Give them clean loaner devices with only the data they need",["Bring every laptop with full data","Turn off encryption to pass customs faster","Use public Wi-Fi without a VPN"],"Loaner devices limit exposure if equipment is seized or tampered with. Check or wipe them when they come back.","7.15"],
 [8,"When should security be built into software development?","From the requirements phase, throughout the lifecycle",["Only right before release","Only after a breach","Only during maintenance"],"Fixing flaws early costs far less. Requirements, design, coding and testing all include security.","8.1"],
 [8,"How do agile teams build security into each sprint?","By adding security requirements and acceptance criteria to user stories",["By skipping security until the final sprint","By banning all changes","By testing only once a year"],"Security stories, abuse cases and definitions of done keep security part of every iteration.","8.1"],
 [8,"What does DevSecOps add to DevOps?","Automated security checks in the CI/CD pipeline",["Manual approval for every commit","Removing testing to ship faster","A separate security team that reviews code once a year"],"DevSecOps runs SAST, dependency and container scans automatically, so issues are caught early without slowing delivery.","8.1"],
 [8,"Which testing analyzes source code for security flaws without running it?","SAST",["DAST","Fuzzing","Penetration testing"],"Static analysis finds issues such as injection risks early. Dynamic testing needs a running application.","8.2"],
 [8,"Which testing probes a running web application from the outside?","DAST",["SAST","SCA","Code review"],"Dynamic testing finds runtime issues such as misconfigurations and injection flaws, much like an external attacker would.","8.2"],
 [8,"Which tool finds vulnerable third-party libraries in an application?","Software composition analysis",["A port scanner","A protocol analyzer","A password cracker"],"SCA lists the open-source components an application uses and flags those with known vulnerabilities and license issues.","8.2"],
 [8,"Why run regression tests after changing code?","To make sure the change didn't break existing functions or security controls",["To test the new feature only","To measure network speed","To replace code reviews"],"Changes can reopen old flaws. Automated regression suites catch them.","8.3"],
 [8,"Which practice helps assess software security over time?","Tracking metrics such as open vulnerabilities and time to fix",["Counting lines of code only","Measuring developer satisfaction only","Ignoring findings from earlier releases"],"Trends in defect density and remediation time show whether the security of the software is improving.","8.3"],
 [8,"Why log and audit changes to production code?","To detect unauthorized changes and support investigations",["To slow developers down","To replace version control","To reduce storage use"],"Audit trails show who changed what and when, which supports accountability and incident response.","8.3"],
 [8,"Before buying commercial software, what helps assess its security?","Reviewing the vendor's security practices, SBOM and patch commitments",["Trusting the marketing material","Checking only the price","Assuming popular software is secure"],"Acquired software brings the vendor's risk into your environment, so evaluate it like any supplier.","8.4"],
 [8,"What's a key risk of using open-source components?","Unpatched vulnerabilities and license obligations",["They never have bugs","They can't be inspected","They always cost more than commercial software"],"Track components, monitor their vulnerabilities, and follow license terms such as copyleft rules.","8.4"],
 [8,"A company adopts a SaaS application. How can it assess the provider's security without auditing them itself?","Review independent reports, such as a System and Organization Controls 2 Type II, and the shared responsibility terms",["Assume the provider handles everything","Ask the provider's sales team only","Skip the review for cloud apps"],"Independent attestations and clear responsibility splits show what the provider covers and what you still have to do.","8.4"],
 [8,"Which coding practice best prevents SQL injection?","Parameterized queries",["Client-side validation only","Hiding error messages only","Longer database passwords"],"Parameterized queries keep data separate from SQL commands. Client-side checks are easily bypassed.","8.5"],
 [8,"Where must input validation happen to be trusted?","On the server side",["Only in the browser","Only in the database backups","Only in the firewall logs"],"Attackers can bypass anything that runs on the client. Validate on the server, preferably against an allow list.","8.5"],
 [8,"How should applications handle secrets such as API keys?","Store them in a secrets vault, not hardcoded in the source",["Put them in comments","Commit them to the public repository","Email them to developers"],"Hardcoded secrets leak through repositories and builds. Vaults control, rotate and audit access to them.","8.5"],
 [1,"What can happen to an ISC2 member who violates the Code of Ethics?","ISC2 can revoke their certification after an ethics review",["Nothing, since the code is only advice","They must retake every ISC2 exam","A government regulator fines them automatically"],"ISC2 investigates ethics complaints, and certifications can be suspended or revoked. Agreeing to the code is a condition of certification.","1.1"],
 [1,"A manager tells you to skip a legally required breach notification. What should guide your decision?","Act legally and honestly, even against the employer's instruction",["Do what the employer says, since they're your principal","Delay until the manager changes their mind","Notify only your coworkers"],"The second canon, acting honorably, honestly, justly, responsibly and legally, outranks duty to principals, which comes third.","1.1"],
 [1,"Which security goal assures that data really came from its stated source?","Authenticity",["Availability","Confidentiality","Obscurity"],"Authenticity confirms the origin is genuine, often with digital signatures or message authentication codes.","1.2"],
 [1,"What does the DAD triad describe?","Disclosure, alteration and destruction, the opposites of confidentiality, integrity and availability",["Detection, analysis and defense","Data, access and devices","Deterrence, assessment and delay"],"Each DAD threat breaks one CIA goal: disclosure breaks confidentiality, alteration breaks integrity, and destruction breaks availability.","1.2"],
 [1,"What should a security program be aligned with first?","The organization's business strategy, goals and mission",["The latest security product trends","What competitors spend","The security team's preferences"],"Security exists to support the business. Governance makes sure security priorities follow business objectives.","1.3"],
 [1,"Why do many organizations have the CISO report outside the IT department?","To avoid conflicts of interest and keep security independent",["Because IT doesn't need security","To reduce the CISO's authority","Because auditors forbid IT from having managers"],"If security reports to the IT leader whose work it reviews, problems may be downplayed. Reporting to senior leadership keeps it independent.","1.3"],
 [1,"What do data breach notification laws usually require?","Notifying affected people, and often regulators, within set time limits",["Paying every customer a fixed fine","Deleting all customer data","Hiding the breach until it's fixed"],"Notification rules vary by jurisdiction, so the incident plan should list which laws apply and their deadlines.","1.4"],
 [1,"What is the main concern with transborder data flow?","Moving personal data across borders can break the privacy laws of where the data came from",["Network latency between countries","Currency exchange rates","Different keyboard layouts"],"Many privacy laws restrict transfers unless the destination protects data adequately or legal safeguards are in place.","1.4"],
 [1,"Who conducts a regulatory investigation?","A government body checking compliance with regulations",["The company's HR department alone","A private litigant","The company's marketing team"],"Regulators can investigate, fine and impose orders. Their standard of proof depends on the regulator.","1.5"],
 [1,"A forensic investigator checks whether a breached merchant followed PCI DSS. What type of investigation is this?","An industry standards investigation",["A criminal investigation","An administrative investigation","An eDiscovery request"],"Industry standards such as PCI DSS have their own investigation requirements, separate from law enforcement.","1.5"],
 [1,"Which document sets the minimum security configuration for a type of system?","A baseline",["A guideline","A policy statement","An incident report"],"Baselines, such as a hardened server build, give a consistent minimum that every system of that type must meet.","1.6"],
 [1,"Who should approve the organization's security policies?","Senior management",["Each individual employee","The help desk","An outside vendor"],"Management approval gives policies authority and shows leadership's commitment.","1.6"],
 [1,"Which BIA output states how much data, measured in time, the business can afford to lose?","The RPO",["The MTD","The RTO","The ALE"],"The recovery point objective sets how often data must be backed up or replicated. RTO and MTD are about downtime, not data loss.","1.7"],
 [1,"Why does a BIA map each process's dependencies?","So recovery plans cover the suppliers, systems and utilities each critical process needs",["To find employees to lay off","To choose the office's paint colors","To set marketing budgets"],"A process can't recover if a dependency it relies on, such as a key vendor or system, isn't recovered too.","1.7"],
 [1,"When should background checks happen for new hires?","Before hiring, as far as the law and the role's sensitivity allow",["Only after a security incident","Never, for privacy reasons","Only for executives, after a year"],"Pre-employment screening reduces insider risk. It must follow local laws and be consistent for each role.","1.8"],
 [1,"Besides cross-training, what security benefit does job rotation have?","It can expose fraud, because someone new takes over the duties",["It reduces the need for access control","It lets one person handle every critical task","It removes the need for audits"],"A new person in the role may notice irregularities the previous person was hiding.","1.8"],
 [1,"How does qualitative risk analysis express risk?","With ratings such as high, medium and low",["Only in exact dollar figures","With SLE and ALE calculations only","With nothing written down"],"Qualitative analysis is quick and uses judgment. Quantitative analysis puts numbers on risk, such as ALE.","1.9"],
 [1,"How does risk tolerance relate to risk appetite?","Tolerance is the acceptable variation around the overall appetite",["They are unrelated","Tolerance is always zero","Appetite applies only to IT"],"Risk appetite is how much risk the organization will accept overall. Tolerance sets the acceptable deviation for specific risks or objectives.","1.9"],
 [1,"When is threat modeling most valuable?","Early in design, before the system is built",["Only after deployment","Only after a breach","Never, if a firewall is in place"],"Finding threats in design lets you fix them cheaply. Revisit the model as the system changes.","1.10"],
 [1,"What does an attack tree show?","The different paths an attacker could take to reach a goal",["The organization's reporting lines","Network cabling","A list of employee passwords"],"The goal is the root, and each branch is a way to achieve it, which helps you see where controls break the most paths.","1.10"],
 [1,"Which contract clauses help manage a supplier's security risk?","Right-to-audit, breach notification and minimum security requirements",["Payment terms only","Marketing logo usage","Office parking rules"],"Contracts turn security expectations into obligations you can enforce and check.","1.11"],
 [1,"How can an organization reduce the risk of counterfeit network hardware?","Buy from authorized sources and verify integrity on delivery",["Buy the cheapest units online","Skip firmware checks","Accept any unsealed package"],"Authorized channels, tamper-evident packaging and firmware checks reduce counterfeit and tampered hardware.","1.11"],
 [1,"Who should get additional, role-specific security training beyond general awareness?","Privileged users, developers and others with elevated risk",["No one, since everyone needs the same content","Only new interns","Only the CEO"],"People with more access or specialized duties need training that matches their risks.","1.12"],
 [1,"Which topic keeps a security awareness program current?","Emerging threats such as deepfakes and AI-assisted phishing",["Only the history of computing","Office furniture safety","The company's holiday schedule"],"Awareness content should reflect how attackers currently work, so people recognize new tricks.","1.12"],
 [2,"How is a server classified when it holds data at several classification levels?","At the level of the most sensitive data it holds",["At the lowest level it holds","Not at all","By its purchase price"],"An asset must be protected according to its most sensitive contents.","2.1"],
 [2,"Who decides when information can be declassified?","The data owner, following a defined process",["Any user who reads it","The backup operator","An outside vendor"],"Declassifying lowers protection, so it needs the owner's authorization and a documented process.","2.1"],
 [2,"What should a data handling standard specify for each classification level?","How the data may be stored, sent, shared and destroyed",["Which font to use","Each employee's salary","The office layout"],"Handling rules turn classification labels into concrete actions people can follow.","2.2"],
 [2,"Confidential data needs to be shared with a partner. Who may receive it?","Only people with a need to know, under an NDA or contract",["Anyone at the partner company","The public, if asked politely","Anyone who has a company email address"],"Sharing externally still follows need to know and legal protections for the data.","2.2"],
 [2,"How should cloud resources be provisioned securely?","From approved templates with security controls built in",["By hand, with default settings","With public access turned on by default","Without tagging or an inventory"],"Templates and infrastructure as code make secure configuration consistent and auditable.","2.3"],
 [2,"What does least functionality mean when provisioning systems?","Removing software, services and features the system doesn't need",["Giving every user admin rights","Installing every available tool","Turning off all logging"],"Every unneeded component adds attack surface, so systems should run only what their job requires.","2.3"],
 [2,"Which order shows the data lifecycle?","Create, store, use, share, archive, destroy",["Destroy, archive, create, use","Share, create, destroy, store","Use, destroy, store, archive"],"Security controls apply at every phase, from classifying data when it's created to sanitizing it at the end.","2.4"],
 [2,"Which privacy principle says to collect only the personal data needed for the purpose?","Data minimization",["Data maximization","Data replication","Data aggregation"],"Collecting less means there's less to protect and less exposure if a breach happens.","2.4"],
 [2,"What determines how long records must be kept?","Legal, regulatory and business requirements",["Whatever storage space is free","Each employee's preference","The age of the server"],"Retention schedules balance legal duties against the risk and cost of keeping data.","2.5"],
 [2,"End-of-life laptops are being retired. What must happen before they leave the organization?","Their storage must be sanitized or destroyed",["Nothing, since they're old","Only the stickers need removing","Only the user's desktop needs clearing"],"Retired hardware often still holds sensitive data. Sanitize it, and record a certificate of destruction where appropriate.","2.5"],
 [2,"What does tokenization do?","It replaces sensitive values with surrogate tokens that have no meaning outside the system",["It compresses data","It encrypts the whole disk","It deletes the data permanently"],"Tokenization is common for card numbers. The real values stay in a protected vault, which reduces compliance scope.","2.6"],
 [2,"Which technology controls what recipients can do with a document, such as printing or forwarding, after it's shared?","DRM",["DLP","NAC","IDS"],"Digital rights management, or information rights management, keeps controls attached to the content wherever it goes.","2.6"],
 [3,"A network uses a firewall, an IPS, endpoint protection and MFA together. Which principle is this?","Defense in depth",["Single point of failure","Security through obscurity","Fail open"],"Layered controls mean that if one fails, others still protect the asset.","3.1"],
 [3,"In the cloud, who is responsible for securing what?","The provider and the customer each secure different layers, depending on the service model",["The provider secures everything","The customer secures everything","Nobody, since the cloud is secure by default"],"In IaaS the customer secures the OS and apps. In SaaS the provider covers far more, but the customer still owns its data and accounts.","3.1"],
 [3,"Which integrity model controls access through subject, program and object triples?","Clark-Wilson",["Biba","Bell-LaPadula","Brewer-Nash"],"In Clark-Wilson, users reach data only through approved programs, which enforce well-formed transactions and separation of duties.","3.2"],
 [3,"Which model makes sure a system moves only from one secure state to another?","The state machine model",["The Chinese wall model","The waterfall model","The OSI model"],"If every state transition keeps security intact, the system stays secure. Many other models build on this idea.","3.2"],
 [3,"Which standard validates cryptographic modules?","FIPS 140-3",["ISO 9001","ITIL","PCI DSS"],"FIPS 140 testing gives confidence that a module implements cryptography correctly. Many government and regulated buyers require it.","3.3"],
 [3,"A required control can't be applied to a legacy system. What should you use instead?","A compensating control that reduces the same risk",["Nothing; accept all the risk silently","Remove all controls","Wait until the system breaks"],"Compensating controls, such as isolating the system, give similar protection when the primary control isn't possible.","3.3"],
 [3,"How does an HSM differ from a TPM?","An HSM is a dedicated device for managing keys at scale, while a TPM is a chip in one computer",["They're identical","A TPM manages keys for thousands of servers","An HSM is a type of hard drive"],"HSMs serve applications and servers across an organization with high assurance. TPMs protect a single device's keys and boot process.","3.4"],
 [3,"What's the main isolation risk in virtualization?","VM escape, where code in a guest breaks out to the hypervisor or other VMs",["VMs use too little memory","VMs can't be backed up","VMs never need patching"],"Keep hypervisors patched and separate workloads of different trust levels.","3.4"],
 [3,"Which hidden way of passing information uses timing or storage in a way the system wasn't designed for?","A covert channel",["An encrypted tunnel","A VPN","An API gateway"],"Covert channels sidestep normal security controls. Timing channels change how long things take, and storage channels change shared resources.","3.5"],
 [3,"Which database technique stores different versions of a record at different classification levels to prevent inference?","Polyinstantiation",["Normalization","Replication","Tokenization"],"Users with lower clearance see a cover version, so they can't infer that a secret record exists.","3.5"],
 [3,"What's a main advantage of elliptic curve cryptography?","Equivalent strength with much smaller keys",["It doesn't need keys","It's a symmetric cipher","It can't be used for signatures"],"Smaller keys mean faster operations and less storage, which suits mobile and IoT devices.","3.6"],
 [3,"What does perfect forward secrecy protect?","Past sessions, even if the server's long-term private key is stolen later",["Only future sessions","Hard drives at rest","Passwords stored in plain text"],"Each session uses temporary keys that aren't derived from the long-term key, so captured traffic can't be decrypted later.","3.6"],
 [3,"Which defense makes precomputed rainbow table attacks ineffective?","Adding a unique salt to each password before hashing",["Using shorter passwords","Storing passwords in plain text","Using the same hash for everyone"],"Salts make each hash unique, so attackers would need a separate table for every salt.","3.7"],
 [3,"An attacker glitches a device's power to make it make mistakes during encryption, revealing the key. What is this?","A fault injection attack",["A dictionary attack","A replay attack","A watering hole attack"],"Fault injection attacks the implementation rather than the math. Tamper-resistant hardware helps.","3.7"],
 [3,"Which CPTED strategy uses fences, signs and landscaping to show that a space is owned and watched?","Territorial reinforcement",["Natural surveillance","Natural access control","Target hardening"],"Clear boundaries signal ownership and discourage intruders.","3.8"],
 [3,"How should a facility's security zones be arranged?","In layers, with stricter controls closer to the most critical assets",["With everything open to visitors","With the server room next to the lobby door","With one zone for everything"],"Layered zones mean an intruder must defeat several controls to reach critical areas.","3.8"],
 [3,"How should wiring closets be protected?","Kept locked, with access limited and logged",["Left open for convenience","Used as general storage","Shared with the cleaning staff"],"Wiring closets give direct access to network equipment, so treat them as restricted areas.","3.9"],
 [3,"Which conditions suit an off-site media storage facility?","Controlled temperature and humidity, fire protection and restricted access",["A warm attic","A damp basement","An unlocked hallway"],"Backup media degrade and can be stolen, so storage must protect both the media's condition and its security.","3.9"],
 [3,"What does a requirements traceability matrix help prove?","That each security requirement was built and tested",["Who has the best parking space","How much the system cost","Which vendor was cheapest"],"Traceability links requirements to the design, the code and the tests, so nothing is missed.","3.10"],
 [3,"What's the difference between verification and validation?","Verification checks the system was built right; validation checks it's the right system for the need",["They mean the same thing","Validation happens only after disposal","Verification is done only by users"],"Both are needed. A system can meet its specs and still not solve the real problem.","3.10"],
 [5,"How should service accounts be granted access?","With only the rights their service needs, and no interactive sign-in",["As domain administrators for convenience","With passwords shared with every admin","With no owner assigned"],"Service accounts are a favorite target because they often hold broad rights and rarely change their passwords.","5.1"],
 [5,"A policy blocks access to the finance system outside business hours. What kind of control is this?","Context-based access control",["Discretionary access control","A physical control","Data classification"],"Context-based rules weigh conditions such as time, location or device when deciding on access.","5.1"],
 [5,"What makes FIDO2 passwordless authentication resistant to phishing?","It uses public-key credentials tied to the device and the real website's origin",["It emails a code to the user","It uses a longer password","It stores the password in the browser"],"The private key never leaves the authenticator, and it won't sign for a lookalike site.","5.2"],
 [5,"What is identity proofing?","Verifying that people are who they claim to be before issuing credentials",["Testing password strength","Encrypting user data","Reviewing firewall logs"],"Strong credentials mean little if they were issued to the wrong person, so proofing comes first.","5.2"],
 [5,"What makes federated single sign-on work between two organizations?","A trust relationship, so the service provider accepts the identity provider's assertions",["Sharing every user's password","A shared Wi-Fi network","Identical usernames in both companies"],"Federation relies on agreed trust and signed assertions, so users never give their password to the partner.","5.3"],
 [5,"A company syncs its on-premises directory with a cloud identity provider. What model is this?","Hybrid identity",["Air-gapped identity","Local accounts only","Anonymous access"],"Hybrid identity lets users sign in to both on-premises and cloud resources with one account.","5.3"],
 [5,"A sign-in from a new country triggers an extra MFA prompt. What kind of access control is this?","Risk-based access control",["Mandatory access control","Discretionary access control","Rule-based access control"],"Risk-based, or adaptive, access control raises its requirements when signals look risky.","5.4"],
 [5,"How does an access control list differ from a capability table?","An ACL is attached to the object; a capability table is attached to the subject",["They're the same thing","ACLs apply only to users","Capability tables apply only to files"],"An ACL lists who can access a resource. A capability table lists what a user can access.","5.4"],
 [5,"What should a new hire's access be based on?","Their HR-approved role, following least privilege",["Copying a coworker's access exactly","Whatever they ask for","Full admin rights until they settle in"],"Copying another user's access spreads privilege creep. Role-based provisioning keeps access appropriate.","5.5"],
 [5,"How should service and application accounts be managed over their lifecycle?","Give each an owner, review them regularly, and rotate their credentials",["Never review them","Share them between teams","Leave them enabled after the app is retired"],"Orphaned service accounts with static passwords are a common way in for attackers.","5.5"],
 [5,"Which type of cryptography does Kerberos rely on?","Symmetric keys shared with the KDC",["Only public key certificates","No cryptography at all","Hashing only"],"Classic Kerberos uses symmetric secrets. That's one reason the KDC must be heavily protected.","5.6"],
 [5,"Which session management practice limits the damage from an unattended, signed-in session?","Idle timeouts, with reauthentication for sensitive actions",["Sessions that never expire","Reusing session IDs after sign-out","Putting session tokens in URLs"],"Short idle timeouts and step-up authentication reduce session hijacking and misuse.","5.6"],
 [6,"How does a penetration test differ from a vulnerability assessment?","A penetration test tries to exploit weaknesses; an assessment identifies and rates them",["They're identical","An assessment always exploits systems","A penetration test never needs permission"],"Penetration tests prove real impact and need written authorization and rules of engagement.","6.1"],
 [6,"Which tools continuously run automated, safe attack scenarios to check that controls work?","Breach and attack simulation tools",["Spreadsheets","Backup software","Load balancers"],"Breach and attack simulation tools check detection and prevention regularly, not just once a year.","6.2"],
 [6,"Which process data shows whether the organization can actually recover from an outage?","Disaster recovery and BC test results",["Marketing survey results","Employee birthdays","Printer usage logs"],"Recovery test results, including times compared with the RTO, show real resilience.","6.3"],
 [6,"A tester finds a flaw in a vendor's product while assessing your systems. What's the ethical next step?","Report it to the vendor through responsible disclosure",["Post an exploit publicly at once","Sell it to the highest bidder","Ignore it"],"Responsible disclosure gives the vendor time to fix the flaw before details are published.","6.4"],
 [6,"What should happen after audit findings are reported?","Management agrees on remediation plans with owners and due dates",["The findings are filed and forgotten","The auditors fix everything themselves","The audit is repeated the next day"],"Tracking findings to closure is what makes an audit improve security.","6.5"],
 [7,"Why use a write blocker when imaging a suspect's hard drive?","It stops any changes to the original drive",["It speeds up the copy","It encrypts the evidence","It deletes deleted files"],"Preserving the original unchanged keeps evidence admissible. Analysis happens on the verified copy.","7.1"],
 [7,"Why hash a forensic image right after making it?","To prove later that the image matches the original and hasn't changed",["To compress the image","To make it readable faster","To encrypt the evidence"],"Matching hashes taken at acquisition and before analysis show the evidence is intact.","7.1"],
 [7,"What is eDiscovery?","The process of finding, preserving and producing electronic information for legal cases",["A type of malware scan","A backup format","A DNS lookup"],"Frameworks such as the EDRM guide eDiscovery from identifying data through to producing it.","7.1"],
 [7,"Which technology learns normal user behavior and flags unusual activity?","UEBA",["DHCP","NAT","FTP"],"User and entity behavior analytics can catch insider threats and compromised accounts that rules miss.","7.2"],
 [7,"Which monitoring watches outbound traffic for signs of data theft?","Egress monitoring",["Ingress filtering only","Bandwidth throttling","Port forwarding"],"Data loss prevention and egress filtering catch exfiltration that perimeter defenses let through.","7.2"],
 [7,"Analysts search proactively for attackers who've slipped past automated defenses. What is this?","Threat hunting",["Patch management","Change management","Load testing"],"Threat hunters start from a hypothesis and look for subtle signs that tools haven't alerted on.","7.2"],
 [7,"What is configuration drift?","Systems gradually moving away from their approved baseline",["A storage technology","A type of encryption","A network routing protocol"],"Drift comes from untracked changes. Automated compliance checks find and fix it.","7.3"],
 [7,"What does a CMDB store?","Configuration items and the relationships between them",["Only user passwords","Only marketing data","Only email messages"],"A configuration management database helps you judge a change's impact and investigate incidents.","7.3"],
 [7,"Why update golden images regularly?","So new systems start with current patches and settings",["Golden images never need updates","To make images larger","To remove all security settings"],"Old images deploy vulnerable systems that then need patching straight away.","7.3"],
 [7,"Which example shows separation of duties?","A developer can't deploy their own code to production without someone else approving it",["One admin controls every system alone","Everyone shares one account","Users approve their own access requests"],"Splitting critical tasks means one person can't commit and hide fraud or mistakes.","7.4"],
 [7,"How should privileged accounts be handled day to day?","Limit them, monitor their use, and use them only when needed",["Use them for email and browsing","Share them across the team","Never review them"],"Admins should use standard accounts for daily work, with privileged access vaulted and logged.","7.4"],
 [7,"What does an SLA with a managed service provider define?","The service levels the provider commits to, such as uptime and response times",["The provider's internal salaries","The customer's passwords","The office dress code"],"SLAs set measurable expectations and remedies, and support security operations that depend on vendors.","7.4"],
 [7,"Why track software licenses as part of resource protection?","Unlicensed or unknown software creates legal and security risk",["Licenses make software faster","Tracking replaces patching","Auditors don't care about software"],"License tracking also shows what's installed, which feeds vulnerability management.","7.5"],
 [7,"How should removable media be controlled?","Restrict its use, and require encryption where it's allowed",["Allow any USB drive with no rules","Ban all backups","Let users choose their own policy"],"Removable media can carry malware in and data out, so control it by policy and technology.","7.5"],
 [7,"Why protect cloud snapshots and backups as tightly as production?","They contain full copies of the data",["They're always empty","They can't be accessed by anyone","They expire within seconds"],"Exposed snapshots have leaked whole databases. Apply access control and encryption to them.","7.5"],
 [7,"In ISC2's incident management steps, what does the mitigation step do?","Contains the incident to stop it spreading",["Writes the final report","Restores normal operations","Trains users"],"Containment, such as isolating hosts, limits the damage before recovery and remediation.","7.6"],
 [7,"Which incident step brings systems back to normal operation?","Recovery",["Detection","Mitigation","Reporting"],"Recovery restores service. Remediation then fixes the root cause so the incident doesn't recur.","7.6"],
 [7,"In incident management, what does the reporting step involve?","Notifying management and any required outside parties, such as regulators",["Deleting the logs","Ignoring legal requirements","Only telling the attacker"],"Reporting duties depend on the law, contracts and policy, and timelines can be short.","7.6"],
 [7,"Which control lets only approved programs run?","Application allow listing",["Deny listing only","Port forwarding","DNS caching"],"Allow listing blocks unknown malware by default, but it needs maintenance as software changes.","7.7"],
 [7,"Where should a suspicious attachment be run to see what it does safely?","In an isolated sandbox",["On the CEO's laptop","On a domain controller","On a production database server"],"A sandbox detonates the file and watches its behavior without risking real systems.","7.7"],
 [7,"Which kind of provider can monitor an organization's security around the clock as an outsourced service?","An MSSP",["An ISP only","A CDN","A DNS registrar"],"A managed security service provider runs monitoring and response for organizations that can't staff a 24/7 SOC.","7.7"],
 [7,"Which order is best practice for patch management?","Evaluate, test, approve, deploy, verify",["Deploy, then test","Approve, then evaluate after a breach","Skip testing for every patch"],"Testing and verification stop patches breaking systems and confirm they actually installed.","7.8"],
 [7,"A critical vulnerability has no patch yet. What should you do?","Apply compensating controls, such as isolating or filtering the system, until a fix is available",["Do nothing until the vendor responds","Turn off all monitoring","Publish the details publicly"],"Workarounds and extra monitoring reduce exposure until a patch arrives.","7.8"],
 [7,"Why do credentialed vulnerability scans find more than non-credentialed ones?","They sign in to the system and can see installed software and settings",["They run faster","They skip all checks","They only scan open ports"],"Credentialed scans give a more accurate picture of missing patches and misconfigurations.","7.8"],
 [7,"Which group reviews and approves normal changes?","The CAB",["The help desk alone","Each end user","An outside auditor"],"The change advisory board weighs risk, impact and timing before approving a change.","7.9"],
 [7,"Why record every change made to production systems?","To trace incidents back to changes, and to support audits",["To slow work down on purpose","To replace backups","To store passwords"],"Change records are often the fastest way to find what caused an outage.","7.9"],
 [7,"What is a standard change?","A pre-approved, low-risk, routine change that follows a set procedure",["Any emergency change","A change that skips all records","A change made by an attacker"],"Pre-approval for well-understood routine work keeps the CAB focused on riskier changes.","7.9"],
 [7,"What does a warm site provide?","Some equipment and connectivity, usually ready within days",["Nothing but an empty room","A live mirror of production","Only a phone line"],"Warm sites balance cost and recovery speed between hot and cold sites.","7.10"],
 [7,"What's the main weakness of a reciprocal (mutual assistance) agreement?","It's hard to enforce, and the other site may lack capacity in a real disaster",["It's too expensive","It needs no planning","It guarantees instant recovery"],"Two organizations agree to host each other, but a shared disaster or a busy partner can leave you with nothing.","7.10"],
 [7,"Which technique keeps a service running if one server fails, by moving the work to another node automatically?","Failover clustering",["Single sign-on","Data classification","Port mirroring"],"High-availability clusters remove single points of failure for critical services.","7.10"],
 [7,"After a disaster is declared and people are safe, what should happen before restoring systems?","Assess the damage to plan the recovery",["Return straight to the original site","Delete the plan","Notify customers that nothing happened"],"A damage assessment shows which recovery strategy and timeline are realistic.","7.11"],
 [7,"When moving operations back to the primary site after a disaster, what usually moves first?","The least critical functions, to test the restored site",["The most critical functions first","Everything at once","Nothing, ever"],"Moving lower-risk work first proves the primary site is stable before critical work returns.","7.11"],
 [7,"Why does a DR plan include a communications plan?","So staff, customers, partners and the media get accurate, timely information",["To replace the recovery steps","To delay notifications","To avoid legal requirements"],"Clear communication reduces panic and protects the organization's reputation during recovery.","7.11"],
 [7,"In which DR test do reviewers read the plan to check that it's accurate and complete?","A read-through (checklist) test",["A full interruption test","A parallel test","A live failover"],"Read-throughs are the cheapest test and catch outdated contacts and steps.","7.12"],
 [7,"Which DR test practices a scenario up to the point of an actual failover, without moving production?","A simulation test",["A full interruption test","A checklist review","A cutover"],"Simulations exercise decisions and procedures realistically without the risk of a real failover.","7.12"],
 [7,"Why test DR plans regularly?","To find gaps and keep staff familiar with their roles",["To use up the budget","Because plans never change","To replace backups"],"Untested plans often fail in a real disaster because of outdated details and untrained staff.","7.12"],
 [7,"What should come out of every BC exercise?","An after-action report with gaps and assigned fixes",["Nothing written down","A press release","A new logo"],"Lessons learned only help if they're tracked to completion.","7.13"],
 [7,"Who should take part in BC planning exercises?","Business process owners as well as IT",["Only IT staff","Only outside consultants","Only new hires"],"Continuity is a business function. IT can't decide recovery priorities alone.","7.13"],
 [7,"Why does a BC plan name alternates for key roles?","So decisions can still be made if key people aren't available",["To give everyone a title","To replace the org chart","To avoid training"],"Succession and alternates keep the plan running when leaders are unreachable.","7.13"],
 [7,"What's good practice for visitors to a secure facility?","Sign them in, give them visible badges, and escort them",["Let them roam freely","Lend them employee badges","Skip records for short visits"],"Visitor logs and escorts control and record who is on site.","7.14"],
 [7,"A master key to the server room is lost. What should you do?","Rekey or replace the affected locks, and update key records",["Wait to see if it turns up","Make more copies","Remove the door"],"A lost key compromises every lock it opens until those locks are changed.","7.14"],
 [7,"What's the main security purpose of good lighting and visible cameras around a building?","Deterring intruders and supporting detection",["Saving energy","Replacing locks","Improving Wi-Fi"],"Well-lit, monitored areas discourage crime, and cameras give evidence for investigations.","7.14"],
 [7,"Why run evacuation drills?","So people know how to leave safely and quickly in an emergency",["To test the network","To check badge readers only","To count laptops"],"Drills reveal problems such as blocked exits and make the response automatic.","7.15"],
 [7,"Which practices help keep remote workers secure?","A secure home setup: VPN, locked devices, and privacy from others in the room",["Sharing work devices with family","Turning off updates","Using public Wi-Fi without protection"],"Remote work moves the workplace outside company controls, so policy and training must cover it.","7.15"],
 [7,"An employee reports that a coworker has made threats of violence. What should the organization do?","Follow its workplace violence procedures, involving HR, security and, if needed, law enforcement",["Ignore it","Post about it publicly","Tell the coworker who reported it"],"Personnel safety is the top priority. Clear procedures make sure threats are taken seriously.","7.15"],
 [8,"What do software assurance maturity models such as SAMM measure?","How mature and effective an organization's secure development practices are",["Network bandwidth","Office temperature","Employee attendance"],"Maturity models help set goals and improve secure development step by step.","8.1"],
 [8,"Which requirements describe how an attacker might abuse a feature?","Abuse (misuse) cases",["Marketing requirements","Performance requirements only","License requirements"],"Abuse cases turn threats into testable security requirements early in development.","8.1"],
 [8,"How should code repositories be protected?","With access control, MFA, branch protection and reviewed merges",["Make every repository public","Let anyone push to main","Store secrets in the repository"],"Repositories hold the source of truth, and a compromise can inject malicious code everywhere.","8.2"],
