const A2_Q = [ // [domain, question, correct, [wrong x3], explanation, objective] — original items written against the 220-1202 objectives
 [1,"Which operating system is open source and comes in many distributions, such as Ubuntu and Fedora?","Linux",["Windows","macOS","iPadOS"],"Linux is open source, and each distribution bundles the kernel with its own tools. Windows and macOS are proprietary.","1.1"],
 [1,"Which operating system runs on Chromebooks and keeps most apps and data in the cloud?","ChromeOS",["Android","Windows 11 Home","macOS"],"ChromeOS is built around the Chrome browser and Google accounts, with little stored locally. It can also run Android apps.","1.1"],
 [1,"A company keeps running an operating system after its vendor stops releasing updates for it. What's the main risk?","It gets no more security patches",["It stops booting","Its files become read-only","It can no longer use Wi-Fi"],"Once an OS reaches end of life, new vulnerabilities are never fixed. Plan upgrades before the end-of-support date.","1.1"],
 [1,"Which file system is the default for Windows system drives and supports permissions and encryption?","NTFS",["FAT32","exFAT","ext4"],"NTFS supports permissions, EFS encryption, compression and very large files. FAT32 has a 4 GB file limit, exFAT suits flash drives, and ext4 is for Linux.","1.1"],
 [1,"Which file system is the best choice for a USB drive shared between Windows and macOS with files larger than 4 GB?","exFAT",["FAT32","NTFS","ext4"],"exFAT works on both systems and supports large files. FAT32 limits each file to 4 GB, and macOS can only read NTFS by default.","1.2"],
 [1,"Which partition style does UEFI firmware need to boot Windows 11, and allows disks larger than 2 TB?","GPT",["MBR","FAT32","APFS"],"GPT supports more partitions and very large disks, and it is required for UEFI boot. MBR is limited to 2 TB and four primary partitions.","1.2"],
 [1,"Which installation method keeps a user's files, settings and apps while moving to a newer Windows version?","An in-place upgrade",["A clean install","An image deployment","A factory reset"],"An in-place upgrade installs over the existing system. A clean install wipes the drive and starts fresh.","1.2"],
 [1,"IT wants to install Windows on 50 new PCs over the network without using USB drives. Which boot method should they use?","PXE network boot",["Booting from optical media","An in-place upgrade","Recovery partition boot"],"PXE lets a PC boot from a deployment server over the network, so every PC can get the same image remotely.","1.2"],
 [1,"Which Windows 11 edition can't join an Active Directory domain?","Home",["Pro","Enterprise","Pro for Workstations"],"Home lacks domain join, Group Policy editing, BitLocker management and Remote Desktop hosting. Businesses use Pro or higher.","1.3"],
 [1,"Which Windows edition can host incoming Remote Desktop connections?","Pro",["Home","Home in S mode","None of them"],"Every edition includes the Remote Desktop client, but only Pro and higher can accept incoming RDP sessions.","1.3"],
 [1,"Which Windows feature, managed fully in Pro and higher, encrypts entire drives?","BitLocker",["EFS","Windows Hello","Defender SmartScreen"],"BitLocker encrypts whole volumes, often with the TPM. EFS encrypts individual files and folders on NTFS.","1.3"],
 [1,"Which tool shows the events recorded just before an application crashed?","Event Viewer",["Device Manager","Disk Management","Task Scheduler"],"Event Viewer holds the Application, System and Security logs. Look for error events at the time of the crash.","1.4"],
 [1,"Which tool lets you roll back a graphics driver that started causing problems?","Device Manager",["Event Viewer","Performance Monitor","Disk Cleanup"],"In Device Manager, open the device's Driver tab and choose Roll Back Driver to return to the previous version.","1.4"],
 [1,"A PC is slow to start. Where can you see and disable apps that launch at sign-in?","The Startup apps tab in Task Manager",["Disk Management","Device Manager","The Registry Editor's HKEY_USERS hive"],"Task Manager's startup list shows each app's impact so you can turn off ones that aren't needed.","1.4"],
 [1,"Which tool records performance counters over a long period and saves them as reports?","Performance Monitor",["Resource Monitor","Task Manager","System Information"],"Performance Monitor uses data collector sets to log counters over time. Resource Monitor and Task Manager show live activity.","1.4"],
 [1,"Which command scans protected Windows system files and replaces corrupted ones?","sfc /scannow",["chkdsk /f","gpupdate /force","ipconfig /renew"],"System File Checker restores damaged system files. chkdsk repairs the file system, not individual system files.","1.5"],
 [1,"Which command applies new Group Policy settings without waiting for the next refresh?","gpupdate /force",["gpresult /r","sfc /scannow","net use"],"gpupdate /force reapplies every policy right away. gpresult only reports which policies apply.","1.5"],
 [1,"Which command clears a PC's DNS cache after a website moved to a new IP address?","ipconfig /flushdns",["ipconfig /release","nslookup","netstat -a"],"Flushing the DNS cache removes stale entries so the next lookup gets the new address.","1.5"],
 [1,"Which command copies a folder tree and can retry failed files and mirror the source?","robocopy",["copy","dir","format"],"Robocopy (Robust File Copy) handles large copies with retries, logs and mirroring. Plain copy handles only simple file copies.","1.5"],
 [1,"Where in Windows 11 do you change the default app that opens PDF files?","Settings > Apps > Default apps",["Device Manager","Disk Management","Event Viewer"],"Default apps sets which program opens each file type or link type.","1.6"],
 [1,"A user wants file name extensions to be visible. Where do you change this?","File Explorer Options or the View menu in File Explorer",["Power Options","Device Manager","Network and Sharing Center"],"Showing extensions helps users spot fake files such as invoice.pdf.exe.","1.6"],
 [1,"Which setting controls what happens when a laptop's lid is closed?","Power Options",["Sound settings","Display settings","Time and language"],"Power Options sets the lid, power button and sleep behavior, and the power plan.","1.6"],
 [1,"A laptop should treat a café's Wi-Fi as untrusted. Which network profile should it use?","Public",["Private","Domain","Metered"],"The Public profile turns off network discovery and file sharing and applies stricter firewall rules. Private is for trusted home networks.","1.7"],
 [1,"Which command maps drive letter S: to a shared folder on a server?","net use S: \\\\server\\share",["net user S: \\\\server\\share","map S: server/share","ipconfig /map S:"],"net use connects a drive letter to an SMB share. net user manages accounts.","1.7"],
 [1,"Where can a user set a manual proxy server for Windows apps?","Settings > Network & internet > Proxy",["Device Manager","Disk Management","Task Scheduler"],"The Proxy page sets automatic or manual proxy settings that browsers and many apps use.","1.7"],
 [1,"Which macOS feature backs up the whole Mac to an external drive automatically?","Time Machine",["FileVault","Spotlight","Keychain"],"Time Machine keeps hourly, daily and weekly backups. FileVault encrypts the disk, Spotlight searches, and Keychain stores passwords.","1.8"],
 [1,"Which macOS feature stores saved passwords and certificates?","Keychain",["Finder","Dock","Mission Control"],"Keychain Access manages passwords, keys and certificates, and iCloud Keychain syncs them across Apple devices.","1.8"],
 [1,"Which macOS feature encrypts the startup disk?","FileVault",["Gatekeeper","Time Machine","Boot Camp"],"FileVault encrypts the whole disk. Gatekeeper controls which apps may run.","1.8"],
 [1,"Which Linux command shows the directory you are currently in?","pwd",["ls","cd","whoami"],"pwd (print working directory) shows your location. ls lists files, cd changes directory, and whoami shows the current user.","1.9"],
 [1,"Which Linux command changes a file's permissions?","chmod",["chown","sudo","grep"],"chmod sets read, write and execute permissions. chown changes the owner, and sudo runs a command as root.","1.9"],
 [1,"Which command installs software on Ubuntu?","apt",["dnf","brew","msiexec"],"Debian-based systems such as Ubuntu use apt. Fedora and Red Hat use dnf, brew is for macOS, and msiexec installs Windows packages.","1.9"],
 [1,"Before installing a program, what should you check first?","That the PC meets the app's system requirements, such as OS version, RAM and storage",["That the program has a dark theme","That the PC has a printer","That the monitor is 4K"],"Check the CPU type, 32- or 64-bit, RAM, storage and OS version before installing, to avoid failed installs and poor performance.","1.10"],
 [1,"Can a 64-bit application run on a 32-bit version of Windows?","No. 64-bit apps need a 64-bit operating system",["Yes, always","Yes, in compatibility mode","Only if it's run as administrator"],"A 64-bit OS can run most 32-bit apps, but a 32-bit OS can't run 64-bit apps.","1.10"],
 [1,"A business app must be installed on 200 PCs. What's the best way?","Deploy it centrally with management tools or Group Policy",["Email the installer to everyone","Install it from a USB drive at each desk","Ask users to download it from the web"],"Central deployment keeps installs consistent, licensed and tracked, and users don't need admin rights.","1.10"],
 [1,"A user's files in OneDrive aren't showing up on their new laptop. What should you check first?","That they're signed in to OneDrive with the right account and sync is turned on",["The laptop's BIOS version","The printer driver","The DHCP lease time"],"Cloud storage syncs only when the client is signed in to the correct account and the folders are chosen for sync.","1.11"],
 [1,"Which cloud productivity feature lets several people edit the same document at the same time?","Real-time co-authoring",["Offline mode","File compression","BitLocker"],"Cloud suites such as Microsoft 365 and Google Workspace let several editors work in one shared file at the same time.","1.11"],
 [1,"How do you give a new employee Microsoft 365 apps and email in a cloud tenant?","Create the user account and assign a license",["Install Office from an old CD","Map a network drive","Create a DHCP reservation"],"In cloud suites, an account and a license unlock the apps, the mailbox and storage for that user.","1.11"],
 [2,"Which physical security measure stops a second person walking in right behind someone who badged in?","An access control vestibule",["A cable lock","A privacy screen","A login banner"],"A vestibule (mantrap) has two doors that won't both open at once, so only one person passes at a time.","2.1"],
 [2,"Which sign-in method combines something you know with something you have?","MFA, such as a password plus a code from an authenticator app",["Two different passwords","A long password","A username and a PIN"],"Multifactor authentication needs two different factor types. Two passwords are both something you know, so they count as only one factor.","2.1"],
 [2,"Which principle gives each user only the access needed to do their job?","Least privilege",["Defense in depth","Single sign-on","Separation of duties"],"Least privilege limits the damage a compromised account or a mistake can cause.","2.1"],
 [2,"What does a laptop cable lock protect against?","Someone walking off with the laptop",["Malware","Shoulder surfing","Phishing"],"A cable lock ties the laptop to a desk through its security slot to deter theft. It does nothing against digital threats.","2.1"],
 [2,"Where in Windows can you allow one app through the firewall?","Windows Defender Firewall settings",["Device Manager","Disk Management","System Information"],"Use Allow an app through firewall, or advanced settings, to add rules for programs or ports.","2.2"],
 [2,"Which Windows feature asks for confirmation before a program makes system-level changes?","UAC",["EFS","SmartScreen","BitLocker"],"User Account Control prompts for consent or admin credentials when an app needs elevated rights.","2.2"],
 [2,"Which Windows account type should everyday users have?","Standard user",["Administrator","Guest","Power user"],"Standard accounts can't make system-wide changes, which limits what malware running as that user can do. Admins should use a separate account for admin work.","2.2"],
 [2,"Which Windows feature signs in with a face scan or fingerprint?","Windows Hello",["BitLocker","UAC","Credential Manager"],"Windows Hello uses biometrics or a PIN tied to the device's TPM instead of typing a password.","2.2"],
 [2,"Which wireless security protocol replaces the pre-shared key handshake with SAE?","WPA3",["WPA2","WEP","WPS"],"WPA3 uses Simultaneous Authentication of Equals, which resists offline password-guessing attacks. WPA2 personal uses a PSK handshake.","2.3"],
 [2,"Which method checks wireless users against a central server instead of a shared passphrase?","WPA3-Enterprise with RADIUS",["WPA3-Personal","WEP","An open network"],"Enterprise mode uses 802.1X to authenticate each user with their own credentials on a RADIUS server, so one leaked password doesn't expose everyone.","2.3"],
 [2,"Which authentication protocol uses tickets and is used in Windows Active Directory domains?","Kerberos",["RADIUS","TACACS+","TKIP"],"Kerberos issues time-limited tickets so users don't send passwords across the network for every resource.","2.3"],
 [2,"Which malware encrypts a user's files and demands payment for the key?","Ransomware",["Spyware","Adware","A keylogger"],"Ransomware holds data hostage. Offline backups are the best defense.","2.4"],
 [2,"Which malware disguises itself as useful software but carries a hidden payload?","A Trojan",["A worm","A rootkit","A virus that needs a host file"],"A Trojan relies on the user installing it. A worm spreads by itself, and a rootkit hides deep in the system.","2.4"],
 [2,"Which malware records keystrokes to steal passwords?","A keylogger",["Ransomware","Adware","A boot sector virus"],"Keyloggers capture typing and send it to the attacker. MFA limits the damage from stolen passwords.","2.4"],
 [2,"Which type of malware hides from the operating system and is often best removed by reimaging?","A rootkit",["Adware","A cryptominer","Spyware"],"Rootkits hide at the kernel or firmware level. Because they can't be trusted to be fully removed, reimaging is often the safest fix.","2.4"],
 [2,"Which malware secretly uses a computer's CPU or GPU to earn cryptocurrency?","A cryptominer",["Ransomware","A keylogger","Spyware"],"Cryptominers cause constant high CPU use, heat and slow performance.","2.4"],
 [2,"A caller claims to be from IT and asks a user for their password to fix an account. What is this?","Vishing",["Smishing","Whaling","Tailgating"],"Vishing is voice phishing. Smishing uses text messages, and whaling targets executives.","2.5"],
 [2,"Someone reads a password off a coworker's screen from behind them. What is this called?","Shoulder surfing",["Dumpster diving","Tailgating","Impersonation"],"Privacy screens and awareness help prevent shoulder surfing.","2.5"],
 [2,"Attackers search a company's trash for printed passwords and documents. What is this?","Dumpster diving",["Phishing","Shoulder surfing","Evil twin"],"Shredding sensitive paper defeats dumpster diving.","2.5"],
 [2,"An attack uses a software flaw that the vendor doesn't know about yet. What is it called?","A zero-day attack",["A brute force attack","An on-path attack","A DoS attack"],"With a zero-day, no patch exists yet, so defenders rely on other layers such as least privilege and endpoint protection.","2.5"],
 [2,"A fake access point uses the same name as the café's real Wi-Fi to capture traffic. What is this?","An evil twin",["Whaling","Spoofed caller ID","Tailgating"],"An evil twin imitates a legitimate network. Users should use a VPN on public Wi-Fi and check the network before connecting.","2.5"],
 [2,"In the malware removal process, what comes right after investigating and verifying the symptoms?","Quarantine the infected system",["Disable System Restore","Remediate the system","Educate the end user"],"The order is: investigate and verify, quarantine, disable System Restore, remediate, schedule scans and updates, enable System Restore and create a restore point, then educate the user.","2.6"],
 [2,"Why should you turn off System Restore while removing malware?","Restore points may hold copies of the malware",["It speeds up the antivirus scan","Windows requires it for updates","It frees memory for the scan"],"Restore points could reinfect the PC later. After cleanup, turn System Restore back on and create a clean restore point.","2.6"],
 [2,"What's the final step of the malware removal process?","Educate the end user",["Quarantine the system","Update the antivirus definitions","Reimage the system"],"Teaching the user how the infection happened helps stop it happening again.","2.6"],
 [2,"Why do you quarantine an infected PC before cleaning it?","To keep the malware from spreading to other systems",["To speed up Windows","To back up the infection","To make the user's files read-only"],"Disconnect it from the network so the malware can't spread or receive commands while you work.","2.6"],
 [2,"Which setting locks a PC automatically when the user walks away?","A screen saver or lock screen timeout that requires a password",["A higher screen resolution","A longer DHCP lease","Turning off the firewall"],"An automatic lock stops passers-by using an unattended, signed-in session. Users should also press Windows+L when they leave.","2.7"],
 [2,"Why disable AutoRun and AutoPlay for removable media?","So malware on a USB drive can't launch automatically",["To save battery","To speed up file copies","To allow more USB devices"],"Disabling automatic launching stops infected media from running code the moment it is plugged in.","2.7"],
 [2,"What's a good practice for the built-in Administrator account?","Disable it or rename it, and set a strong password",["Use it for daily work","Share it among technicians","Remove its password"],"Attackers target well-known default accounts. Give each technician a named account instead.","2.7"],
 [2,"Which setting removes a phone's data after too many failed passcode attempts?","A wipe after a set number of failed unlock attempts",["Airplane mode","Location services","Bluetooth discovery"],"This protects data on a lost or stolen phone from someone guessing the passcode.","2.8"],
 [2,"A company phone is lost. Which action protects the data on it?","Remote wipe through MDM",["Turn on Wi-Fi calling","Change the ringtone","Back up the SIM"],"MDM can lock, locate or wipe a lost device remotely.","2.8"],
 [2,"Why should users install phone apps only from official app stores?","Store apps are vetted, which lowers the risk of malware",["They are always free","They never need updates","They don't use data"],"Sideloading apps from unknown sources skips review and is a common way malware gets onto phones.","2.8"],
 [2,"Which method destroys a hard drive's data while leaving the drive reusable?","An overwrite or secure erase",["Degaussing","Shredding","Incineration"],"Overwriting or secure erase sanitizes the drive so it can be reused. Degaussing and physical destruction ruin the drive.","2.9"],
 [2,"What does degaussing do to a hard drive?","It erases the data with a strong magnetic field and usually ruins the drive",["It encrypts the drive","It defragments the drive","It only deletes the partition table"],"Degaussing scrambles the magnetic platters. It doesn't work on SSDs, which store data electronically.","2.9"],
 [2,"A third party destroys a company's old drives. What should the company get from it?","A certificate of destruction",["A license key","A warranty extension","A restore point"],"The certificate documents which drives were destroyed and how, as proof for audits and compliance.","2.9"],
 [2,"Why doesn't a quick format securely erase a drive?","It only clears the file system, so the data can still be recovered",["It encrypts the data","It destroys the platters","It only works on SSDs"],"A quick format removes the file index, not the data. Use an overwrite, secure erase or destruction instead.","2.9"],
 [2,"Which SOHO router feature should be turned off because its PIN can be brute forced?","WPS",["WPA3","DHCP","NAT"],"Wi-Fi Protected Setup's PIN mode has a known weakness that lets attackers recover the network key.","2.10"],
 [2,"Visitors need internet access without reaching the office's printers and file shares. What should you set up?","A separate guest network",["Port forwarding","A DHCP reservation","A shorter SSID"],"A guest network isolates visitors from internal devices.","2.10"],
 [2,"Why update a SOHO router's firmware?","To fix security vulnerabilities and bugs",["To make the SSID longer","To reset the Wi-Fi password","To add more physical ports"],"Router firmware has vulnerabilities like any software. Check for updates regularly or turn on automatic updates.","2.10"],
 [2,"Which browser feature opens a window that doesn't keep history or cookies after it's closed?","Private browsing mode",["Pop-up blocker","Password manager","Extensions"],"Private (incognito) mode doesn't save local history or cookies, but the network and websites can still see your activity.","2.11"],
 [2,"How should you add browser extensions on company PCs?","Only from trusted sources, approved by IT",["From any site offering them","Through email attachments","Always as many as possible"],"Malicious extensions can read every page you visit. Install only what's needed, from official stores.","2.11"],
 [2,"A browser warns that a site's certificate is invalid. What should a user do?","Not enter any information, and report it if it's a company site",["Ignore the warning and continue","Clear the cache and continue","Turn off the browser's security"],"An invalid certificate can mean an on-path attack or a fake site. Never enter passwords on it.","2.11"],
 [3,"Windows shows a blue screen with a stop code right after a new driver was installed. What should you try first?","Boot into Safe Mode and roll back or remove the driver",["Replace the motherboard","Reinstall all applications","Format the drive"],"Safe Mode loads only basic drivers, so you can undo the change that caused the crash.","3.1"],
 [3,"Windows is very slow, and Task Manager shows the disk at 100% all the time. What should you investigate?","Which process is using the disk, and the drive's health",["The monitor's refresh rate","The printer queue","The Wi-Fi channel"],"Constant disk use comes from heavy processes, updates or malware, or a failing hard drive. Resource Monitor shows which process is responsible.","3.1"],
 [3,"After an update, a PC won't boot normally. What can return the system files to a working state without touching personal files?","System Restore",["A clean install","Disk Cleanup","Reset this PC with Remove everything"],"System Restore rolls system files, drivers and the registry back to a restore point while leaving documents alone.","3.1"],
 [3,"A profile loads slowly, and the user gets a temporary profile at sign-in. What's the likely cause?","A corrupted user profile",["A failed monitor","A bad Ethernet cable","An expired SSL certificate"],"Windows loads a temporary profile when the real one can't load. Back up the data, then rebuild the profile.","3.1"],
 [3,"An application keeps crashing after a Windows update. What's a reasonable first step?","Repair or reinstall the application, and check for an update to it",["Replace the hard drive","Remove the antivirus permanently","Disable Windows Update forever"],"Apps sometimes break after OS changes. Repair, update or reinstall the app, and check Event Viewer for details.","3.1"],
 [3,"Windows boots to a black screen with a cursor after sign-in. Which tool can you use to restart the Explorer shell?","Task Manager",["Disk Management","Device Manager","System Information"],"Press Ctrl+Shift+Esc to open Task Manager, then restart Windows Explorer or run explorer.exe as a new task.","3.1"],
 [3,"A phone app keeps closing right after it opens. What should you try first?","Force stop the app, clear its cache, and update it",["Factory reset the phone","Replace the battery","Turn off cellular data"],"Start with the least disruptive fixes. A factory reset is the last resort.","3.2"],
 [3,"A phone's screen doesn't rotate when turned sideways. What should you check first?","Whether rotation lock is turned on",["The SIM card","The battery health","The Wi-Fi password"],"Rotation lock in the quick settings panel keeps the screen in one orientation.","3.2"],
 [3,"A phone runs slowly and storage is almost full. What will help?","Free up storage by deleting unused apps and media or moving them to the cloud",["Lower the screen brightness","Turn on airplane mode","Change the ringtone"],"A nearly full drive slows the OS and stops updates from installing.","3.2"],
 [3,"A phone won't install an OS update and says the download failed. What should you check?","Free storage space, battery level and network connection",["The screen protector","The phone case","The ringtone volume"],"Updates need storage space, enough charge (or a charger plugged in) and a stable connection.","3.2"],
 [3,"A phone's apps can't send notifications since a recent change. Where should you look?","The phone's notification and battery-saving settings for those apps",["The SIM card tray","The camera settings","The display resolution"],"Battery savers and notification permissions can block apps from running or alerting in the background.","3.2"],
 [3,"Bluetooth won't connect to a car that worked yesterday. What should you try first?","Remove the pairing on both devices and pair again",["Factory reset the phone","Replace the car's stereo","Turn off Wi-Fi permanently"],"Removing the old pairing clears bad keys between the devices. Toggling Bluetooth off and on also helps.","3.3"],
 [3,"A phone's data usage has spiked and it runs hot even when idle. What could this point to?","Malware running in the background",["A cracked screen protector","A weak Wi-Fi password","A full voicemail box"],"Unexpected data use, heat and battery drain are common signs of malicious apps. Check the usage per app and remove suspicious ones.","3.3"],
 [3,"A phone shows pop-ups even on the home screen. What's the most likely cause?","An adware app",["A damaged digitizer","A full SIM card","A faulty charger"],"System-wide ads usually come from a recently installed app. Uninstall it, starting with apps installed around when the pop-ups started.","3.3"],
 [3,"A user's phone has apps they never installed and settings that changed by themselves. What should you suspect?","The phone is compromised, and may have been sideloaded or rooted",["A weak battery","Too many photos","An outdated case"],"Unknown apps and changes point to compromise. Back up only data, then factory reset and update the phone.","3.3"],
 [3,"A phone's location and microphone are being used by an app that shouldn't need them. What should you do?","Revoke those permissions and remove the app if it isn't needed",["Turn off the phone's screen lock","Grant it more permissions","Ignore it"],"Unnecessary permissions are a privacy risk and a sign of a malicious app. Review permissions regularly.","3.3"],
 [3,"A browser keeps redirecting searches to an unknown search engine. What's most likely?","A browser hijacker, often a malicious extension",["A failed network card","A full hard drive","An expired license key"],"Remove unknown extensions and reset the browser settings, then scan for malware.","3.4"],
 [3,"Antivirus definitions won't update, and security websites won't load, but other sites do. What does this suggest?","Malware is blocking security tools, possibly by changing the hosts file or DNS settings",["The monitor driver is outdated","The printer is offline","The CPU is overheating"],"Malware often blocks security updates. Check the hosts file and DNS settings, then clean the PC from a trusted boot environment.","3.4"],
 [3,"A user's files have new extensions and won't open, and a note asks for payment. What should you do first?","Disconnect the PC from the network",["Pay the ransom","Restart the PC repeatedly","Email the note to coworkers"],"Isolating the PC stops ransomware spreading to shares and other PCs. Then follow the incident response plan and restore from backup.","3.4"],
 [3,"A user's sent folder has emails they never wrote, sent to all their contacts. What's the likely cause?","The email account was compromised",["The mailbox is full","The spam filter is too strict","The PC's clock is wrong"],"Reset the password, turn on MFA, check for forwarding rules the attacker added, and scan the PC.","3.4"],
 [3,"Windows Security shows real-time protection turned off, and it keeps turning off again. What does this suggest?","Possible malware tampering with security settings",["A normal Windows update","A failing monitor","A low battery"],"Malware often disables security tools. Investigate and scan with offline or boot-time tools.","3.4"],
 [3,"A PC shows fake security warnings telling the user to call a phone number. What is this?","A tech support scam or rogue antivirus",["A real Microsoft alert","A driver update","A printer error"],"Legitimate security tools never ask you to call a number from a pop-up. Close the browser and scan the system.","3.4"],
 [4,"Where should a technician record the steps taken to fix a user's problem?","In the ticket in the ticketing system",["In a personal notebook","In an email to themselves","Nowhere, since it's fixed"],"Tickets record the problem, the steps taken and the result, which builds history and a knowledge base.","4.1"],
 [4,"Which document tracks every device, its owner and its location?","An asset inventory",["An acceptable use policy","An incident report","A network diagram"],"Inventory records support tracking, audits, warranties and lifecycle planning.","4.1"],
 [4,"What's a knowledge base article used for?","Documenting known issues and their fixes so others can resolve them quickly",["Storing passwords","Recording employee salaries","Replacing the ticket system"],"Knowledge base articles turn one technician's fix into a repeatable procedure.","4.1"],
 [4,"Before making a change to a production system, what does change management require?","An approved change request with a rollback plan",["Only the technician's judgment","An email to the user afterward","Nothing if the change is small"],"Change requests record the purpose, scope, risk, test results, timing and backout plan, and are approved before work starts.","4.2"],
 [4,"What is a rollback plan?","Steps to undo a change if it fails",["A list of people to notify","A schedule of backups","The test results"],"If a change causes problems, the rollback plan returns the system to its previous state quickly.","4.2"],
 [4,"Who usually reviews and approves significant changes?","A change advisory board",["The newest technician","Each affected end user","The vendor's sales team"],"The CAB weighs the risk and business impact before approving a change and its timing.","4.2"],
 [4,"Which backup type copies only files changed since the last backup of any kind?","Incremental",["Full","Differential","Synthetic full"],"Incremental backups are fast, but a restore needs the full backup plus every incremental since. Differential backups copy everything since the last full backup.","4.3"],
 [4,"What does the 3-2-1 backup rule mean?","Three copies of the data, on two types of media, with one off-site",["Three backups a day, two a week, one a month","Three servers, two sites, one cloud","Back up three times before restoring once"],"3-2-1 protects against hardware failure, site disasters and ransomware.","4.3"],
 [4,"Why test backups regularly?","To make sure the data can actually be restored",["To speed up the backup jobs","To reduce storage costs","Because backups expire"],"A backup you can't restore is worthless. Regular test restores prove the process works.","4.3"],
 [4,"What should you wear when replacing RAM to avoid damaging it?","An antistatic wrist strap connected to ground",["Rubber gloves","Safety glasses only","Nothing, if the PC is off"],"ESD can damage parts without visible signs. Ground yourself with a wrist strap and work on an antistatic mat.","4.4"],
 [4,"What's the safe way to lift a heavy server?","Lift with your legs, keep your back straight, and get help when needed",["Bend at the waist and lift quickly","Lift with your arms only","Twist while lifting"],"Proper lifting technique prevents back injuries. Use a team lift or a cart for heavy equipment.","4.4"],
 [4,"Which fire extinguisher class is for electrical fires?","Class C",["Class A","Class B","Class D"],"Class C (in the US) covers energized electrical equipment. A is ordinary combustibles, B is flammable liquids, and D is metals.","4.4"],
 [4,"Where do you find how to safely handle and dispose of a toner cartridge?","Its SDS",["The printer driver","The warranty card","The router manual"],"Safety data sheets describe hazards, handling, spills and disposal for chemical products.","4.5"],
 [4,"How should old lithium-ion batteries be disposed of?","Recycled according to local regulations",["Thrown in the regular trash","Burned","Buried"],"Batteries contain hazardous materials and can start fires. Use approved recycling programs.","4.5"],
 [4,"Which device protects equipment from power sags and short outages?","A UPS",["A surge protector only","A power strip","A KVM switch"],"An uninterruptible power supply uses its battery to ride through sags and outages. A surge protector only clips spikes.","4.5"],
 [4,"A technician finds illegal content on a PC during a repair. What should they do?","Stop, preserve the evidence, and report it through the proper channels",["Delete it","Copy it to show coworkers","Ignore it and finish the repair"],"Follow company policy and keep a chain of custody. Changing anything can ruin the evidence.","4.6"],
 [4,"Which document records everyone who handled evidence, and when?","A chain of custody",["An end user license agreement","A change request","An acceptable use policy"],"A chain of custody proves the evidence wasn't tampered with, so it can be used in legal action.","4.6"],
 [4,"Which software license lets users view, change and share the source code?","Open source",["Proprietary commercial","Personal use only","OEM"],"Open-source licenses grant access to the source code. Commercial licenses usually forbid copying and changing the software.","4.6"],
 [4,"Which data must be protected because it identifies a person, such as a Social Security number?","PII",["PCI","DRM","EULA"],"Personally identifiable information can identify an individual and is protected by privacy laws.","4.6"],
 [4,"A customer is upset about a repeated problem. What should a technician do first?","Listen without interrupting and acknowledge the frustration",["Argue about who caused it","Talk about their own day","Promise a fix before diagnosing"],"Active listening and empathy calm the situation and help you understand the problem.","4.7"],
 [4,"A technician must take a personal call while at a customer's desk. What's appropriate?","Avoid personal calls while working with the customer",["Answer and talk on speaker","Text while the customer explains","Step away without saying anything"],"Professionalism means giving the customer your full attention and avoiding distractions.","4.7"],
 [4,"How should a technician explain a fix to a non-technical user?","In plain language, without jargon",["Using as many acronyms as possible","By sending a link to the RFC","Not at all"],"Clear, simple explanations build trust and help users avoid the problem next time.","4.7"],
 [4,"Which scripting file extension runs PowerShell scripts?",".ps1",[".bat",".sh",".py"],".ps1 is PowerShell. .bat is a Windows batch file, .sh is a Linux shell script and .py is Python.","4.8"],
 [4,"What's a common use of scripts for technicians?","Automating repetitive tasks such as mapping drives or installing updates",["Replacing hardware","Designing websites by hand","Writing user manuals"],"Scripts save time and keep tasks consistent, such as restarting services or collecting inventory.","4.8"],
 [4,"What's a risk of running scripts from the internet without reviewing them?","They might change system settings or install malware",["They always run slowly","They delete the recycle bin","They can't run on Windows"],"Review scripts before running them, and test them first, because a script can do anything your account can.","4.8"],
 [4,"Which remote access tool gives a full graphical desktop of a Windows PC?","RDP",["SSH","Telnet","SFTP"],"Remote Desktop Protocol shows the remote desktop. SSH gives an encrypted command line.","4.9"],
 [4,"A help desk technician needs to see a user's screen while the user watches, without a VPN. Which tool fits?","A screen-sharing remote support tool",["Telnet","FTP","A DHCP reservation"],"Remote support tools let the user approve the session and watch while the technician works.","4.9"],
 [4,"What's the main security concern with leaving remote access tools open to the internet?","Attackers can brute force or exploit them to take control",["They use too much disk space","They slow down printing","They change the screen resolution"],"Limit remote access with a VPN, MFA and patching, and restrict who can connect.","4.9"],
 [4,"An AI chatbot gives a confident answer that turns out to be made up. What is this called?","A hallucination",["Data bias","Overfitting","Encryption"],"AI models can produce plausible but false information, so check important answers against reliable sources.","4.10"],
 [4,"Why should employees avoid pasting confidential company data into a public AI chatbot?","The data may be stored or used outside the company's control",["It makes the chatbot slower","The chatbot will refuse to answer","It deletes the original file"],"Use only approved AI tools with suitable data protections, and follow the company's AI policy.","4.10"],
 [3,"A PC restarts by itself at 3 AM every night, and the user loses unsaved work. What's the most likely cause?","Windows Update installing updates and restarting automatically",["A failing monitor","A DNS outage","A full print queue"],"Check the update history and active hours. Scheduling restarts outside working hours, or reminding users to save, prevents lost work. Hardware faults rarely restart on a fixed schedule.","3.1"],
 [3,"A PC shows a message that no operating system was found after a power cut. Which recovery option should you try first?","Startup Repair from the Windows Recovery Environment",["Disk Cleanup","Device Manager","Task Scheduler"],"Startup Repair fixes damaged boot files and boot configuration. The other tools only run once Windows has started.","3.1"],
 [3,"A new USB device shows a yellow warning icon in Device Manager. What's the usual fix?","Update or reinstall the device's driver",["Replace the motherboard","Turn off the firewall","Run Disk Defragmenter"],"The warning icon means the driver is missing or failed to load. Install the right driver from the manufacturer or Windows Update.","3.1"],
 [3,"Sign-ins on a domain PC fail with time-related Kerberos errors, and its clock is 20 minutes off. What should you do?","Sync the PC's clock with the domain's time source",["Reinstall Office","Replace the RAM","Change the screen resolution"],"Kerberos tickets only work when clocks are within a few minutes of each other. Fix the time sync, and sign-ins work again.","3.1"],
 [3,"Windows warns that memory is low, and apps slow down whenever the user has many browser tabs open. What should you check first?","Memory use in Task Manager, then close programs or add RAM",["The printer queue","The DHCP lease","The monitor's refresh rate"],"Task Manager shows what is using the RAM. If normal use keeps the RAM full, add memory. A tiny page file can make the problem worse.","3.1"],
 [3,"An app won't update, and the app store says it isn't compatible with the phone. What's the most likely reason?","The phone's OS version is too old for the new app version",["The phone's case is too thick","The screen brightness is too low","The phone is on Wi-Fi"],"Apps eventually drop support for older OS versions. Update the OS if the phone can take it, or replace the device.","3.2"],
 [3,"A phone's apps can't reach the internet on one Wi-Fi network but work fine on cellular. What should you try first?","Forget and rejoin the network, and check for a sign-in page",["Factory reset the phone","Replace the battery","Turn off location services"],"Rejoining clears bad saved settings. Many guest networks show a captive portal sign-in page that must be accepted before traffic flows.","3.2"],
 [3,"A phone freezes and won't respond to touch or the power button. What should you do?","Force a restart with the hardware button combination",["Remove the SIM card","Open the back cover","Wait for the battery to run flat over several days"],"Every phone has a button combination that forces a restart even when the OS is frozen.","3.2"],
 [3,"A phone keeps rebooting at random. What should you check first?","Pending OS updates, recently installed apps, and battery health",["The ringtone","The wallpaper","The screen protector"],"Random reboots often come from a bad app, outdated OS, or failing battery. Safe mode can rule out third-party apps.","3.2"],
 [3,"A user's phone finds a Wi-Fi network whose name is almost the same as the company's, and it shows a certificate warning. What should the user do?","Not connect, and report a possible fake access point",["Accept the certificate and connect","Turn off the phone's screen lock","Share the network with coworkers"],"A lookalike name plus a certificate warning suggests an evil twin trying to capture credentials.","3.3"],
 [3,"A phone's bill shows texts to premium-rate numbers the user never sent. What's the likely cause?","A malicious app sending texts in the background",["A cracked screen","A weak Wi-Fi signal","Low storage"],"Some malware earns money by texting premium numbers. Remove recently installed apps, scan the phone, and contact the carrier.","3.3"],
 [3,"A new phone app asks for device administrator rights to improve performance. What should the user do?","Deny it. Malware often requests admin rights so it can't be removed",["Grant it, since performance apps need it","Grant it and restart","Turn off the screen lock first"],"Device admin rights let an app block its own removal and control security settings. Few legitimate apps need them.","3.3"],
 [3,"MDM blocks a rooted phone from company email. Why?","Rooting removes OS security protections, so the device can't be trusted with company data",["Rooted phones have smaller screens","Rooting deletes the email app","MDM can't read rooted phones' battery levels"],"Rooting or jailbreaking bypasses sandboxing and app checks, which makes malware far easier to install.","3.3"],
 [3,"Every HTTPS site shows a certificate warning, but on only one PC. What should you check first?","The PC's date and time, then whether malware installed a rogue root certificate",["The office's internet connection","The printer driver","The monitor cable"],"A wrong clock makes valid certificates look expired. If the clock is right, malware or an intercepting proxy may have added its own root certificate.","3.4"],
 [3,"Antivirus finds malware but can't remove it because the file is in use. What should you try?","Scan again in Safe Mode or with an offline, boot-time scan",["Ignore it","Turn off the antivirus","Delete the user's documents"],"Safe Mode and boot-time scans run before the malware loads, so its files are no longer locked.","3.4"],
 [3,"An unknown account has appeared in the PC's local Administrators group. What should you assume?","The PC may be compromised and needs investigating",["Windows created it during an update","It's a normal guest account","The printer driver added it"],"Attackers add admin accounts so they can get back in. Remove it, investigate how it got there, and change the credentials.","3.4"],
 [3,"A PC sends large amounts of traffic to unknown internet addresses every night. What does this suggest?","A botnet or data exfiltration infection",["A normal backup to the company server","A failing hard drive","A low battery"],"Unexplained outbound traffic is a strong sign of compromise. Isolate the PC and investigate before cleaning it.","3.4"],
 [4,"Which document shows how an office's switches, routers and firewalls connect to each other?","A network topology diagram",["An acceptable use policy","An asset tag","A purchase order"],"Diagrams help technicians see the network's layout quickly. Keep them up to date after every change.","4.1"],
 [4,"Which document gives step-by-step instructions for a routine task, such as setting up a new employee's PC?","A standard operating procedure",["A service level agreement","An incident report","A purchase order"],"SOPs make routine work consistent, whoever does it. An SLA sets service targets and response times.","4.1"],
 [4,"Which ticket should a help desk handle first?","A server outage that stops the whole office working",["One user's mouse acting slow","A request for a new wallpaper","A question about printer settings"],"Tickets are prioritized by impact and urgency. An outage affecting everyone comes before minor single-user issues.","4.1"],
 [4,"What does a help desk's SLA define?","The required response and resolution times",["The office's network layout","Each employee's password","The software license count"],"Service level agreements set measurable commitments, such as answering critical tickets within 15 minutes.","4.1"],
 [4,"Which part of a change request rates how likely the change is to cause problems, and how bad they would be?","The risk analysis",["The rollback plan","The purchase order","The asset inventory"],"The risk analysis helps the change board decide whether and when to approve the change. The rollback plan says how to undo it.","4.2"],
 [4,"Why are many changes scheduled late on a weekend night?","A maintenance window keeps the impact on users as small as possible",["Changes only work at night","The CAB only meets at night","Backups don't run on weekends"],"Scheduling changes when few people are working limits disruption if something goes wrong.","4.2"],
 [4,"Before rolling out a new driver to every PC, where should it be tried first?","In a test environment",["On the CEO's laptop","On every PC at once","Nowhere, if the vendor released it"],"Testing in a sandbox or on a small pilot group catches problems before they affect everyone.","4.2"],
 [4,"After a change is complete, what should happen before it's closed?","Users confirm it works, and the change is documented",["The rollback plan is deleted","The change is rolled back","Nothing more"],"End-user acceptance confirms the change did what it should, and documentation keeps records accurate.","4.2"],
 [4,"What do you need to restore from a differential backup?","The last full backup and the latest differential backup",["Every differential since the full backup","Only the latest differential","Every incremental backup ever made"],"Each differential holds all changes since the last full backup, so a restore takes just two sets. Incremental backups need every set since the full.","4.3"],
 [4,"What is a synthetic full backup?","A full backup built from an earlier full backup plus later incrementals, without rereading the source",["A backup stored only in RAM","A copy of the backup software","A backup of only the registry"],"Synthetic fulls give the fast restore of a full backup without the load of copying everything from the source again.","4.3"],
 [4,"Which backup rotation keeps daily, weekly and monthly sets?","Grandfather-father-son",["First in, first out only","Round robin DNS","Mirroring"],"Grandfather-father-son keeps short-term daily sets, plus weekly and monthly sets for longer retention.","4.3"],
 [4,"Which backup copy best protects against ransomware that encrypts everything it can reach?","An offline or immutable copy",["A copy on a mapped network drive","A second folder on the same disk","A USB drive left plugged in"],"Ransomware encrypts every drive and share it can reach. Offline or immutable backups can't be changed.","4.3"],
 [4,"Why shouldn't a technician open a power supply to repair it?","Its capacitors can hold a dangerous charge even when unplugged",["It voids the monitor's warranty","It has no serviceable fuse","It's always glued shut"],"Power supplies are replaced, not repaired, unless you are specially trained.","4.4"],
 [4,"How should you clean up spilled toner?","With a vacuum rated for toner",["With a regular household vacuum","By blowing it away with compressed air","With a damp paper towel and hot water"],"Toner is so fine it passes through normal vacuum filters and can even ignite inside the motor. Heat makes it stick.","4.4"],
 [4,"What does the third prong on a power plug do?","Carries fault current safely to ground",["Makes the device run faster","Carries network data","Holds the plug in the socket"],"Grounding protects people from shock if a live wire touches the metal case. Never remove the ground prong.","4.4"],
 [4,"Cables cross a busy walkway to reach a projector. What should you do?","Reroute them or cover them with a cable protector",["Tape them loosely","Leave them, since it's temporary","Hang them across the doorway"],"Loose cables in walkways are a trip hazard. Proper cable management prevents injuries and damaged equipment.","4.4"],
 [4,"A server room's humidity is very low. What's the main risk?","Static electricity that can damage components",["Condensation on the circuit boards","Faster hard drives","Weaker Wi-Fi"],"Dry air makes ESD more likely. Very high humidity causes condensation and corrosion instead.","4.5"],
 [4,"How does a surge suppressor differ from a UPS?","A surge suppressor clamps voltage spikes but gives no power during an outage",["A surge suppressor has a bigger battery","They do exactly the same thing","A UPS only filters noise"],"A UPS keeps equipment running on battery through outages. A surge suppressor only protects against spikes.","4.5"],
 [4,"PCs in a dusty workshop keep overheating. What helps most?","Dust filters or protective enclosures, plus regular cleaning",["Higher screen brightness","More RAM","A faster internet connection"],"Dust blocks airflow and traps heat. Filters keep it out, and compressed air clears what builds up.","4.5"],
 [4,"How should old monitors and PCs be disposed of?","Through certified e-waste recycling",["In the regular trash","By burning them","By leaving them on the curb"],"Electronics contain lead, mercury and other hazards, and many regions require proper recycling. Wipe or destroy the drives first.","4.5"],
 [4,"A company bought one software license but installed the program on 10 PCs. What is this?","A license violation",["A normal OEM install","An open-source deployment","A site license"],"Most licenses are per seat or per device. Unlicensed copies can bring fines and failed audits.","4.6"],
 [4,"Which agreement sets the usage terms a user accepts when installing software?","EULA",["SLA","AUP","NDA"],"The end user license agreement sets the vendor's rules for using the software. An SLA covers service levels, and an AUP covers acceptable use of company systems.","4.6"],
 [4,"What's the difference between a subscription license and a perpetual license?","A perpetual license is paid once and used indefinitely, while a subscription is paid for each period",["A subscription never expires","A perpetual license must be renewed every month","They're the same"],"Subscriptions usually include updates while you keep paying. Perpetual licenses may need separate payments for upgrades.","4.6"],
 [4,"Which type of regulated data covers a patient's medical records?","PHI",["PCI","PII only","DRM"],"Protected health information is health data tied to a person, and laws such as HIPAA protect it.","4.6"],
 [4,"While repairing a PC, a technician sees confidential documents on the customer's desk. What should they do?","Leave them alone and not read them",["Read them to understand the problem","Photograph them","Move them into a drawer and keep the key"],"Respecting customers' privacy and property is part of professionalism. Never read, copy or move confidential material.","4.7"],
 [4,"A technician is running late for a customer visit. What should they do?","Contact the customer as soon as they know",["Arrive late without explaining","Skip the visit","Ask a coworker to cover without telling anyone"],"Being on time, and calling ahead when you can't be, respects the customer's time and keeps their trust.","4.7"],
 [4,"A customer asks for work outside the ticket's scope. What's the best response?","Explain what's in scope and offer options, such as a new request or escalation",["Do it without telling anyone","Refuse rudely","Promise it will be free"],"Setting clear expectations avoids surprises about time and cost, and keeps the work documented.","4.7"],
 [4,"After completing a repair, what helps confirm the customer is satisfied?","Following up to check the fix worked",["Closing the ticket without contact","Charging for a second visit","Deleting the ticket"],"A follow-up confirms the problem is solved and shows the customer that you care about the result.","4.7"],
 [4,"Which file extension is a Windows batch script?",".bat",[".ps1",".sh",".js"],".bat files run commands in the Windows command prompt. .ps1 is PowerShell, .sh is a Linux shell script and .js is JavaScript.","4.8"],
 [4,"In a script, what is a variable?","A named value the script can store and change",["A command that restarts the PC","A comment the script ignores","A type of cable"],"Variables hold data, such as a file path or a counter, so the script can use and update it.","4.8"],
 [4,"Which scripting structure repeats actions for each item in a list?","A loop",["A comment","A variable","A shebang line"],"Loops, such as for and while, repeat steps, for example creating an account for each name in a file.","4.8"],
 [4,"A script runs forever and fills the disk with log files. What scripting risk is this?","Unintended resource use from a bug such as an infinite loop",["A licensing violation","A social engineering attack","Normal script behavior"],"Test scripts carefully. A loop that never ends can use up CPU, memory or disk space and bring down the system.","4.8"],
 [4,"Which remote access method creates an encrypted tunnel from home into the office network?","VPN",["RDP","FTP","Telnet"],"A virtual private network connects the remote user to the internal network securely. RDP then gives access to a specific desktop.","4.9"],
 [4,"Which kind of tool lets an MSP monitor, patch and run scripts on hundreds of client PCs from one console?","RMM",["VNC","SSH","SFTP"],"Remote monitoring and management platforms automate support at scale. Their high access level also makes them targets, so protect them with MFA.","4.9"],
 [4,"Which built-in Windows feature lets a user invite a helper to view or control their screen?","Quick Assist",["Disk Management","Event Viewer","Task Scheduler"],"Quick Assist uses a short code the user shares with the helper, who can then view or take control with the user's permission.","4.9"],
 [4,"An AI tool's answers unfairly favor one group because of patterns in its training data. What is this?","Bias",["Encryption","Latency","Redundancy"],"AI learns from data, including the unfairness in it. Review AI output, especially for decisions about people.","4.10"],
 [4,"Which is the safest rule for using AI at work?","Use only approved AI tools, and keep sensitive data out of them",["Use any free chatbot for customer data","Trust every AI answer without checking","Share passwords with AI tools to speed up support"],"An acceptable use policy for AI protects company data and keeps people checking the results.","4.10"],
 [4,"How does a company's private AI tool usually differ from a free public chatbot?","Prompts stay under the company's control and aren't used to train the public model",["It never makes mistakes","It works without electricity","It can't answer questions"],"Enterprise AI agreements limit how prompts and data are stored and used. Public tools may keep and learn from what you type.","4.10"],
 [4,"An AI tool writes a PowerShell script to clean up user accounts. What should a technician do before running it?","Read it, understand it, and test it in a safe environment",["Run it on every PC right away","Run it as administrator without reading it","Email it to users to run"],"The person running AI-generated code is responsible for what it does. AI can write scripts that look right but cause damage.","4.10"],
 [1,"Which file system do current Macs use by default on their internal drives?","APFS",["NTFS","ext4","FAT32"],"The Apple File System is built for SSDs, with snapshots and built-in encryption. NTFS is Windows, ext4 is Linux, and FAT32 is an old cross-platform format.","1.1"],
 [1,"Which file system do many Linux distributions use by default?","ext4",["NTFS","APFS","exFAT"],"ext4 is the common default Linux file system, with journaling and support for large volumes. Newer options such as XFS and Btrfs are also used.","1.1"],
 [1,"How does installing apps on Android differ from iOS?","Android can more easily install apps from outside its official store",["iOS can't install apps at all","Android apps never need permissions","iOS apps run only in a browser"],"Sideloading is easier on Android, which gives users more freedom but also more malware risk. iOS limits most installs to the App Store.","1.1"],
 [1,"Which installation type uses an answer file so nobody has to click through Windows Setup?","An unattended installation",["A repair installation","A clean install from a USB drive by hand","A factory reset"],"An answer file supplies settings such as language, partitions and product key, so many PCs install the same way automatically.","1.2"],
 [1,"A user wants Windows and Linux on one PC and to choose between them at startup. What is this?","A multiboot (dual boot) setup",["An in-place upgrade","A virtual machine snapshot","A recovery partition"],"Multiboot installs each OS on its own partition and shows a boot menu. A VM runs a second OS inside the first one instead.","1.2"],
 [1,"Before upgrading a PC to Windows 11, what should you confirm?","That the hardware is compatible, including TPM 2.0 and Secure Boot, and that key apps support it",["That the monitor is 4K","That the PC has an optical drive","That the PC uses MBR"],"Windows 11 has stricter hardware requirements than Windows 10. Checking hardware and app compatibility first avoids a failed or unsupported upgrade.","1.2"],
 [1,"Which Windows edition is sold through volume licensing and adds features for large organizations?","Enterprise",["Home","Home in S mode","Pro for Workstations"],"Enterprise adds advanced security and deployment features such as AppLocker and Credential Guard, and is licensed for organizations.","1.3"],
 [1,"A user on Windows 11 Home can't open the Local Group Policy Editor. Why?","Home doesn't include it, so the PC would need Pro or higher",["The editor needs a domain controller","Group Policy only runs on servers","The user needs to reinstall Home"],"gpedit.msc is part of Pro, Enterprise and Education. Home users change settings through Settings or the registry instead.","1.3"],
 [1,"How can a PC move from Windows 11 Home to Pro without a reinstall?","Enter a Pro product key or buy the upgrade in the Activation settings",["Run sfc /scannow","Reformat the drive","Change the PC's name"],"An edition upgrade unlocks Pro features in place, keeping the user's files and apps.","1.3"],
 [1,"Which tool can run a backup script every Friday at 6 PM?","Task Scheduler",["Event Viewer","Device Manager","Disk Management"],"Task Scheduler runs programs and scripts on a schedule or when an event happens, such as at sign-in.","1.4"],
 [1,"Where do you make a Windows service restart automatically if it crashes?","The Recovery tab in the service's properties in Services",["Disk Management","The Startup apps list","System Information"],"The Recovery tab sets what happens on the first, second and later failures, such as restarting the service or running a program.","1.4"],
 [1,"Which command lists the running processes on a Windows PC?","tasklist",["taskkill","netstat","hostname"],"tasklist shows each process and its PID. taskkill ends a process, and netstat shows network connections.","1.5"],
 [1,"Which command ends a frozen process from the command line?","taskkill",["tasklist","shutdown","gpresult"],"taskkill ends a process by name or PID, and /f forces it to close.","1.5"],
 [1,"Where do you set the hours when Windows Update won't restart the PC?","Active hours in Windows Update settings",["Power Options","Device Manager","Disk Cleanup"],"Active hours tell Windows when the PC is usually in use, so it waits to restart until outside those hours.","1.6"],
 [1,"A user with low vision wants parts of the screen magnified. Where do you turn this on?","Settings > Accessibility",["Settings > Apps","Device Manager","Control Panel > Programs"],"Accessibility settings include Magnifier, Narrator, contrast themes and text size.","1.6"],
 [1,"A user needs to type in both English and Spanish. Where do you add the second keyboard?","Settings > Time & language > Language & region",["Settings > Bluetooth & devices > Printers","Device Manager","Disk Management"],"Adding a language installs its keyboard layout, and users switch with Windows+Space.","1.6"],
 [1,"A lab PC needs a fixed IPv4 address that never changes. Where do you set it in Windows?","In the network adapter's IP settings, by changing the assignment from automatic to manual",["In Device Manager's driver tab","In the Proxy settings","In Task Scheduler"],"A static address is set in Settings > Network & internet or in the adapter's IPv4 properties, along with the mask, gateway and DNS servers.","1.7"],
 [1,"A laptop shares a phone's hotspot and keeps using up the data plan with big downloads. Which setting helps?","Mark the connection as metered",["Turn on network discovery","Change the profile to Domain","Turn off the firewall"],"On a metered connection, Windows limits background downloads such as large updates.","1.7"],
 [1,"Where do you join a Windows Pro PC to an Active Directory domain?","System properties, by changing the domain or workgroup, or Settings > Accounts > Access work or school",["Device Manager","Disk Management","Task Manager"],"Joining a domain needs Pro or higher, network access to a domain controller, and an account allowed to add computers.","1.7"],
 [1,"Which macOS feature searches files, apps and settings from one search box?","Spotlight",["Finder","Mission Control","Keychain"],"Press Command+Space to open Spotlight. Finder is the file browser, and Mission Control shows open windows and desktops.","1.8"],
 [1,"Which macOS tool checks and repairs disks, and can erase drives?","Disk Utility",["Activity Monitor","Time Machine","Spotlight"],"Disk Utility's First Aid repairs file system problems. Activity Monitor is the Mac's version of Task Manager.","1.8"],
 [1,"How are most downloaded Mac apps installed from a .dmg file?","Open the .dmg and drag the app into the Applications folder",["Run it from Terminal with sudo apt","Double-click a .msi file","Copy it to the Desktop only"],"A .dmg is a disk image. Dragging the app into Applications installs it, and you can then eject the image.","1.8"],
 [1,"Which Linux command shows a snapshot of running processes?","ps",["ls","df","pwd"],"ps lists processes, and ps aux shows every user's. top shows a live, updating view.","1.9"],
 [1,"Which Linux command prints a text file's contents to the screen?","cat",["cd","mv","chown"],"cat shows a file's contents. For long files, less lets you scroll through them.","1.9"],
 [1,"Which Linux directory holds most system configuration files?","/etc",["/home","/tmp","/bin"],"/etc holds configuration, such as /etc/passwd and network settings. /home holds users' files, and /tmp holds temporary files.","1.9"],
 [1,"A standard user can't install an app because it needs admin rights. What's the right approach?","Have IT install it or deploy it centrally",["Give the user an admin account permanently","Turn off UAC","Share the admin password with the user"],"Keeping users as standard accounts limits malware damage. IT approves and installs software instead.","1.10"],
 [1,"Before deploying a paid app to 50 users, what should you confirm?","That the company has enough licenses for every installation",["That the app has a dark mode","That every user likes it","That it was released this year"],"Installing beyond your license count is a violation that can lead to fines and failed audits.","1.10"],
 [1,"What should you consider about a new app's impact before rolling it out?","Its effect on device performance, network use and security",["Only its icon color","Only its download size","Nothing if it's free"],"New apps can slow devices, use bandwidth or add vulnerabilities. Testing with a small group first catches these problems.","1.10"],
 [1,"Which cloud storage feature keeps files online until they're opened, saving local disk space?","Files On-Demand",["Real-time co-authoring","Version history","Shared mailboxes"],"OneDrive and similar clients show every file but download it only when it's opened.","1.11"],
 [1,"A OneDrive folder now holds two copies of a file, one with the PC's name added. What happened?","A sync conflict, from edits made in two places before syncing",["The file was infected","The file was encrypted","The license expired"],"When the same file changes in two places before syncing, the client keeps both copies. Compare them and merge the changes.","1.11"],
 [1,"How should a user share a cloud file with an outside partner?","Send a link limited to specific people, with an expiration date",["Make the folder public to anyone with the link forever","Email their password to the partner","Copy the file to a USB drive and mail it"],"Limited, expiring links keep access to the people who need it. Anyone links can be forwarded.","1.11"],
 [2,"Which physical control records who opened a door and when?","A badge reader with access logs",["A plain key lock","A privacy screen","A cable lock"],"Electronic badge systems log each entry. Plain keys can be copied and leave no record.","2.1"],
 [2,"How does Active Directory apply the same security settings to hundreds of PCs at once?","Group Policy",["Device Manager","Disk Management","Task Scheduler"],"Group Policy Objects push settings such as password rules and screen locks to users and computers in the domain.","2.1"],
 [2,"Which security approach checks every access request, even from inside the network?","Zero Trust",["Security through obscurity","Implicit trust","An open network"],"Zero Trust assumes no user or device is trusted by default, so each access is verified with identity, device health and least privilege.","2.1"],
 [2,"Which NTFS permission lets a user change and delete files but not change permissions?","Modify",["Full control","Read","List folder contents"],"Modify allows reading, writing and deleting. Full control also lets the user change permissions and take ownership.","2.2"],
 [2,"A share grants Read and NTFS grants Full control. What can a user do over the network?","Read only, because the most restrictive permission applies",["Full control","Modify","Nothing"],"When share and NTFS permissions combine, the stricter one wins over the network. Locally, only NTFS applies.","2.2"],
 [2,"Which Windows feature encrypts individual files and folders on an NTFS drive?","EFS",["BitLocker","UAC","SmartScreen"],"The Encrypting File System protects files for a single user account. BitLocker encrypts the whole volume.","2.2"],
 [2,"Which encryption does WPA2 use?","AES",["TKIP","RC4","DES"],"WPA2 uses AES with CCMP. TKIP was a stopgap for the original WPA, and RC4 was used by WEP.","2.3"],
 [2,"Which wireless authentication method needs a certificate on both the client and the server?","EAP-TLS",["PSK","WEP","Open"],"EAP-TLS uses mutual certificate authentication, which makes it one of the strongest 802.1X methods.","2.3"],
 [2,"Which AAA protocol suits administrator logins to network devices because it encrypts the whole session and separates authorization?","TACACS+",["RADIUS","Kerberos","LDAP"],"TACACS+ uses TCP and encrypts the entire payload. RADIUS encrypts only the password and is common for network access.","2.3"],
 [2,"Which malware spreads across a network on its own, with no user action?","A worm",["A Trojan","Adware","A keylogger"],"Worms exploit vulnerabilities to copy themselves from host to host. Patching and segmentation slow them down.","2.4"],
 [2,"Which scan finds malware that hides while Windows is running?","An offline scan from recovery or boot media",["A quick scan in Windows","A disk cleanup","A defragmentation"],"Scanning before Windows loads stops rootkits and other hidden malware from hiding their files.","2.4"],
 [2,"A phishing email is written for a company's CFO by name. What is this?","Whaling",["Vishing","Smishing","Spam"],"Whaling targets senior executives with carefully tailored messages, often about payments or legal matters.","2.5"],
 [2,"Someone wearing a delivery uniform talks their way into the server room. What is this?","Impersonation",["Shoulder surfing","Dumpster diving","A zero-day attack"],"Impersonation uses a believable role to gain trust and access. Staff should verify visitors and escort them.","2.5"],
 [2,"In the malware removal process, what comes right after remediating the infected system?","Schedule scans and run updates",["Quarantine the system","Educate the end user","Investigate the symptoms"],"After cleaning, update the OS and security software and schedule regular scans. Then re-enable System Restore and educate the user.","2.6"],
 [2,"Once the malware is removed, what should you do with System Restore?","Turn it back on and create a new restore point",["Leave it off permanently","Delete the recovery partition","Restore the oldest restore point"],"A fresh restore point records the clean state. Old points could bring the malware back.","2.6"],
 [2,"What does setting a UEFI/BIOS password protect against?","Someone changing firmware settings, such as booting from a USB drive",["Phishing emails","Weak Wi-Fi passwords","Browser pop-ups"],"Locking the firmware stops an attacker from booting another OS to bypass Windows security.","2.7"],
 [2,"Why turn off services and features a workstation doesn't use?","It reduces the attack surface",["It voids the warranty","It speeds up the monitor","It adds more user accounts"],"Every running service is a possible way in. Fewer services mean fewer vulnerabilities to patch.","2.7"],
 [2,"Which password practice is strongest for workstation accounts?","Long passphrases that are unique to each account",["Short passwords changed daily","The same password everywhere","Passwords written on a sticky note"],"Length and uniqueness matter most. A password manager makes long, unique passwords practical.","2.7"],
 [2,"How does MDM keep work data separate on an employee's personal phone?","A work profile or container that IT manages and can wipe on its own",["By wiping the whole phone every week","By blocking all personal apps","By turning off the camera"],"Containerization lets IT protect and remove company data without touching the user's personal photos and apps.","2.8"],
 [2,"A user lost their phone and thinks it's in a taxi. What should they use first?","The device locator service to find it and lock it remotely",["A factory reset from another phone's settings","The phone's IMEI to change its ringtone","Nothing, and buy a new phone"],"Locator services can show the location, play a sound, lock the device and show a contact message. Wipe it if it can't be recovered.","2.8"],
 [2,"Which screen lock setting gives a phone the best protection?","Biometrics or a long passcode, with a short auto-lock time",["A swipe-to-unlock screen","A four-digit PIN of 1234","No lock, for convenience"],"Strong authentication plus a quick auto-lock keeps a lost or unattended phone protected.","2.8"],
 [2,"What's the best way to sanitize an SSD before reusing it?","The drive's built-in secure erase or sanitize command",["Degaussing it","A quick format","Deleting the files"],"SSDs spread writes across cells, so overwriting files misses data. The manufacturer's sanitize command, or a cryptographic erase, clears every cell.","2.9"],
 [2,"How should printed documents with customer data be disposed of?","With a cross-cut shredder or a secure shredding service",["In the regular recycling bin","By tearing them in half","By leaving them in the printer tray"],"Cross-cut shredding makes documents practically impossible to rebuild, which defeats dumpster diving.","2.9"],
 [2,"Why change a new SOHO router's default SSID?","The default name can reveal the router's make and model to attackers",["It makes the Wi-Fi faster","It changes the encryption type","It's required for DHCP to work"],"A default SSID hints at known default passwords and vulnerabilities. Pick a name that doesn't identify the owner or the equipment.","2.10"],
 [2,"Why turn off UPnP on a home router?","It lets devices, including malware, open ports through the firewall automatically",["It slows down the Wi-Fi","It disables DHCP","It blocks all web browsing"],"UPnP is convenient but risky. Open only the ports you need with manual port forwarding.","2.10"],

const CISSP_Q = [ // [domain, question, correct, [wrong x3], explanation, objective] — original items written against the 2024 CISSP outline
 [1,"Which canon comes first in the ISC2 Code of Ethics?","Protect society, the common good, necessary public trust and confidence, and the infrastructure",["Act honorably, honestly, justly, responsibly, and legally","Provide diligent and competent service to principals","Advance and protect the profession"],"The four canons are applied in order. Protecting society comes first, then acting honorably and legally, then serving principals, then advancing the profession.","1.1"],
 [1,"Two ISC2 canons seem to conflict in a situation. How should a member resolve it?","Give priority to the canon that comes earlier in the order",["Follow whichever canon their employer prefers","Follow the canon that benefits the client most","Ignore both and consult a lawyer only"],"The canons are listed in priority order, so duty to society outweighs duty to an employer or client.","1.1"],
 [1,"A certified colleague falsifies evidence for an audit. What does the ISC2 Code of Ethics expect you to do?","Report the violation through the proper channels, which can include ISC2",["Ignore it to protect the team","Post about it on social media","Quietly fix the evidence yourself"],"Members are expected to act honorably and protect the profession, which includes reporting ethics violations through proper channels.","1.1"],
 [1,"An attacker quietly changes amounts in payroll records. Which security goal is violated?","Integrity",["Confidentiality","Availability","Nonrepudiation"],"Integrity means data is accurate and protected from unauthorized change. Confidentiality would be violated if the records were only read.","1.2"],
 [1,"Which concept stops a sender from later denying that they sent a digitally signed message?","Nonrepudiation",["Availability","Least privilege","Obfuscation"],"A digital signature made with the sender's private key proves who sent the message, so they can't credibly deny it.","1.2"],
 [1,"A flood of traffic takes an online store offline. Which element of the CIA triad is mainly affected?","Availability",["Confidentiality","Integrity","Authenticity"],"Denial-of-service attacks stop authorized users reaching systems. No data has to be read or changed for the attack to succeed.","1.2"],

 [1,"An organization researches its vendors' security practices before signing contracts. Which concept is this?","Due diligence",["Due care","Due process","Negligence"],"Due diligence is investigating and understanding risk. Due care is acting on that knowledge the way a reasonable person would.","1.3"],
 [1,"Which regulation protects the personal data of people in the European Union, even when the company is elsewhere?","GDPR",["HIPAA","SOX","FERPA"],"GDPR applies to anyone processing EU residents' personal data. HIPAA covers US health data, SOX covers financial reporting, and FERPA covers US student records.","1.4"],
 [1,"Which type of intellectual property protects a company's logo?","A trademark",["A patent","A copyright","A trade secret"],"Trademarks protect brand names and logos. Patents protect inventions, copyrights protect creative works, and trade secrets protect confidential business information.","1.4"],
 [1,"A company keeps its manufacturing formula confidential instead of patenting it. How is the formula protected?","As a trade secret",["As a trademark","As a copyright","It has no protection"],"A trade secret stays protected as long as the company takes reasonable steps, such as NDAs, to keep it secret. A patent would make the formula public in exchange for protection.","1.4"],

 [1,"An internal investigation looks into a staff member breaking the acceptable use policy. What type is this?","Administrative",["Criminal","Civil","Regulatory"],"Administrative (operational) investigations deal with internal issues. They follow company policy and usually have a lower standard of proof.","1.5"],
 [1,"Which document is mandatory and names the specific technologies or settings to use?","A standard",["A guideline","A policy","A baseline review"],"Standards support policies with specific, mandatory requirements, such as AES-256 for data at rest. Guidelines are recommendations.","1.6"],

 [1,"Which business continuity activity identifies critical processes and how the impact of losing them grows over time?","A BIA",["A penetration test","A vulnerability scan","A tabletop exercise"],"The business impact analysis finds critical functions, their dependencies and their MTD, RTO and RPO, which drive the recovery strategy.","1.7"],
 [1,"How does the RTO relate to the MTD?","The RTO must be shorter than or equal to the MTD",["The RTO must be longer than the MTD","They are always equal","They aren't related"],"The recovery time objective has to fit inside the maximum tolerable downtime, or the business won't survive the outage.","1.7"],
 [1,"What should come first when starting a business continuity planning project?","Getting senior management support and defining the project's scope",["Buying a hot site","Writing recovery procedures","Running a full interruption test"],"Without management sponsorship and a clear scope, the plan won't get the resources and authority it needs.","1.7"],
 [1,"Which practice helps uncover fraud by requiring employees to be away from their duties for a while?","Mandatory vacation",["Job enrichment","Least privilege","Single sign-on"],"While the employee is away, someone else does the work, which often exposes ongoing fraud.","1.8"],
 [1,"An employee is being terminated. When should their access be removed?","At or before the time they are told",["One week after they leave","When they return their badge","After their final paycheck"],"Removing access promptly stops an upset employee from damaging systems or taking data.","1.8"],
