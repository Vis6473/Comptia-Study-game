<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cyber Zombie Attack</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: single centered column, a "patch panel" of game modes; T568B pair colours are the accent system. */
:root{
  --bg:#EDF1F3; --surface:#FFFFFF; --surface-2:#F5F8F9; --ink:#13222C; --muted:#5A6A75; --line:#D2DBE0;
  --orange:#D9621A; --green:#2C8452; --blue:#1F68AA; --brown:#7A5230;
  --ok:#2C8452; --ok-bg:#E3F2E9; --bad:#C2362B; --bad-bg:#FBE6E3;
  --accent:var(--orange); --on-accent:#FFFFFF;
  --f-display:"Chakra Petch", "Segoe UI", system-ui, sans-serif;
  --f-body:"IBM Plex Sans", system-ui, -apple-system, sans-serif;
  --f-mono:"IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1920; --surface:#16242D; --surface-2:#1B2C36; --ink:#E4EDF1; --muted:#8EA2AD; --line:#273A46;
  --orange:#F08A45; --green:#4DB97E; --blue:#5BA2E0; --brown:#C08B5E;
  --ok:#4DB97E; --ok-bg:#16352A; --bad:#EE6E62; --bad-bg:#3A1F1E; --on-accent:#1A0E05; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1920; --surface:#16242D; --surface-2:#1B2C36; --ink:#E4EDF1; --muted:#8EA2AD; --line:#273A46;
  --orange:#F08A45; --green:#4DB97E; --blue:#5BA2E0; --brown:#C08B5E;
  --ok:#4DB97E; --ok-bg:#16352A; --bad:#EE6E62; --bad-bg:#3A1F1E; --on-accent:#1A0E05; color-scheme:dark}

*{box-sizing:border-box}
html{color-scheme:light}
@media (prefers-color-scheme: dark){html{color-scheme:dark}}
body{margin:0}
[hidden]{display:none!important}
img{max-width:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 48px}
.wrap{max-width:920px;margin:0 auto}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.15}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.mono{font-family:var(--f-mono)}
.label{font-family:var(--f-mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}

/* T568B stripe */
.cable{display:grid;grid-template-columns:repeat(8,1fr);height:6px;border-radius:0 0 4px 4px;overflow:hidden}
.cable i{display:block}
.cable i.w{background:repeating-linear-gradient(90deg,var(--c) 0 8px,var(--surface) 8px 14px)}
.cable i:not(.w){background:var(--c)}

header.top{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;padding-block:18px 14px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:inherit}
.brand .jack{width:30px;height:26px;border:2.5px solid var(--ink);border-radius:4px;position:relative}
.brand .jack::after{content:"";position:absolute;left:7px;right:7px;bottom:-2.5px;height:7px;border:2.5px solid var(--ink);border-bottom:0;background:var(--bg)}
.brand h1{font-size:22px;letter-spacing:.01em}
.brand small{display:block;font-family:var(--f-mono);font-size:11px;color:var(--muted);letter-spacing:.06em}
.hud{display:flex;gap:18px;align-items:center;font-family:var(--f-mono);font-size:13px;flex-wrap:wrap}
.hud b{font-weight:600;color:var(--ink)}
.hud span{color:var(--muted)}
.xpbar{width:90px;height:6px;background:var(--line);border-radius:3px;overflow:hidden;display:inline-block;vertical-align:middle;margin-left:6px}
.xpbar i{display:block;height:100%;background:var(--accent)}

nav.tabs{display:flex;gap:4px;overflow-x:auto;border-bottom:1px solid var(--line);margin-bottom:24px;scrollbar-width:none}
nav.tabs a{flex:none;padding:10px 12px;text-decoration:none;color:var(--muted);font-weight:500;font-size:14px;border-bottom:3px solid transparent;margin-bottom:-1px}
nav.tabs a[aria-current="page"]{color:var(--ink);border-color:var(--accent)}
nav.tabs a:hover{color:var(--ink)}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:22px}
.stack{display:flex;flex-direction:column;gap:20px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}

/* Home */
.hero{display:grid;grid-template-columns:1.4fr 1fr;gap:20px;align-items:stretch}
.hero h2{font-size:clamp(26px,4.6vw,38px);margin-bottom:10px}
.hero p{color:var(--muted);max-width:52ch;margin:0}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.stats div{background:var(--surface);padding:14px 16px}
.stats b{display:block;font-family:var(--f-display);font-size:28px;font-variant-numeric:tabular-nums}
.domains{display:flex;flex-direction:column;gap:12px}
.dsum{display:flex;flex-wrap:wrap;gap:6px 20px;font-size:13px;color:var(--muted);margin:-6px 0 16px;padding-bottom:12px;border-bottom:1px solid var(--line)}
.dsum b{color:var(--ink);font-weight:600}
.dom{display:grid;grid-template-columns:2.2em 1fr 3.2em 4.4em;gap:12px;align-items:center;font-size:14px}
.dom .num{font-family:var(--f-mono);color:var(--muted)}
.dom .name{min-width:0}
.dom .meter{grid-column:2/3;height:8px;background:var(--surface-2);border:1px solid var(--line);border-radius:4px;overflow:hidden}
.dom .meter i{display:block;height:100%}
.dom .w,.dom .acc{font-family:var(--f-mono);text-align:right;font-variant-numeric:tabular-nums}
.dom .w{color:var(--muted)}
.dom .dstat{display:flex;flex-wrap:wrap;gap:4px 16px;font-size:12.5px;color:var(--muted);margin-top:-4px}
.dom .dstat b{color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums}
.dom .dstat a{color:inherit;text-decoration:underline;text-underline-offset:2px}
.modes{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.mode{display:flex;flex-direction:column;gap:6px;text-decoration:none;color:inherit;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 16px 14px;position:relative;overflow:hidden;transition:transform .15s,border-color .15s}
.mode::before{content:"";position:absolute;left:0;top:0;right:0;height:4px;background:var(--c)}
.mode:hover{border-color:var(--c);transform:translateY(-2px)}
.mode h3{font-size:19px}
.mode p{margin:0;color:var(--muted);font-size:14px}
.mode .best{margin-top:auto;padding-top:8px;font-family:var(--f-mono);font-size:12px;color:var(--muted)}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 18px;border-radius:8px;border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:15px;text-decoration:none;color:var(--ink)}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.primary:hover{filter:brightness(1.06)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.chip{padding:7px 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:14px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}

/* Quiz */
.qhead{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:center;margin-bottom:6px}
.progress{height:4px;background:var(--line);border-radius:2px;overflow:hidden;margin-bottom:18px}
.progress i{display:block;height:100%;background:var(--accent);transition:width .3s}
.qtext{font-size:clamp(18px,2.6vw,22px);font-weight:500;margin:0 0 18px;max-width:62ch}
.opts{display:grid;gap:10px}
.opt{display:grid;grid-template-columns:28px 1fr;gap:12px;align-items:center;text-align:left;padding:12px 14px;border:1px solid var(--line);background:var(--surface-2);border-radius:8px;font-size:15px}
.opt kbd{font-family:var(--f-mono);font-size:12px;border:1px solid var(--line);border-radius:4px;text-align:center;padding:2px 0;background:var(--surface);color:var(--muted)}
.opt:hover:not([disabled]){border-color:var(--blue)}
.opt[disabled]{cursor:default}
.opt.right{background:var(--ok-bg);border-color:var(--ok)}
.opt.wrong{background:var(--bad-bg);border-color:var(--bad)}
.opt.dim{opacity:.55}
.explain{margin-top:16px;padding:14px 16px;border-left:4px solid var(--c,var(--blue));background:var(--surface-2);border-radius:0 8px 8px 0;font-size:15px}
.explain b{font-family:var(--f-display);font-size:16px;display:block;margin-bottom:2px}
.verdict-ok{--c:var(--ok)} .verdict-bad{--c:var(--bad)}
.result{text-align:center;padding-block:12px}
.result .big{font-family:var(--f-display);font-size:64px;line-height:1;font-variant-numeric:tabular-nums}

/* Blitz */
.timer{height:10px;border-radius:5px;background:var(--line);overflow:hidden;margin-block:6px 18px}
.timer i{display:block;height:100%;background:var(--green);transition:width .1s linear}
.timer.low i{background:var(--bad)}
.blitz-q{font-family:var(--f-display);font-size:clamp(24px,4vw,32px);margin-bottom:18px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid2 .opt{grid-template-columns:1fr;text-align:center;font-family:var(--f-mono);font-size:17px;padding:16px 10px}
.flash-ok{animation:fo .35s} .flash-bad{animation:fb .35s}
@keyframes fo{from{box-shadow:0 0 0 4px var(--ok)}to{box-shadow:0 0 0 0 transparent}}
@keyframes fb{from{box-shadow:0 0 0 4px var(--bad)}to{box-shadow:0 0 0 0 transparent}}
.tbl-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line)}
th{font-family:var(--f-mono);font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:500}
td.p{font-family:var(--f-mono);font-weight:600;white-space:nowrap}

/* OSI */
.osi{display:grid;grid-template-columns:1fr 1.1fr;gap:20px}
.item-card{display:flex;flex-direction:column;justify-content:center;gap:10px;min-height:180px;padding:22px;border:2px dashed var(--line);border-radius:var(--r);background:var(--surface-2)}
.item-card .it{font-family:var(--f-display);font-size:clamp(24px,4vw,30px)}
.layers{display:flex;flex-direction:column;gap:6px}
.layer{display:grid;grid-template-columns:34px 1fr auto;gap:10px;align-items:center;padding:10px 12px;border-radius:8px;border:1px solid var(--line);background:var(--surface);text-align:left}
.layer .n{font-family:var(--f-mono);font-weight:600;width:28px;height:28px;display:grid;place-items:center;border-radius:6px;background:var(--lc);color:#fff;font-size:14px}
.layer .pdu{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.layer:hover:not([disabled]){border-color:var(--lc)}
.layer.right{background:var(--ok-bg);border-color:var(--ok)}
.layer.wrong{background:var(--bad-bg);border-color:var(--bad)}

/* Subnet */
.ipline{font-family:var(--f-mono);font-size:clamp(24px,5vw,40px);font-weight:600;letter-spacing:.01em;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.ipline span{color:var(--accent)}
.answer{display:flex;gap:10px;flex-wrap:wrap}
.answer input{flex:1 1 220px;min-width:0;font-family:var(--f-mono);font-size:18px;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface-2);color:var(--ink)}
.answer input:focus{outline:3px solid var(--blue);outline-offset:1px}
.bits{font-family:var(--f-mono);font-size:13px;overflow-x:auto;white-space:pre;background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:12px;line-height:1.7}
.bits .n{color:var(--blue);font-weight:600} .bits .h{color:var(--orange);font-weight:600}
.cheat{display:grid;grid-template-columns:repeat(auto-fit,minmax(118px,1fr));gap:6px;font-family:var(--f-mono);font-size:13px}
.cheat div{padding:6px 8px;background:var(--surface-2);border:1px solid var(--line);border-radius:6px;display:flex;justify-content:space-between;gap:6px}
.cheat div span{color:var(--muted)}

.muted{color:var(--muted)}
.small{font-size:13px}
.empty{padding:30px;text-align:center;color:var(--muted)}
footer{margin-top:36px;font-size:13px;color:var(--muted)}

.opt small.full{display:block;font-family:var(--f-body);font-size:12px;font-weight:400;color:var(--muted);margin-top:4px;letter-spacing:0}
.toggle{display:flex;gap:10px;align-items:flex-start;font-size:14px;color:var(--muted);cursor:pointer}
.toggle input{margin-top:3px;accent-color:var(--orange);width:16px;height:16px}
.rv-opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.rv{display:flex;flex-direction:column;gap:6px;text-align:left;padding:16px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface-2)}
.rv:hover:not([disabled]){border-color:var(--orange)}
.rv[disabled]{opacity:.55;cursor:not-allowed}
.rv b{font-family:var(--f-display);font-size:18px}
.rv span{color:var(--muted);font-size:14px}
.mock-top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:6px}
.mock-timer{font-family:var(--f-mono);font-size:22px;font-weight:600;font-variant-numeric:tabular-nums;padding:2px 10px;border:1px solid var(--line);border-radius:6px}
.mock-timer.low{color:var(--bad);border-color:var(--bad)}
.opt.sel{border-color:var(--blue);box-shadow:inset 0 0 0 1px var(--blue);background:var(--surface)}
.opt.sel kbd{background:var(--blue);border-color:var(--blue);color:var(--surface)}
.mock-nav{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:18px}
.flagbtn[aria-pressed="true"]{border-color:var(--orange);color:var(--orange)}
.mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(40px,1fr));gap:6px;margin-top:12px}
.mg{position:relative;overflow:hidden;font-family:var(--f-mono);font-size:12px;padding:7px 0;border:1px dashed var(--line);border-radius:5px;background:var(--surface);color:var(--muted);font-variant-numeric:tabular-nums}
.mg.done{border-style:solid;border-color:var(--muted);color:var(--ink);background:var(--surface-2)}
.mg.cur{outline:2px solid var(--accent);outline-offset:1px}
.mg.pb{color:var(--blue);font-weight:600}
.pbq-tag{display:inline-block;font-family:var(--f-mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--blue);margin-top:14px}
.pbq-t{font-size:22px;margin:4px 0 6px}
.pbq{display:flex;flex-direction:column;gap:8px;margin-top:14px}
.pbq-row{display:grid;grid-template-columns:minmax(0,1fr) minmax(150px,280px);gap:12px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface-2);font-size:15px}
.pbq-row select{font:inherit;font-size:14px;padding:8px 10px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);width:100%}
@media (max-width:560px){.pbq-row{grid-template-columns:1fr}}
td.ok-t{color:var(--ok)} td.bad-t{color:var(--bad)}
.reward{display:flex;flex-direction:column;gap:10px;padding:14px 16px;border:1px solid var(--ok);border-radius:10px;background:var(--ok-bg)}
.rw-chips{display:flex;flex-wrap:wrap;gap:8px}
.rw-chips span{font-family:var(--f-mono);font-size:13px;font-weight:600;padding:5px 10px;border-radius:6px;background:var(--surface);border:1px solid var(--line)}
.achs{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.ach{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.ach div{display:flex;flex-direction:column;gap:2px;min-width:0}
.ach small{color:var(--muted);font-size:12px}
.ach-i{font-size:20px;line-height:1;color:var(--muted)}
.ach.on{border-color:var(--orange)} .ach.on .ach-i{color:var(--orange)}
.ach:not(.on){opacity:.65}
.mg.flag::after{content:"";position:absolute;top:0;right:0;border-top:10px solid var(--orange);border-left:10px solid transparent}
.confirm{margin-top:14px;padding:14px 16px;border:1px solid var(--line);border-radius:8px;background:var(--surface-2);display:flex;flex-direction:column;gap:10px}
.passchip{display:inline-block;font-family:var(--f-mono);font-weight:600;letter-spacing:.12em;padding:4px 12px;border-radius:4px}
.passchip.pass{background:var(--ok-bg);color:var(--ok)} .passchip.fail{background:var(--bad-bg);color:var(--bad)}
.mstats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.mstats div{background:var(--surface);padding:12px 14px}
.mstats b{display:block;font-family:var(--f-display);font-size:24px;font-variant-numeric:tabular-nums}
details.miss{border-top:1px solid var(--line);padding:10px 0}
details.miss summary{cursor:pointer;font-weight:500}
details.miss summary span{font-family:var(--f-mono);font-size:12px;color:var(--muted);margin-right:8px}
details.miss .body{padding:8px 0 0 2px;display:flex;flex-direction:column;gap:6px;font-size:15px}
details.obj{border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
details.obj+details.obj{margin-top:10px}
details.obj summary{cursor:pointer;display:grid;grid-template-columns:auto 1fr;gap:4px 12px;align-items:baseline;padding:14px 16px;list-style:none}
details.obj summary::-webkit-details-marker{display:none}
details.obj summary .oc{font-family:var(--f-mono);font-weight:600;color:var(--orange)}
details.obj summary .ot{font-weight:600;min-width:0}
.guide-ch{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.guide-ch .label{flex-basis:100%}
.src.static{cursor:default}
details.obj summary .chips{grid-column:2;display:flex;gap:6px;flex-wrap:wrap}
.chip-s{font-family:var(--f-mono);font-size:11px;letter-spacing:.06em;padding:2px 8px;border-radius:4px;background:var(--surface-2);border:1px solid var(--line);color:var(--muted)}
.chip-s.bad{background:var(--bad-bg);border-color:var(--bad);color:var(--bad)}
.obj-body{padding:0 16px 16px;display:flex;flex-direction:column;gap:12px}
.srcs{display:flex;flex-wrap:wrap;gap:8px}
.src{display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border:1px solid var(--line);border-radius:6px;text-decoration:none;color:var(--ink);font-size:14px;background:var(--surface-2)}
.src:hover{border-color:var(--blue)}
.src small{color:var(--muted);font-size:12px}
.note{padding:10px 12px;border-left:3px solid var(--blue);background:var(--surface-2);border-radius:0 6px 6px 0;display:flex;flex-direction:column;gap:4px;font-size:14px}
.note .nq{color:var(--muted)}
.zlogo{width:34px;height:34px;color:var(--ink);flex:none}
.hdr-r{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.hdr-links{display:flex;gap:14px;font-size:13px}
.hdr-links a{color:var(--muted);text-decoration:none}
.hdr-links a:hover{color:var(--ink);text-decoration:underline}
.btn.danger{background:var(--bad);border-color:var(--bad);color:var(--surface)}
.set-row{display:grid;grid-template-columns:1fr auto;gap:8px 16px;align-items:center;padding:14px 0;border-top:1px solid var(--line)}
.set-row:first-of-type{border-top:0}
.set-row b{display:block;font-size:16px}
.set-row p{margin:2px 0 0;color:var(--muted);font-size:14px;max-width:60ch}
.set-row .confirm{grid-column:1/-1;margin:0}
.set-done{color:var(--ok);font-weight:600}
.board{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.board div{background:var(--surface);padding:12px 14px;display:flex;flex-direction:column;gap:2px}
.board b{font-family:var(--f-display);font-size:24px;font-variant-numeric:tabular-nums}
.board small{color:var(--muted);font-size:12px}
.board.board-3{grid-template-columns:repeat(3,minmax(0,1fr))}
@media (max-width:560px){.board.board-3{grid-template-columns:repeat(2,minmax(0,1fr))}}
.foes{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px}

 [1,"Which OSI layer handles logical addressing and routing between networks?","Layer 3, Network",["Layer 2, Data Link","Layer 4, Transport","Layer 5, Session"],"The Network layer uses logical (IP) addresses and routers make forwarding decisions here. Layer 2 uses MAC addresses within a single segment.","1.1"],

 [1,"What is the correct order of the TCP three-way handshake?","SYN, SYN-ACK, ACK",["SYN, ACK, SYN-ACK","ACK, SYN, FIN","SYN, SYN, ACK"],"The client sends SYN, the server replies SYN-ACK, and the client confirms with ACK. FIN and RST tear connections down.","1.4"],
 [1,"Software-defined networking (SDN) separates which two functions?","Control plane and data plane",["Access layer and core layer","Layer 2 and Layer 3","Management VLAN and user VLAN"],"In SDN a central controller runs the control plane, and switches forward traffic in the data (forwarding) plane. The application and management planes sit above them.","1.8"],
 [1,"Which frequency band did Wi-Fi 6E add?","6 GHz",["5 GHz","2.4 GHz","60 GHz"],"Wi-Fi 6E is 802.11ax extended into 6 GHz, which has many clean channels and a shorter range.","1.5"],
 [1,"Which IPv4 address range is reserved for multicast?","224.0.0.0 – 239.255.255.255",["240.0.0.0 – 255.255.255.255","127.0.0.0 – 127.255.255.255","192.0.2.0 – 192.0.2.255"],"Class D (224.0.0.0/4) is multicast. Class E (240.0.0.0/4) is experimental, and 127.0.0.0/8 is loopback.","1.7"],
 [1,"What is the PDU called at the Transport layer when TCP is used?","Segment",["Packet","Frame","Bit"],"From the top down: data, segment (L4, or datagram for UDP), packet (L3), frame (L2), bits (L1).","1.1"],
 [1,"Which technology carries Layer 2 frames over a Layer 3 network and is common in data centers?","VXLAN",["802.1Q","PPP","MPLS"],"VXLAN wraps Ethernet frames in UDP (port 4789) and uses a 24-bit VNI, which allows about 16 million segments compared with 4,094 VLANs.","1.8"],
 [1,"Which fiber type uses a laser and a small core to cover the longest distances?","Single-mode fiber",["Multimode fiber","Cat 6a","Twinaxial"],"Single-mode has a core of about 9 µm and reaches many kilometres. Multimode has a 50 or 62.5 µm core and is used for shorter runs inside buildings.","1.5"],
 [1,"What is the maximum supported distance for 10GBASE-T over Cat 6a?","100 meters",["55 meters","185 meters","500 meters"],"Cat 6a supports 10 Gbps to 100 m. Plain Cat 6 supports 10 Gbps only to about 55 m.","1.5"],
 [1,"Which security model assumes no user or device is trusted by default, even inside the network?","Zero trust",["Defense in depth","Implicit trust","Perimeter security"],"Zero trust verifies every request explicitly, applies least privilege and assumes a breach has already happened.","1.8"],
 [1,"Which IPv6 address is the loopback?","::1",["FE80::1","::","FF02::1"],"::1 is loopback. :: is the unspecified address and FF02::1 is the all-nodes multicast group.","1.8"],

 [2,"Which routing protocol is link-state and calculates paths using cost and Dijkstra's algorithm?","OSPF",["RIP","BGP","EIGRP"],"OSPF is a link-state protocol that builds a full topology map and runs SPF (Dijkstra). RIP is distance-vector and uses hop count. BGP is path-vector.","2.1"],
 [2,"Which protocol exchanges routes between autonomous systems on the internet?","BGP",["OSPF","RIP","IS-IS"],"BGP is the path-vector exterior gateway protocol that runs between ISPs and large organizations.","2.1"],
 [2,"A router learns the same prefix from OSPF, RIP and a static route. Which route is installed with default administrative distances?","The static route (AD 1)",["The OSPF route (AD 110)","The RIP route (AD 120)","All three, load-balanced"],"Lower AD is more trusted: connected 0, static 1, eBGP 20, EIGRP 90, OSPF 110, RIP 120.","2.1"],
 [2,"What does IEEE 802.1Q define?","VLAN tagging on trunk links",["Port-based authentication","Link aggregation","Spanning Tree Protocol"],"802.1Q adds a 4-byte tag with a 12-bit VLAN ID. 802.1X is port authentication, 802.3ad is LACP and 802.1D is STP.","2.2"],
 [2,"Which protocol stops Layer 2 switching loops by blocking redundant paths?","Spanning Tree Protocol",["LACP","VTP","HSRP"],"STP elects a root bridge and puts redundant ports into blocking. RSTP (802.1w) converges much faster.","2.2"],
 [2,"How much power can an 802.3af PoE switch port supply?","15.4 W",["30 W","60 W","90 W"],"802.3af (PoE) supplies 15.4 W, 802.3at (PoE+) 30 W, and 802.3bt (PoE++) 60 W for Type 3 or about 90–100 W for Type 4.","2.2"],
 [2,"Which wireless security standard replaces the pre-shared key handshake with SAE?","WPA3",["WPA2","WEP","WPS"],"WPA3-Personal uses Simultaneous Authentication of Equals, which resists offline dictionary attacks on captured handshakes.","2.3"],
 [2,"In the 2.4 GHz band in North America, which channels do not overlap?","1, 6 and 11",["1, 5 and 9","2, 7 and 12","1, 4, 8 and 11"],"Each 2.4 GHz channel is 22 MHz wide with 5 MHz spacing, so only 1, 6 and 11 avoid overlapping.","2.3"],
 [2,"Which protocol bundles several physical links into one logical link?","LACP (802.3ad)",["STP","CDP","VRRP"],"LACP negotiates link aggregation (port channels, EtherChannel), which adds bandwidth and redundancy.","2.2"],
 [2,"On an 802.1Q trunk, how is native VLAN traffic sent?","Untagged",["Double-tagged","Tagged with VLAN 4095","Encrypted"],"Frames on the native VLAN cross the trunk without a tag. Both ends must agree on the native VLAN.","2.2"],
 [2,"Which protocols provide default gateway redundancy by sharing a virtual IP address?","VRRP and HSRP",["OSPF and BGP","STP and RSTP","DHCP and DNS"],"First-hop redundancy protocols (FHRP) let two routers share a virtual gateway IP and MAC, so hosts keep working if one router fails.","2.1"],
 [2,"Which technique lets many internal hosts share one public IP by tracking port numbers?","PAT (NAT overload)",["Static NAT","Port mirroring","Port forwarding"],"PAT maps many private addresses to one public address and keeps sessions apart by source port.","2.1"],
 [2,"What is the usual MTU of a jumbo frame?","About 9000 bytes",["1500 bytes","576 bytes","65,535 bytes"],"Standard Ethernet MTU is 1500 bytes. Jumbo frames (about 9000) cut overhead on storage networks, and every device in the path must support them.","2.2"],
 [2,"Which antenna sends signal in one focused direction, such as for a building-to-building link?","Yagi (directional)",["Omnidirectional","Dipole","Isotropic"],"Directional antennas such as Yagi or parabolic dishes concentrate gain in one direction. Omnidirectional antennas radiate all the way around.","2.3"],
 [2,"Which device is needed for hosts in different VLANs to talk to each other?","A router or Layer 3 switch",["An unmanaged switch","A hub","A media converter"],"Each VLAN is its own broadcast domain and IP subnet, so traffic between them must be routed, for example with SVIs or router-on-a-stick.","2.2"],
 [2,"Which 802.11 standard is marketed as Wi-Fi 6 and introduced OFDMA?","802.11ax",["802.11ac","802.11n","802.11g"],"Wi-Fi 4 is 802.11n, Wi-Fi 5 is 802.11ac (5 GHz only), and Wi-Fi 6 is 802.11ax on 2.4 and 5 GHz. Wi-Fi 6E extends 802.11ax into 6 GHz.","2.3"],
 [2,"Which switch port mode carries traffic for several VLANs over one link?","Trunk port",["Access port","Mirror port","Console port"],"A trunk tags frames with their VLAN ID (802.1Q) so many VLANs share one link. An access port belongs to a single VLAN and sends untagged frames.","2.2"],
 [2,"A router learns two routes to the same network from OSPF. How does it choose between them?","By the route metric (OSPF cost)",["By administrative distance","By the MAC address table","By the ARP cache"],"Administrative distance picks between different routing sources. Within one protocol, the lowest metric wins: cost for OSPF, hop count for RIP.","2.1"],
 [2,"Which routing table entry matches any destination that has no more specific route?","The default route, 0.0.0.0/0",["The loopback route, 127.0.0.0/8","A host route, /32","The multicast route, 224.0.0.0/4"],"The default route, sometimes called the gateway of last resort, catches all traffic with no better match. Routers always prefer the longest prefix match.","2.1"],
 [2,"A small branch needs traffic for 10.20.0.0/16 sent to one specific next hop, without running a routing protocol. What should be configured?","A static route",["A default VLAN","A DHCP relay","Port forwarding"],"Static routes are entered by hand. They have an administrative distance of 1 and add no protocol overhead, but they do not adapt when links fail.","2.1"],
 [2,"What is the main purpose of a wireless site survey?","Find coverage, interference and the best AP placement",["Encrypt wireless traffic","Assign IP addresses to clients","Block rogue devices automatically"],"A survey measures signal strength (heat maps), noise and channel use so access points can be placed and tuned.","2.3"],

 [3,"Which service collects log messages centrally, traditionally on UDP 514?","Syslog",["SNMP","NetFlow","NTP"],"Syslog severities run from 0 (Emergency) to 7 (Debug). A SIEM often collects and correlates these logs.","3.2"],
 [3,"What does SNMPv3 add over SNMPv2c?","Authentication and encryption",["Support for traps","Community strings","UDP transport"],"v1 and v2c send community strings in plaintext. v3 adds user-based authentication and privacy (encryption).","3.2"],
 [3,"Which metric defines the maximum amount of data loss, measured in time, that a business can accept?","RPO",["RTO","MTTR","MTBF"],"The recovery point objective sets how often you must back up. The recovery time objective is how long you can be down.","3.3"],
 [3,"Which disaster recovery site has equipment and current data and is ready to take over almost immediately?","Hot site",["Cold site","Warm site","Colocation cage"],"A hot site is fully equipped and synchronized. A warm site has hardware but needs data restored. A cold site is space and power only.","3.3"],
 [3,"What is the correct order of the DHCP lease process?","Discover, Offer, Request, Acknowledge",["Request, Offer, Discover, Acknowledge","Offer, Discover, Acknowledge, Request","Discover, Request, Offer, Acknowledge"],"Remember DORA. The client broadcasts Discover from UDP 68 to server port 67.","3.4"],
 [3,"A printer must always get the same IP address from DHCP. What should you configure?","A DHCP reservation",["A larger scope","A shorter lease time","An exclusion range"],"A reservation ties an IP to the client's MAC address. An exclusion keeps addresses out of the pool entirely.","3.4"],
 [3,"Which document sets a provider's committed uptime and response times?","SLA",["MOU","NDA","AUP"],"A service level agreement defines measurable commitments such as 99.99% uptime and the penalties for missing them.","3.1"],
 [3,"Why do administrators record a network performance baseline?","To have a normal reference point for spotting anomalies",["To meet encryption rules","To assign VLANs automatically","To replace documentation"],"Without a baseline you cannot tell whether 70% utilization or 30 ms latency is normal.","3.2"],
 [3,"Which technology reports who talked to whom, over which ports, and how much data was sent?","NetFlow",["Syslog","SNMP traps","Port security"],"NetFlow, sFlow and IPFIX export flow records for traffic analysis and capacity planning.","3.2"],
 [3,"How can you copy traffic from one switch port to an analyzer on another port?","Port mirroring (SPAN)",["Port security","Port forwarding","Port aggregation"],"SPAN copies frames to a monitor port. A network TAP does the same job in hardware.","3.2"],
 [3,"Which IPv6 feature lets hosts configure their own address from router advertisements without a DHCP server?","SLAAC",["APIPA","DHCPv6 relay","EUI-48"],"Stateless address autoconfiguration combines the advertised prefix with an interface ID (EUI-64 or random).","3.4"],
 [3,"You need to manage switches even if the production network goes down. What should you use?","Out-of-band management",["In-band SSH","A management VLAN only","SNMP traps"],"Out-of-band management uses a separate path, such as a console server or cellular modem, that does not depend on production links.","3.5"],
 [3,"Which metric measures the average time it takes to fix a failed component?","MTTR",["MTBF","RPO","RTO"],"MTTR is the average time to fix a failure. MTBF is the average time between failures. RPO is how much data loss is acceptable, and RTO is how much downtime is acceptable.","3.3"],
 [3,"Which document shows cable runs, rack positions and the ports devices connect to?","A physical network diagram",["A logical network diagram","An SLA","A change request"],"A physical diagram shows where things are and how they are cabled. A logical diagram shows subnets, VLANs and how traffic is routed.","3.1"],
 [3,"Which document lists hardware and software with each item's location, owner and warranty?","An asset inventory",["A baseline report","A change log","An MOU"],"An asset inventory supports lifecycle management, licensing, and end-of-life and end-of-support planning.","3.1"],
 [3,"Which backup type copies everything changed since the last full backup, so a restore needs only the full backup plus the latest one of these?","Differential",["Incremental","Snapshot","Synthetic full"],"An incremental backup copies changes since the last backup of any kind, so a restore needs the full backup plus every incremental. A differential grows each day but restores faster.","3.3"],
 [3,"Each server has dual power supplies fed from two separate UPS units and power feeds. What does this provide?","Redundancy for high availability",["Load balancing","Link aggregation","Network segmentation"],"Removing single points of failure, such as power, links and devices, keeps services running when one component fails.","3.3"],
 [3,"What does the DHCP lease time control?","How long a client may use its address before it must renew",["How long the client waits for an offer","How many addresses are in the scope","The TTL of DNS records"],"A client tries to renew at 50% of the lease (T1) and rebinds at 87.5% (T2). Short leases recycle addresses faster on busy guest networks.","3.4"],
 [3,"Which protocol synchronizes device clocks, which log correlation and Kerberos depend on?","NTP",["SNTP over TCP","PTP over HTTP","SMB"],"NTP uses UDP 123 and a hierarchy of strata. Stratum 0 is the reference clock.","3.4"],
 [3,"Before applying a router change in production, change management usually requires what?","An approved change request with a rollback plan",["A new IP scheme","Approval only after the change","Disabling logging"],"Changes are documented, reviewed, approved, scheduled in a maintenance window and include a backout plan.","3.1"],

 [4,"Hashing a file and comparing the result protects which part of the CIA triad?","Integrity",["Confidentiality","Availability","Non-repudiation"],"A changed hash shows the data was altered. Encryption protects confidentiality, and redundancy protects availability.","4.1"],
 [4,"An attacker fills a switch's CAM table so it floods frames out every port. What is this attack?","MAC flooding",["ARP poisoning","VLAN hopping","DNS poisoning"],"Once the MAC table is full the switch acts like a hub. Port security that limits MACs per port mitigates it.","4.2"],
 [4,"Which switch feature blocks rogue DHCP servers?","DHCP snooping",["Dynamic ARP inspection","BPDU guard","Port mirroring"],"DHCP snooping trusts only uplink ports to send DHCP offers and builds a binding table that DAI also uses.","4.3"],
 [4,"Which feature mitigates ARP spoofing on a switched network?","Dynamic ARP inspection",["DHCP snooping alone","Root guard","Storm control"],"DAI checks ARP packets against the DHCP snooping binding table and drops forged replies.","4.3"],
 [4,"In 802.1X, what role does the switch play?","Authenticator",["Supplicant","Authentication server","Certificate authority"],"The supplicant is the client, the authenticator is the switch or AP, and the authentication server is usually RADIUS.","4.1"],
 [4,"Which AAA protocol uses TCP 49 and encrypts the entire payload?","TACACS+",["RADIUS","LDAP","Kerberos"],"RADIUS uses UDP 1812/1813 and encrypts only the password. TACACS+ also separates authentication, authorization and accounting.","4.1"],
 [4,"An attacker sets up an AP with the same SSID as the corporate network to capture credentials. What is this?","Evil twin",["Bluejacking","War driving","Deauthentication"],"An evil twin copies a legitimate SSID. Deauth attacks are often used to push clients onto it.","4.2"],
 [4,"Where should a public-facing web server sit?","In a screened subnet (DMZ)",["On the internal user VLAN","On the management VLAN","Behind the core switch with no firewall"],"A screened subnet isolates internet-facing services, so a compromise does not reach the internal network directly.","4.3"],
 [4,"How do you reduce the risk of double-tagging VLAN hopping?","Change the native VLAN to an unused VLAN",["Enable jumbo frames","Turn on DTP on every port","Use VLAN 1 for users"],"Also disable DTP auto-trunking, set access ports to access mode and do not place users in the native VLAN.","4.3"],
 [4,"A fingerprint scan is which authentication factor?","Something you are",["Something you know","Something you have","Somewhere you are"],"Biometrics are something you are. Passwords are something you know. Tokens and smart cards are something you have.","4.1"],
 [4,"Which IPsec mode encrypts the entire original IP packet, including its header?","Tunnel mode",["Transport mode","Aggressive mode","Main mode"],"Tunnel mode adds a new outer IP header and is used for site-to-site VPNs. Transport mode protects only the payload. Main and aggressive are IKE phase 1 modes.","4.1"],
 [4,"Which principle gives users only the access their job requires?","Least privilege",["Separation of duties","Implicit deny","Defense in depth"],"Least privilege limits damage from compromised accounts. Implicit deny is the rule at the end of a firewall ACL.","4.1"],
 [4,"A decoy system that draws attackers in so their methods can be studied is called what?","Honeypot",["Bastion host","Jump box","Sinkhole"],"A honeypot is a decoy host, and a honeynet is a network of them.","4.1"],
 [4,"Phishing done over phone calls is called what?","Vishing",["Smishing","Whaling","Pharming"],"Vishing is voice, smishing is SMS, whaling targets executives, and pharming redirects users through poisoned DNS or hosts files.","4.2"],
 [4,"Which control keeps unknown devices off the network by checking their posture before granting access?","NAC",["IDS","DLP","WAF"],"Network access control often uses 802.1X and can quarantine devices that fail health checks.","4.3"],

 [5,"What is the first step in the CompTIA troubleshooting methodology?","Identify the problem",["Establish a theory of probable cause","Document findings","Implement the solution"],"The steps are: identify the problem, establish a theory, test the theory, plan the fix, implement or escalate, verify functionality, then document.","5.1"],
 [5,"You have a theory of probable cause. What is the next step?","Test the theory to determine the cause",["Escalate to a vendor","Document findings","Verify full system functionality"],"If the test does not confirm the theory, form a new theory or escalate.","5.1"],
 [5,"What is the final step of the troubleshooting methodology?","Document findings, actions, outcomes and lessons learned",["Verify full system functionality","Implement preventive measures","Close the ticket without notes"],"Documentation comes after you verify the fix and put preventive measures in place.","5.1"],
 [5,"Which tool finds the location of a break in a long fiber run?","OTDR",["Toner probe","Loopback plug","Multimeter"],"An optical time-domain reflectometer sends light pulses and measures reflections to find the distance to a fault.","5.5"],
 [5,"Which tool traces one unlabeled copper cable through a bundle to the patch panel?","Toner and probe",["OTDR","Spectrum analyzer","Light meter"],"The tone generator puts a signal on the cable and the probe picks it up by induction.","5.5"],
 [5,"A user can ping 8.8.8.8 but cannot open websites by name. What is the most likely problem?","DNS resolution",["Default gateway","Duplex mismatch","DHCP scope exhaustion"],"Reaching an IP proves routing works. Check DNS server settings with nslookup or dig.","5.3"],
 [5,"A host can reach devices on its own subnet but nothing remote. What should you check first?","The default gateway setting",["DNS server address","The NIC driver","The cable pinout"],"Traffic to other networks goes to the gateway, so a wrong or missing gateway blocks only remote traffic.","5.3"],
 [5,"A link shows late collisions and poor throughput. Which problem is most likely?","Duplex mismatch",["Wrong VLAN","DNS misconfiguration","Expired DHCP lease"],"When one side runs half duplex and the other full, late collisions and CRC errors rise. Set both sides the same, or both to auto.","5.2"],
 [5,"An interface shows a growing count of CRC errors. What is a likely cause?","A damaged cable or EMI",["A wrong subnet mask","An expired certificate","An incorrect DNS suffix"],"CRC errors mean frames were corrupted in transit, usually by a physical-layer problem such as cabling, interference or a bad transceiver.","5.2"],
 [5,"Which Windows command shows each router hop on the way to a destination?","tracert",["pathping -n only","ipconfig /all","netstat -r"],"Windows uses tracert and Linux uses traceroute. Pathping combines ping and tracert statistics.","5.5"],
 [5,"Which command shows the local ARP cache?","arp -a",["netstat -a","nslookup","route print"],"arp -a lists IP-to-MAC mappings. A wrong entry there can point to ARP spoofing.","5.5"],
 [5,"VoIP calls sound choppy even though bandwidth is fine. Which metric is the likely problem?","Jitter",["Throughput","MTU","Lease time"],"Jitter is variation in packet delay. Real-time voice and video need it low, usually under about 30 ms, plus QoS.","5.4"],
 [5,"Signal weakens over a long copper run. What is this called?","Attenuation",["Crosstalk","Latency","Reflection"],"Attenuation is loss of signal strength over distance. Crosstalk (NEXT, FEXT) is signal bleeding between pairs.","5.2"],
 [5,"After someone connects two switch ports with a patch cable, the network slows to a crawl. What is the likely cause?","A broadcast storm from a switching loop",["DHCP scope exhaustion","An expired certificate","An incorrect NTP server"],"Without STP, broadcasts loop forever. Enable STP and BPDU guard on access ports.","5.3"],
 [5,"Which Linux command shows interface IP addresses on a modern distribution?","ip addr",["ipconfig /all","show ip route","nbtstat"],"ip addr (or ip a) replaced ifconfig. On Windows, use ipconfig.","5.5"],
 [5,"Wireless clients far from the AP report slow speeds and disconnects. What is the most likely cause?","Low signal strength (RSSI)",["Duplex mismatch","Wrong VLAN on the trunk","DNS poisoning"],"As RSSI drops, clients fall back to lower data rates. Moving or adding APs or adjusting transmit power helps.","5.4"],
 [5,"Which tool measures actual throughput between two hosts?","iperf",["nslookup","arp","Wi-Fi analyzer"],"iperf runs a client and a server and pushes traffic between them to measure real bandwidth.","5.5"],
 [5,"Which command shows active TCP connections and listening ports?","netstat",["tracert","ipconfig","dig"],"netstat -an shows sockets numerically. On Linux, ss is the modern replacement.","5.5"],
 [5,"A new hire's PC gets 169.254.x.x while everyone else is fine. What should you check first?","The DHCP server or scope, and the PC's switch port or VLAN",["The DNS forwarders","The firewall's NAT rules","The NTP server"],"An APIPA address means DHCP failed. Common causes are an exhausted scope, a wrong access VLAN or a missing DHCP relay.","5.3"],
 [5,"A switch interface shows a rising count of giants. What is the most likely cause?","An MTU mismatch, such as jumbo frames sent to a port that does not allow them",["A duplex mismatch","A wrong default gateway","An exhausted DHCP scope"],"Giants are frames larger than the maximum allowed size (1518 bytes for standard Ethernet). Runts are frames under 64 bytes and often come from collisions.","5.2"],
 [5,"Interface counters show many runts on a half-duplex link. What usually causes runts?","Collisions or a faulty NIC",["MTU set too high","DNS timeouts","A wrong VLAN on the port"],"Runts are frames shorter than 64 bytes. Collisions cut frames short, so check duplex settings and the NIC.","5.2"],
 [5,"A user plugs a small home switch into a wall jack and the port immediately goes err-disabled. What most likely shut it down?","BPDU guard or port security",["DHCP snooping","An expired lease","Jumbo frames"],"BPDU guard disables an access port that receives spanning tree BPDUs, and port security disables it when too many MAC addresses appear. Clear the cause, then shut and no-shut the port.","5.2"],
 [5,"A switch port shows the status \"administratively down\". What does that mean?","Someone disabled it in the configuration (shutdown)",["The cable is unplugged","The far-end device is powered off","The port failed a hardware test"],"Administratively down means the shutdown command was applied. Enter no shutdown to enable it. A down/down status usually points to cabling or the far end.","5.2"],
 [5,"Six access points work on a PoE switch, but a seventh will not power on with a known-good cable. What is the likely cause?","The switch's PoE power budget is exhausted",["The VLAN is wrong","A duplex mismatch","The SSID is hidden"],"Each switch has a total PoE budget. Check it with a command such as show power inline, then move devices or add a PoE injector.","5.2"],
 [5,"A new fiber link will not come up. One end has a 1000BASE-SX transceiver and the other has 1000BASE-LX. What is the problem?","A transceiver mismatch",["Crosstalk","A bad crimp","Attenuation from too short a cable"],"SX is short-wavelength (850 nm) for multimode fiber and LX is long-wavelength (1310 nm), usually for single-mode. Both ends must use matching optics.","5.2"],
 [5,"A new fiber patch shows no link, and swapping the two strands at one end fixes it. What was wrong?","TX and RX were reversed",["The connectors were dirty","A transceiver mismatch","The bend radius was too tight"],"Each fiber end transmits on one strand and receives on the other. If TX connects to TX, the link stays down.","5.2"],
 [5,"A short fiber run measures much more loss than its budget allows. What should you do first?","Inspect and clean the connectors",["Replace the switch","Lower the MTU","Change the VLAN"],"Dirt on the connector end face is the most common cause of fiber loss. Inspect it with a fiber scope and clean it before replacing anything.","5.2"],
 [5,"A fiber cable was pulled tight around a sharp corner and the link now drops intermittently. What is the cause?","The bend radius was exceeded",["Crosstalk","An MTU mismatch","A duplex mismatch"],"Bending fiber tighter than its minimum radius lets light escape (macrobend loss) and can crack the glass.","5.2"],
 [5,"A technician terminates one end of a cable as T568A and the other end as T568B. What have they made?","A crossover cable",["A straight-through cable","A rollover cable","A loopback plug"],"A crossover swaps the transmit and receive pairs. Most modern ports have Auto-MDIX, but a crossover was once needed to connect like devices.","5.2"],
 [5,"Clients on a new VLAN get APIPA addresses. The DHCP server sits on a different subnet. What is missing?","A DHCP relay (IP helper) on the VLAN's gateway",["A DNS forwarder","An NTP server","A larger MTU"],"DHCP Discover messages are broadcasts that routers do not forward. An IP helper or relay agent forwards them to the server as unicast.","5.3"],
 [5,"A host loses connectivity at random and its event log shows an address conflict. What is the likely cause?","A duplicate IP address on the network",["A routing loop","A wrong subnet mask on the router","DNS cache poisoning"],"Two hosts with the same IP fight over ARP entries. Look for a statically assigned address inside the DHCP pool and use exclusions or reservations.","5.3"],
 [5,"A traceroute bounces between the same two routers until it shows TTL expired. What is happening?","A routing loop",["Asymmetric routing","Packet shaping","A duplex mismatch"],"Each router points to the other for the destination. TTL stops the packet from looping forever. Check the static routes and route redistribution.","5.3"],
 [5,"Pings work across a new VPN tunnel, but large file transfers stall. What is the most likely cause?","An MTU problem, with large packets dropped or unable to fragment",["A wrong DNS server","An expired DHCP lease","Too few VLANs"],"Tunnel headers reduce the usable MTU. Packets with the Don't Fragment bit set get dropped. Lower the MTU or adjust the TCP MSS on the tunnel.","5.3"],
 [5,"Traffic leaves through one firewall and returns through another, and the stateful firewall drops the replies. What is this called?","Asymmetric routing",["A routing loop","Split horizon","Route summarization"],"A stateful firewall that never saw the outbound session drops the return traffic. Keep both directions on the same path or share state between the firewalls.","5.3"],
 [5,"After a new access switch is installed, traffic takes a strange long path across the network. What is a likely cause?","The new switch became the spanning tree root bridge",["DHCP snooping is enabled","Jumbo frames are enabled","NTP is misconfigured"],"The switch with the lowest bridge priority, then the lowest MAC, becomes root. Set the priority on your intended core switch so a new switch cannot take over.","5.3"],
 [5,"A user moves to a new desk and now gets an IP address from another department's subnet. What is the most likely cause?","The new switch port is in the wrong VLAN",["The NIC is failing","The DNS suffix is wrong","The cable is a crossover"],"The access VLAN on the port decides which subnet and DHCP scope the user lands in. Check the port's VLAN assignment.","5.3"],
 [5,"After a firewall change, users can ping a web server but HTTPS connections time out. What should you check first?","ACL or firewall rules for TCP 443",["The DNS A record","The DHCP lease time","The STP root bridge"],"Ping (ICMP) working while one port fails points to a rule that blocks that port. Review the most recent change against the rule base.","5.3"],
 [5,"Some laptops show \"certificate not yet valid\" errors on every HTTPS site. What is the likely cause?","Their system clock is wrong, such as a failed NTP sync",["A full DHCP scope","A duplex mismatch","A wrong VLAN"],"Certificates have valid-from and valid-to dates. A clock that is wrong makes good certificates look invalid, and it also breaks Kerberos.","5.3"],
 [5,"Wi-Fi slows to a crawl in the break room whenever the microwave runs. What is happening?","RF interference in the 2.4 GHz band",["Co-channel interference from another AP","A duplex mismatch","An MTU mismatch"],"Microwave ovens leak energy around 2.4 GHz. Move clients to 5 or 6 GHz and confirm with a spectrum analyzer.","5.4"],
 [5,"Two neighboring access points are both set to channel 6. What problem does this cause?","Co-channel interference",["Adjacent-channel interference","Attenuation","Jitter from QoS"],"APs on the same channel must take turns on the air, which cuts throughput. Use channels 1, 6 and 11 so neighbors differ.","5.4"],
 [5,"A laptop stays connected to a distant AP with a weak signal even though a closer AP is available. What is this?","A sticky client, a roaming problem",["An evil twin","Channel bonding","A captive portal"],"Clients decide when to roam. Tune minimum RSSI, enable 802.11k/v/r, or lower transmit power so cells overlap less.","5.4"],
 [5,"Which RSSI reading shows the strongest Wi-Fi signal?","−55 dBm",["−70 dBm","−85 dBm","−95 dBm"],"RSSI is negative, so closer to zero is stronger. About −67 dBm or better is a common target for voice and video.","5.4"],
 [5,"A point-to-point wireless link reports a weak signal even with clear line of sight. One antenna is mounted vertically and the other horizontally. What is wrong?","The antenna polarization does not match",["The SSID is wrong","An encryption mismatch","Co-channel interference"],"Both antennas need the same polarization. A 90° mismatch can cost 20 dB or more.","5.4"],
 [5,"Which tool shows which TCP ports are open on a server?","nmap",["arp","tracert","ipconfig"],"nmap is a port scanner. Use it only on systems you are authorized to scan.","5.5"],
 [5,"Which tool captures packets and decodes each protocol field for analysis?","A protocol analyzer such as Wireshark",["A cable tester","A toner probe","A light meter"],"A protocol analyzer captures traffic, decodes headers and can follow TCP streams. tcpdump is the command-line equivalent.","5.5"],
 [5,"On a managed switch, which command shows which port a given MAC address was learned on?","show mac address-table",["show ip route","show vlan brief","show running-config"],"The MAC address table maps MACs to ports and VLANs. Combine it with the ARP table to trace an IP address to a physical port.","5.5"],
 [5,"How can you find out which switch and port sit at the other end of a cable in the wall?","LLDP or CDP neighbor information",["nslookup","A DHCP reservation","SNMP traps"],"LLDP (vendor-neutral) and CDP (Cisco) advertise a device's name, port and capabilities to its directly connected neighbors.","5.5"],
 [5,"Every morning at 9 AM the WAN link reaches 100% utilization and applications lag. What is the problem?","Bandwidth saturation (congestion)",["A routing loop","An APIPA address","A crossover cable"],"Use NetFlow to find the top traffic, then apply QoS, schedule bulk jobs off-peak or add bandwidth.","5.4"],
 [5,"Which tool shows the full RF picture, including non-Wi-Fi interference sources?","A spectrum analyzer",["A Wi-Fi analyzer","An OTDR","A multimeter"],"A Wi-Fi analyzer sees only 802.11 networks. A spectrum analyzer shows all RF energy, such as microwaves, cordless phones and Bluetooth.","5.5"],
 [4,"Which protection keeps data on a stolen laptop's drive unreadable?","Encryption of data at rest, such as full-disk encryption",["Encryption of data in transit","Hashing the files","A screened subnet"],"Data at rest is stored data, protected with disk or file encryption. Data in transit moves across a network and is protected with TLS, IPsec or SSH.","4.1"],
 [4,"In a PKI, what does a digital certificate bind together?","A public key and the identity of its owner",["A private key and a password","A MAC address and an IP address","A username and a password hash"],"A certificate authority (CA) signs the certificate to vouch for the binding. Self-signed certificates have no trusted third party behind them.","4.1"],
 [4,"Users sign in once and then reach many web applications without signing in again. What is this?","Single sign-on",["Multifactor authentication","Role-based access control","Least privilege"],"SSO lets one authentication grant access to many systems, often through SAML or OpenID Connect. It reduces password fatigue, but that one login becomes very valuable to protect.","4.1"],
 [4,"Which access control model grants permissions based on a person's job function?","Role-based access control",["Discretionary access control","Mandatory access control","Time-based access control"],"RBAC assigns permissions to roles, such as Help Desk or HR, and users get them by being placed in a role. Changing a job means changing the role, not every permission.","4.1"],
 [4,"A policy blocks sign-ins from devices outside the country where the company operates. What is this?","Geofencing",["Geotagging","Port security","Content filtering"],"Geofencing uses location, such as GPS or IP geolocation, to allow or block access. Geotagging only adds location data to files.","4.1"],
 [4,"An unpatched flaw in a web server's software is best described as what?","A vulnerability",["A threat","An exploit","A risk"],"A vulnerability is a weakness. A threat is something that could take advantage of it, an exploit is the method or code that does, and risk is the likelihood and impact of that happening.","4.1"],
 [4,"Which standard sets the security rules for organizations that handle credit card data?","PCI DSS",["GDPR","HIPAA","SOX"],"PCI DSS covers cardholder data. GDPR covers personal data of people in the EU and drives data locality rules. HIPAA covers US health data, and SOX covers financial reporting.","4.1"],
 [4,"When the same key both encrypts and decrypts data, what kind of encryption is it?","Symmetric encryption",["Asymmetric encryption","Hashing","Digital signing"],"Symmetric ciphers such as AES are fast but need a safe way to share the key. Asymmetric encryption uses a public and private key pair and is often used to exchange that symmetric key.","4.1"],
 [4,"Thousands of compromised hosts flood a web server until it stops responding. What is this attack?","DDoS",["On-path attack","VLAN hopping","Evil twin"],"A distributed denial-of-service attack comes from many sources, often a botnet, so blocking one IP does not stop it. Mitigations include upstream scrubbing services and rate limiting.","4.2"],
 [4,"An attacker secretly relays traffic between two hosts so they can read or change it. What is this?","An on-path attack",["A DDoS attack","Tailgating","MAC flooding"],"On-path, formerly called man-in-the-middle, often starts with ARP spoofing or a rogue AP. Encryption with certificate checks, such as TLS, defeats most of these attacks.","4.2"],
 [4,"Someone follows an employee through a badge-controlled door without scanning a badge. What is this?","Tailgating",["Shoulder surfing","Dumpster diving","Pretexting"],"Tailgating, also called piggybacking, defeats physical access control. Access control vestibules (mantraps) and security awareness training reduce it.","4.2"],
 [4,"An employee plugs a personal wireless router into the office network for better Wi-Fi. What is that device?","A rogue access point",["An evil twin","A honeypot","A wireless LAN controller"],"A rogue AP is any unauthorized AP connected to the network, and it bypasses your security controls. An evil twin is an AP that impersonates your SSID to trick users.","4.2"],
 [4,"Malware encrypts a company's files and demands payment for the key. What is it?","Ransomware",["A logic bomb","Spyware","Adware"],"Offline, tested backups are the main defense, along with patching and email filtering, since phishing often delivers it.","4.2"],
 [4,"An attacker changes DNS answers so users land on a fake banking site. What attack is this?","DNS poisoning",["ARP spoofing","VLAN hopping","Deauthentication"],"DNS poisoning (spoofing) corrupts name resolution, so the right name leads to the wrong IP. DNSSEC signs DNS records so resolvers can detect forged answers.","4.2"],
 [4,"An attacker sends forged frames that knock every client off a Wi-Fi network. What is this?","A deauthentication attack",["MAC flooding","DNS poisoning","Bluejacking"],"Older Wi-Fi management frames are not authenticated, so they can be forged. WPA3 requires protected management frames (802.11w), which blocks this attack.","4.2"],
 [4,"Which step most directly shrinks the attack surface of a new switch?","Disable unused ports and services",["Enable every port for future use","Keep the default admin password","Turn on Telnet for remote access"],"Device hardening also means changing default credentials, using SSH instead of Telnet, updating firmware and putting management on its own network.","4.3"],
 [4,"A firewall allows a few specific services. What happens to traffic that matches no rule?","It is dropped by the implicit deny",["It is allowed by default","It is logged and forwarded","It is sent to the screened subnet"],"Firewall ACLs are read top-down, and the first match wins. Anything that matches nothing hits the implicit deny at the end.","4.3"],
 [4,"Smart TVs and cameras should not share a network with company laptops. What should you do?","Put the IoT devices on their own segmented VLAN",["Give them static IPs on the user VLAN","Enable jumbo frames","Turn off DHCP"],"Segmentation limits how far an attacker can move from a weak device. Guest, BYOD, IoT and OT or ICS devices usually get their own segments with firewall rules between them.","4.3"],
 [4,"Which switch feature limits a port to a set number of learned MAC addresses?","Port security",["Port mirroring","Port forwarding","Port aggregation"],"Port security can shut down, restrict or protect a port when it sees too many or unknown MAC addresses. It defeats MAC flooding.","4.3"],
 [4,"Which control blocks employees from reaching gambling and known malware sites by category?","Content filtering",["Port security","NAT","A honeypot"],"Content or URL filtering checks requested sites against categories and reputation lists, often at a proxy or next-generation firewall.","4.3"],
 [1,"Which OSI layer handles encryption, compression and data format translation?","Layer 6, Presentation",["Layer 5, Session","Layer 7, Application","Layer 4, Transport"],"The Presentation layer converts data into a form both sides understand, including encryption and compression. The Session layer manages dialogs, the Application layer is where programs hand data to the network, and the Transport layer handles segments and ports.","1.1"],
 [1,"Which OSI layer sets up, manages and tears down dialogs between two applications?","Layer 5, Session",["Layer 4, Transport","Layer 6, Presentation","Layer 3, Network"],"The Session layer controls the conversation between hosts, including checkpoints and recovery. Transport moves segments, Presentation formats data, and Network routes packets.","1.1"],
 [1,"As data moves down the OSI model before it is sent, each layer adds its own header. What is this process called?","Encapsulation",["Decapsulation","Fragmentation","Multiplexing"],"Going down the stack, data becomes a segment, then a packet, then a frame (with a trailer), then bits. The receiver strips the headers off on the way up, which is decapsulation.","1.1"],
 [1,"Which device watches traffic for attack signatures and drops malicious packets inline before they reach the target?","IPS",["IDS","Proxy server","Load balancer"],"An IPS sits inline and blocks what it detects. An IDS watches a copy of the traffic and only raises alerts. A proxy makes requests for clients, and a load balancer spreads requests across servers.","1.2"],
 [1,"Which device spreads incoming client requests across a pool of web servers and stops sending traffic to a failed one?","A load balancer",["A proxy server","A wireless LAN controller","A layer 2 switch"],"Load balancers distribute connections with methods such as round robin or least connections, and health checks pull failed servers out of the pool. A proxy acts for clients, not for a server farm.","1.2"],
 [1,"Which device makes web requests on behalf of internal users and can cache and filter the content?","A proxy server",["A load balancer","A router","A NAS"],"A forward proxy sits between users and the internet. It hides client addresses, caches common content and enforces filtering. A NAS is file storage.","1.2"],
 [1,"Servers need block-level storage over a dedicated high-speed network, often using Fibre Channel or iSCSI. What provides it?","A SAN",["A NAS","A CDN","A proxy server"],"A SAN presents block storage that servers treat like local disks. A NAS shares files over the network with protocols such as SMB and NFS. A CDN caches web content close to users.","1.2"],
 [1,"Which service caches a website's content on servers around the world so users load it from a nearby location?","A CDN",["A SAN","A VPN","A proxy server"],"A content delivery network serves copies of static content from edge servers close to users, which cuts latency and takes load off the origin server.","1.2"],
 [1,"Which network function prioritizes voice and video over bulk file transfers when a link is busy?","QoS",["NAT","TTL","VPN"],"Quality of Service classifies and marks traffic, for example with DSCP values, then queues it so delay-sensitive traffic goes first. NAT translates addresses, TTL limits a packet's hops, and a VPN encrypts traffic.","1.2"],
 [1,"Which cloud concept means resources grow and shrink automatically as demand changes?","Elasticity",["Scalability","Multitenancy","Redundancy"],"Elasticity adds and removes resources automatically to match load. Scalability is the ability to grow to handle more load, whether or not it happens automatically. Multitenancy means many customers share the same infrastructure.","1.3"],
 [1,"In a public cloud, what gives your resources their own isolated private network with your own subnets and routing?","A VPC",["A NAT gateway","A CDN","A DMZ"],"A virtual private cloud is a logically isolated network inside the provider's cloud. You add subnets, route tables, security groups and gateways to it.","1.3"],
 [1,"Cloud servers on a private subnet need to download updates without accepting any inbound connections. What should you add?","A NAT gateway",["An internet gateway on the private subnet","A dedicated Direct Connect circuit","A load balancer"],"A NAT gateway lets private instances start outbound connections while blocking unsolicited inbound ones. An internet gateway gives public subnets two-way internet access. Direct Connect is a private link from your site to the provider.","1.3"],
 [1,"A company wants a dedicated private circuit from its data center to its cloud provider instead of a VPN over the internet. What is this called?","Direct Connect",["Site-to-site VPN","Internet gateway","Split tunnel"],"A dedicated connection (Direct Connect, ExpressRoute or Interconnect, depending on the provider) gives steadier bandwidth and latency than a VPN over the public internet, at a higher cost.","1.3"],
 [1,"Which technology runs network functions such as firewalls and routers as software on standard servers instead of dedicated appliances?","NFV",["SDN","VXLAN","PoE"],"Network functions virtualization replaces hardware appliances with virtual machines or containers. SDN separates the control plane from the data plane, which is a different idea, though the two are often used together.","1.3"],
 [1,"One IP address is advertised from several locations, and each user reaches the nearest one. What traffic type is this?","Anycast",["Multicast","Broadcast","Unicast"],"Anycast routes to the nearest of several hosts that share an address, as with public DNS resolvers. Multicast goes to a group of subscribers, broadcast goes to every host on the segment, and unicast goes to one host.","1.4"],
 [1,"Which IPsec protocol provides encryption as well as integrity and authentication?","ESP",["AH","IKE","GRE"],"Encapsulating Security Payload encrypts and authenticates. Authentication Header only authenticates and protects integrity, with no encryption. IKE negotiates the keys, and GRE is a tunnel with no security of its own.","1.4"],
 [1,"Which protocol builds simple tunnels that can carry multicast and routing protocol traffic but provides no encryption?","GRE",["ESP","SSH","L2TP"],"Generic Routing Encapsulation wraps many protocols, including multicast, inside IP. It is often combined with IPsec when the tunnel needs encryption.","1.4"],
 [1,"Which short cable has transceivers permanently attached to each end and is used to connect switches in the same rack?","A DAC cable",["Single-mode fiber","RG-6 coaxial cable","A rollover cable"],"Direct attach copper (twinaxial) cables are cheap, low-power links of a few meters between switches and servers. Fiber covers longer runs, RG-6 is coax for broadband and TV, and a rollover cable is for console access.","1.5"],
 [1,"Cable must run through the air-handling space above a drop ceiling. What type is required?","Plenum-rated cable",["Standard PVC cable","Shielded twisted pair","Direct attach copper"],"Plenum cable has a jacket that gives off less toxic smoke when it burns, which fire codes require in air-return spaces. Shielding protects against interference, not fire.","1.5"],
 [1,"Which transceiver form factor combines four lanes for 40 Gbps and 100 Gbps links?","QSFP",["SFP","GBIC","RJ45"],"QSFP packs four lanes into one module for 40 or 100 Gbps. SFP is a single lane, usually 1 Gbps (SFP+ reaches 10 Gbps). GBIC is an older, larger module, and RJ45 is a copper connector, not a transceiver.","1.5"],
 [1,"Which connector screws onto coaxial cable for cable modems and TV?","F-type",["BNC","RJ11","MPO"],"F-type is threaded and used with RG-6 coax. BNC is a bayonet twist-lock coax connector on older Ethernet and video gear, RJ11 is for phone lines, and MPO carries many fibers for high-density links.","1.5"],
 [1,"Which internet connection type usually has the highest latency because of how far the signal travels?","Satellite",["Cellular 5G","Fiber to the home","Cable broadband"],"Geostationary satellites orbit about 36,000 km up, so round trips take around 600 ms. Low earth orbit services cut that a lot. Cellular and wired links have much lower latency.","1.5"],
 [1,"Which data center design connects every access switch to every core switch, so any two servers are the same number of hops apart?","Spine and leaf",["Three-tier hierarchical","Bus","Ring"],"In spine and leaf, every leaf switch links to every spine switch, so server-to-server traffic always crosses exactly one spine. It suits heavy east-west traffic. Three-tier uses core, distribution and access layers.","1.6"],
 [1,"Traffic between servers inside the same data center is described as what?","East-west traffic",["North-south traffic","Broadcast traffic","Out-of-band traffic"],"East-west traffic stays inside the data center, between servers. North-south traffic enters or leaves it, for example between users and servers.","1.6"],
 [1,"In the three-tier hierarchical model, which layer connects end devices such as PCs and phones?","Access",["Distribution","Core","Spine"],"The access layer connects users and devices. The distribution layer aggregates access switches and applies policy, and the core moves traffic between distribution blocks as fast as possible.","1.6"],
 [1,"Branch offices connect only to headquarters, and branch-to-branch traffic passes through it. What topology is this?","Hub and spoke",["Full mesh","Point to point","Spine and leaf"],"Hub and spoke costs less than a full mesh but makes the hub a single point of failure and adds a hop between branches. Point to point links just two sites.","1.6"],
 [1,"Which IPv4 address class covers first octets 128 through 191, with a default /16 mask?","Class B",["Class A","Class C","Class D"],"Class A is 1–126 (/8), Class B is 128–191 (/16), Class C is 192–223 (/24), Class D (224–239) is multicast, and Class E is experimental. CIDR replaced classes, but the exam still asks about them.","1.7"],
 [1,"How many usable host addresses does a /26 subnet provide?","62",["64","30","126"],"A /26 leaves 6 host bits, so 2^6 = 64 addresses. Subtract the network and broadcast addresses to get 62 usable hosts. A /27 gives 30 and a /25 gives 126.","1.7"],
 [1,"Using different mask lengths inside one network, such as /30 for router links and /24 for user LANs, is called what?","VLSM",["CIDR","NAT","APIPA"],"Variable length subnet masking sizes each subnet to its need and saves addresses. CIDR is the classless notation and route summarization that VLSM builds on.","1.7"],
 [1,"Which technology steers branch traffic across MPLS, broadband and LTE links based on the application, with policies managed centrally?","SD-WAN",["VXLAN","Spanning tree","NAT64"],"Software-defined WAN is transport agnostic, application aware and centrally managed, and new branch devices often use zero-touch provisioning. VXLAN stretches Layer 2 networks across Layer 3.","1.8"],
 [1,"Which cloud-delivered model combines SD-WAN networking with security services such as secure web gateways and zero trust access?","SASE",["SIEM","SLAAC","VLSM"],"Secure Access Service Edge merges networking and security into one cloud service close to users. SSE is the security half on its own, without the SD-WAN networking.","1.8"],
 [1,"Router configurations live as templates in a version-controlled repository and are pushed out by automation. What practice is this?","Infrastructure as code",["Configuration drift","Zero-touch provisioning","Out-of-band management"],"IaC treats configurations like software: kept in source control, reviewed and deployed automatically. It prevents configuration drift, where devices slowly stop matching the intended configuration.","1.8"],
 [1,"An IPv6-only network must reach IPv4-only servers on the internet. Which translation method helps?","NAT64",["Dual stack","APIPA","PAT"],"NAT64, usually paired with DNS64, translates between IPv6 clients and IPv4 servers. Dual stack runs IPv4 and IPv6 side by side on the same hosts, which still needs IPv4 addresses on the clients.","1.8"],
 [2,"A router uses one physical interface with a logical interface for each VLAN to route between them. What are those logical interfaces called?","Subinterfaces",["Loopback interfaces","SVIs","Tunnel interfaces"],"Router-on-a-stick uses 802.1Q subinterfaces on one trunk link. An SVI does the same job inside a Layer 3 switch.","2.1"],
 [2,"A router has routes for 10.0.0.0/8, 10.1.0.0/16 and 10.1.1.0/24. Which one does it use for traffic to 10.1.1.50?","10.1.1.0/24",["10.0.0.0/8","10.1.0.0/16","It load-balances across all three"],"Routers choose the longest prefix match, the most specific route, before they look at administrative distance or metric.","2.1"],
 [2,"A switch port connects an IP phone, and a PC plugs into the phone. How do you keep the phone's traffic separate?","Configure a voice VLAN on the port",["Make the port a trunk with every VLAN","Enable jumbo frames","Disable spanning tree"],"A voice VLAN lets one access port carry tagged phone traffic and untagged PC traffic, so voice can get its own QoS treatment.","2.2"],
 [2,"What gives a Layer 3 switch an IP address in a VLAN so it can route for that VLAN?","An SVI",["A subinterface","A trunk port","The native VLAN"],"A switch virtual interface is a logical interface for a VLAN (for example interface vlan 10). Hosts in that VLAN use its address as their default gateway.","2.2"],
 [2,"Which access point feature nudges dual-band clients onto 5 GHz to relieve the crowded 2.4 GHz band?","Band steering",["Channel bonding","Beamforming","SSID hiding"],"Band steering delays or ignores 2.4 GHz probes from clients that can use 5 GHz. Channel bonding widens a channel, and beamforming focuses the signal toward a client.","2.3"],
 [2,"Several access points broadcast the same network name. What identifies each individual radio?","The BSSID",["The ESSID","The PSK","The channel width"],"The BSSID is usually the radio's MAC address. The SSID, or ESSID when it spans many APs, is the network name users see.","2.3"],
 [2,"Guests must accept terms of use on a web page before the guest Wi-Fi gives them internet access. What is this?","A captive portal",["WPA3-Enterprise","MAC filtering","A RADIUS proxy"],"A captive portal sends new clients to a web page for terms, a voucher or a login before it lets their traffic through.","2.3"],
 [2,"A company wants each employee to join Wi-Fi with their own directory credentials instead of one shared password. What should it use?","WPA3-Enterprise with 802.1X",["WPA3-Personal","WPA2 with a pre-shared key","An open network with a captive portal"],"Enterprise mode authenticates each user through 802.1X and RADIUS, so access can be revoked per person. Personal mode uses one shared passphrase.","2.3"],
 [2,"Access points must avoid radar on some 5 GHz channels and lower their power when needed. Which amendment covers this?","802.11h",["802.11ax","802.11ac","802.11i"],"802.11h added dynamic frequency selection (DFS) and transmit power control (TPC) to meet regulations in the 5 GHz band. 802.11i is the security amendment behind WPA2.","2.3"],
 [2,"In a multi-floor building, what is the room where the provider's lines enter and the core equipment sits?","The MDF",["An IDF","A screened subnet","A demarc extension"],"The main distribution frame holds the core switches and the service provider handoff. Each floor's intermediate distribution frame connects back to it.","2.4"],
 [2,"Rack switches have port-side exhaust. How should they face in a hot aisle/cold aisle layout?","With the port side toward the hot aisle",["With the port side toward the cold aisle","Sideways to the aisles","Either way, since switches run cool"],"Port-side exhaust means hot air leaves from the port side, so that side must face the hot aisle. Getting airflow direction wrong recirculates hot air and causes overheating.","2.4"],
 [2,"Which rack device splits one power feed across many devices, often with per-outlet monitoring?","A power distribution unit",["An uninterruptible power supply","A surge-only power strip","A generator transfer switch"],"A rack power distribution unit distributes and meters power. A UPS provides battery backup during short outages. On the exam, the abbreviation PDU can mean this or a protocol data unit, so read the context.","2.4"],
 [2,"What keeps network gear running through a brief power outage and gives a generator time to start?","A UPS",["A power distribution unit","A fiber distribution panel","A surge protector"],"An uninterruptible power supply runs equipment from batteries for minutes. Generators cover long outages. A surge protector only clips voltage spikes.","2.4"],
 [2,"Why do data centers often use clean-agent gas fire suppression instead of water sprinklers?","It puts out fires without damaging electronics",["It is cheaper to install","It works without any fire detection","Building codes forbid sprinklers"],"Clean agents stop the fire and leave no residue. Sprinklers can ruin equipment, although pre-action systems reduce accidental discharge.","2.4"],
 [2,"Which humidity condition can damage electronics through static discharge?","Humidity that is too low",["Humidity that is too high","Humidity that changes during the day","Any humidity above 20%"],"Dry air builds static that can discharge into components. Too much humidity causes condensation and corrosion, so data centers keep it in a moderate band, roughly 40–60%.","2.4"],
 [3,"Which tool tracks assigned IP addresses and subnets, together with DHCP and DNS data, in one place?","IPAM",["SIEM","NetFlow","A rack diagram"],"IP address management software prevents conflicts and helps plan subnets. A SIEM correlates security logs, and NetFlow reports traffic flows.","3.1"],
 [3,"A vendor announces the date it will stop releasing patches for a switch model. What lifecycle milestone is that?","End of support",["End of life","Decommissioning","Warranty renewal"],"End of life usually means the product is no longer sold. End of support means no more fixes or security patches, which makes the device a risk to keep running.","3.1"],
 [3,"An approved, known-good configuration that devices are compared against is called what?","A golden configuration",["A running configuration","A backup configuration","A change request"],"The baseline or golden configuration is the approved standard, and comparing devices to it reveals configuration drift. A backup is just a saved copy of whatever was running.","3.1"],
 [3,"An SNMP agent reports a link going down to the management station without being asked. What is that message?","A trap",["A get request","A set request","A walk"],"Traps (UDP 162) are unsolicited alerts from agents. Get requests poll a value, set requests change one, and a walk reads a whole branch of values.","3.2"],
